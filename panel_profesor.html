<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aulas y alumnos asignados al profesor.">
  <title>Panel del profesor | Docére</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --page: #f4f7fb;
      --surface: #fff;
      --ink: #142033;
      --muted: #64748b;
      --line: #dce4ee;
      --blue: #155eef;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px max(20px, calc((100vw - 1160px) / 2)); background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .brand-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 7px; background: #eaf1ff; color: var(--blue); }
    .identity { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 14px; }
    .logout { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); cursor: pointer; }
    main { width: min(1160px, calc(100% - 40px)); margin: 30px auto; }
    .heading { margin-bottom: 22px; }
    h1 { margin: 0 0 5px; font-size: 26px; }
    .heading p { margin: 0; color: var(--muted); }
    .status { min-height: 24px; margin-bottom: 12px; color: var(--muted); font-size: 14px; }
    .class-list { display: grid; gap: 14px; }
    .classroom { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .classroom-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .classroom-header h2 { margin: 0 0 4px; font-size: 18px; }
    .classroom-header p { margin: 0; color: var(--muted); font-size: 14px; }
    .student-count { padding: 5px 9px; border-radius: 20px; background: #edf2f8; color: var(--muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .students { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 14px 18px 18px; }
    .student { min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; }
    .student-name { display: block; margin-bottom: 3px; font-weight: 650; overflow-wrap: anywhere; }
    .student-email { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .attendance { display: grid; gap: 12px; padding: 0 18px 18px; }
    .attendance-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
    .attendance-controls label { display: grid; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .attendance-controls input { min-height: 38px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; }
    .attendance-list { display: grid; gap: 7px; }
    .attendance-student { display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    .attendance-student input { width: 17px; height: 17px; margin: 0; accent-color: var(--blue); }
    .attendance-save { min-height: 38px; padding: 0 13px; border: 0; border-radius: 5px; background: var(--blue); color: white; font: inherit; font-weight: 650; cursor: pointer; }
    .attendance-save:disabled { opacity: .6; cursor: wait; }
    .attendance-status { min-height: 18px; margin: 0; color: var(--muted); font-size: 13px; }
    .empty { padding: 32px 18px; border: 1px dashed var(--line); border-radius: 8px; background: rgba(255,255,255,.6); color: var(--muted); text-align: center; }
    @media (max-width: 620px) {
      .topbar { padding: 11px 14px; }
      .teacher-email { display: none; }
      main { width: calc(100% - 28px); margin: 22px auto; }
      h1 { font-size: 23px; }
      .students { grid-template-columns: 1fr; padding: 12px; }
      .classroom-header { padding: 14px 12px; }
      .attendance { padding: 0 12px 12px; }
      .logout { padding: 0 9px; }
      .logout span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon"><i data-lucide="graduation-cap"></i></span><span>Portal Docére</span></div>
    <div class="identity">
      <span id="teacherName">Profesor</span>
      <span class="teacher-email" id="teacherEmail"></span>
      <button class="logout" id="logoutButton" type="button"><i data-lucide="log-out"></i><span>Cerrar sesión</span></button>
    </div>
  </header>

  <main>
    <section class="heading">
      <h1>Mis aulas</h1>
      <p>Consulta los grupos y alumnos que te asignó la administración.</p>
    </section>
    <p class="status" id="status" role="status">Verificando acceso...</p>
    <section class="class-list" id="classList" aria-label="Aulas asignadas"></section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, query, where, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC64X_uSvL_Sn1WQLw7ZV9QDme2aOfV5ag",
      authDomain: "docere-931ec.firebaseapp.com",
      projectId: "docere-931ec",
      storageBucket: "docere-931ec.firebasestorage.app",
      messagingSenderId: "1005663843239",
      appId: "1:1005663843239:web:d8f6c7524a5d10bf797c82",
      measurementId: "G-B6TDT4VE7S"
    };

    const sessionKey = 'teacherSession';
    const activityKey = 'teacherSessionLastActivity';
    const session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
    const status = document.getElementById('status');
    const classList = document.getElementById('classList');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let idleTimer;

    function endSession() {
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(activityKey);
      window.location.replace('login.html');
    }

    function recordActivity() {
      const lastActivity = Number(localStorage.getItem(activityKey));
      if (!Number.isFinite(lastActivity) || Date.now() - lastActivity >= 60 * 60 * 1000) {
        endSession();
        return;
      }
      localStorage.setItem(activityKey, String(Date.now()));
      clearTimeout(idleTimer);
      idleTimer = setTimeout(endSession, 60 * 60 * 1000);
    }

    ['click', 'keydown', 'pointerdown', 'touchstart'].forEach((eventName) => {
      document.addEventListener(eventName, recordActivity, { passive: true });
    });
    document.getElementById('logoutButton').addEventListener('click', endSession);

    function addText(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      element.className = className;
      element.textContent = text;
      parent.append(element);
      return element;
    }

    function getLocalDateString() {
      const now = new Date();
      const localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return localDate.toISOString().slice(0, 10);
    }

    async function loadAttendance(aula, dateInput, attendanceList, statusText, saveButton) {
      const date = dateInput.value;
      if (!date) {
        statusText.textContent = 'Selecciona una fecha para consultar la asistencia.';
        return;
      }

      saveButton.disabled = true;
      dateInput.disabled = true;
      statusText.textContent = 'Cargando asistencia...';
      try {
        const attendanceSnapshot = await getDoc(doc(db, 'Aulas', aula.id, 'asistencias', date));
        const attendanceData = attendanceSnapshot.exists() ? attendanceSnapshot.data() : {};
        const attendanceByStudent = new Map(
          (Array.isArray(attendanceData.alumnos) ? attendanceData.alumnos : [])
            .map((student) => [`${student.coleccion}/${student.id}`, student.presente === true])
        );

        attendanceList.replaceChildren();
        (Array.isArray(aula.alumnos) ? aula.alumnos : []).forEach((student) => {
          const label = document.createElement('label');
          label.className = 'attendance-student';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = `${student.coleccion}/${student.id}`;
          checkbox.checked = attendanceByStudent.get(checkbox.value) === true;
          const name = document.createElement('span');
          name.textContent = student.nombre || 'Alumno';
          label.append(checkbox, name);
          attendanceList.append(label);
        });

        if (!aula.alumnos?.length) {
          addText(attendanceList, 'p', 'attendance-status', 'Este grupo aún no tiene alumnos asignados.');
        }
        statusText.textContent = attendanceSnapshot.exists()
          ? `Asistencia del ${date} cargada. Marca a los alumnos presentes.`
          : `Sin asistencia guardada para el ${date}. Marca a los alumnos presentes.`;
      } catch (error) {
        console.error(`No se pudo cargar la asistencia del aula ${aula.id} para ${date}:`, error);
        attendanceList.replaceChildren();
        statusText.textContent = 'No se pudo cargar la asistencia. Revisa los permisos de Firestore y la conexión.';
      } finally {
        dateInput.disabled = false;
        saveButton.disabled = false;
      }
    }

    function renderClasses(records) {
      classList.replaceChildren();
      if (!records.length) {
        addText(classList, 'div', 'empty', 'Todavía no tienes aulas asignadas. Pide al administrador que revise el profesor seleccionado en el aula.');
        return;
      }

      records.forEach((record) => {
        const classroom = document.createElement('article');
        classroom.className = 'classroom';
        const header = document.createElement('header');
        header.className = 'classroom-header';
        const heading = document.createElement('div');
        addText(heading, 'h2', '', record.nombre || 'Aula');
        addText(heading, 'p', '', record.curso || 'Curso sin especificar');
        addText(header, 'span', 'student-count', `${record.alumnos?.length || 0} alumnos`);
        header.prepend(heading);
        classroom.append(header);

        const students = document.createElement('div');
        students.className = 'students';
        (record.alumnos || []).forEach((student) => {
          const studentCard = document.createElement('div');
          studentCard.className = 'student';
          addText(studentCard, 'span', 'student-name', student.nombre || 'Alumno');
          addText(studentCard, 'span', 'student-email', student.email || 'Correo no disponible');
          students.append(studentCard);
        });
        if (!record.alumnos?.length) {
          addText(students, 'p', 'attendance-status', 'Este grupo todavía no tiene alumnos asignados.');
        }
        classroom.append(students);

        const attendance = document.createElement('form');
        attendance.className = 'attendance';
        const controls = document.createElement('div');
        controls.className = 'attendance-controls';
        const dateLabel = document.createElement('label');
        dateLabel.textContent = 'Fecha de asistencia';
        const dateInput = document.createElement('input');
        dateInput.type = 'date';
        dateInput.value = getLocalDateString();
        dateLabel.append(dateInput);
        const saveButton = document.createElement('button');
        saveButton.className = 'attendance-save';
        saveButton.type = 'submit';
        saveButton.textContent = 'Guardar asistencia';
        controls.append(dateLabel, saveButton);
        const attendanceList = document.createElement('div');
        attendanceList.className = 'attendance-list';
        const attendanceStatus = document.createElement('p');
        attendanceStatus.className = 'attendance-status';
        attendanceStatus.setAttribute('role', 'status');
        attendance.append(controls, attendanceList, attendanceStatus);
        attendance.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!dateInput.value) {
            attendanceStatus.textContent = 'Selecciona una fecha para guardar la asistencia.';
            return;
          }
          saveButton.disabled = true;
          attendanceStatus.textContent = 'Guardando asistencia...';
          try {
            const alumnos = Array.from(attendanceList.querySelectorAll('input[type="checkbox"]'), (checkbox) => {
              const [coleccion, id] = checkbox.value.split('/');
              const student = aula.alumnos.find((item) => item.id === id && item.coleccion === coleccion);
              return {
                id,
                coleccion,
                nombre: student?.nombre || 'Alumno',
                presente: checkbox.checked
              };
            });
            await setDoc(doc(db, 'Aulas', aula.id, 'asistencias', dateInput.value), {
              fecha: dateInput.value,
              profesorUid: session.uid,
              alumnos,
              actualizadoEn: serverTimestamp()
            });
            attendanceStatus.textContent = `Asistencia del ${dateInput.value} guardada correctamente.`;
          } catch (error) {
            console.error(`No se pudo guardar la asistencia del aula ${aula.id}:`, error);
            attendanceStatus.textContent = 'No se pudo guardar la asistencia. Revisa los permisos de Firestore y la conexión.';
          } finally {
            saveButton.disabled = false;
          }
        });
        dateInput.addEventListener('change', () => {
          loadAttendance(aula, dateInput, attendanceList, attendanceStatus, saveButton);
        });
        classroom.append(attendance);
        classList.append(classroom);
        loadAttendance(aula, dateInput, attendanceList, attendanceStatus, saveButton);
      });
    }

    document.getElementById('teacherName').textContent = session?.nombre || 'Profesor';
    document.getElementById('teacherEmail').textContent = session?.email || '';

    if (!session?.uid || !session?.teacherDocId || !session?.email || !Number.isFinite(Number(localStorage.getItem(activityKey)))) {
      endSession();
    } else {
      (async () => {
        try {
          const teacherSnapshot = await getDoc(doc(db, 'Profesores', session.teacherDocId));
          if (!teacherSnapshot.exists() || teacherSnapshot.data().email !== session.email) {
            endSession();
            return;
          }

          const teacherIds = [...new Set([session.uid, session.teacherDocId, session.email].filter(Boolean))];
          const aulaQueries = [
            ['profesorDocId', session.teacherDocId],
            ['profesorEmail', session.email],
            ['profesor.email', session.email],
            ...teacherIds.map((teacherId) => ['profesorUid', teacherId])
          ];
          const queryResults = await Promise.all(aulaQueries.map(async ([field, value]) => {
            try {
              return await getDocs(query(collection(db, 'Aulas'), where(field, '==', value)));
            } catch (error) {
              console.error(`No se pudieron buscar aulas por ${field}:`, error);
              return null;
            }
          }));
          const successfulQueries = queryResults.filter(Boolean);
          if (!successfulQueries.length) {
            throw new Error('No se pudo consultar ninguna de las formas de asignación de aulas.');
          }
          const aulasById = new Map();
          successfulQueries.forEach((snapshot) => {
            snapshot.docs.forEach((document) => {
              aulasById.set(document.id, { id: document.id, ...document.data() });
            });
          });
          const aulas = Array.from(aulasById.values());
          status.textContent = aulas.length
            ? `${aulas.length} aulas asignadas`
            : 'No se encontraron aulas para este profesor. Verifica la asignación desde el panel administrativo.';
          renderClasses(aulas);
          if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (error) {
          console.error('No se pudieron cargar las aulas del profesor:', error);
          status.textContent = 'No se pudieron consultar tus aulas. Revisa los permisos de lectura de la colección Aulas en Firestore.';
          renderClasses([]);
        }
      })();
    }

    window.addEventListener('storage', (event) => {
      if (event.key === sessionKey && !event.newValue) endSession();
    });
    idleTimer = setTimeout(endSession, Math.max(0, 60 * 60 * 1000 - (Date.now() - Number(localStorage.getItem(activityKey)))));
  </script>
</body>
</html>
