                formStatus.textContent = 'Publicación eliminada.';
                await loadPublications();
              } catch (error) {
                console.error(`No se pudo eliminar la publicación ${record.id} del aula ${aula.id}:`, error);
                formStatus.textContent = 'No se pudo eliminar la publicación. Revisa los permisos de Firestore.';
                deleteButton.disabled = false;
              }
            });
            actions.append(editButton, deleteButton);
            header.append(actions);

            const dateText = record.fecha
              ? new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(`${record.fecha}T12:00:00`))
              : 'Sin fecha';
            const meta = document.createElement('p');
            meta.className = 'announcement-meta';
            meta.textContent = `${dateText}${record.lugar ? ` · ${record.lugar}` : ''}`;

            const body = document.createElement('div');
            body.className = 'announcement-body';
            body.innerHTML = sanitizeAnnouncementHtml(record.descripcion || 'Sin descripción.');

            card.append(header, meta, body);
            publicationList.append(card);
          });
        } catch (error) {
          console.error(`No se pudieron cargar las publicaciones del aula ${aula.id}:`, error);
          addText(publicationList, 'p', 'attendance-status', 'No se pudieron cargar las publicaciones. Revisa los permisos de Firestore.');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const descripcion = sanitizeAnnouncementHtml(descriptionEditor.innerHTML).trim();
        const descriptionText = new DOMParser().parseFromString(descripcion, 'text/html').body.textContent.trim();
        const publicationData = {
          titulo: titleInput.value.trim(),
          fecha: dateInput.value,
          lugar: locationInput.value.trim(),
          descripcion,
          aulaId: aula.id,
          aulaNombre: aula.nombre || 'Aula',
          profesorNombre: session.nombre || 'Profesor',
          profesorDocId: session.teacherDocId,
          actualizadoEn: serverTimestamp()
        };

        if (!publicationData.titulo || !publicationData.fecha || !descriptionText) {
          formStatus.textContent = 'Completa el título, la fecha y la descripción.';
          return;
        }

        publishButton.disabled = true;
        const wasEditingPublication = Boolean(editingPublicationId);
        formStatus.textContent = editingPublicationId ? 'Guardando cambios...' : 'Guardando publicación...';
        try {
          let notificationSaved = true;
          if (editingPublicationId) {
            await updateDoc(doc(db, 'Aulas', aula.id, 'publicaciones', editingPublicationId), publicationData);
          } else {
            const publicationRef = doc(collection(db, 'Aulas', aula.id, 'publicaciones'));
            await setDoc(publicationRef, {
              ...publicationData,
              creadoEn: serverTimestamp()
            });
            try {
              await notifyStudents(aula.alumnos, {
                id: publicationRef.id,
                aulaId: aula.id,
                aulaNombre: aula.nombre || 'Aula',
                titulo: publicationData.titulo,
                tipo: 'evento',
                tipoTexto: 'Nuevo evento',
                fecha: publicationData.fecha,
                lugar: publicationData.lugar,
                descripcion: publicationData.descripcion
              });
            } catch (notificationError) {
              console.error(`La publicación ${publicationRef.id} se guardó, pero no se pudieron guardar todas las notificaciones:`, notificationError);
              notificationSaved = false;
            }
          }
          resetPublicationForm();
          formStatus.textContent = wasEditingPublication
            ? 'Cambios guardados correctamente.'
            : notificationSaved
              ? 'Publicación guardada y notificaciones enviadas a los alumnos.'
              : 'La publicación se guardó, pero no se pudieron guardar todas las notificaciones.';
          await loadPublications();
        } catch (error) {
          console.error(`No se pudo guardar la publicación del aula ${aula.id}:`, error);
          formStatus.textContent = 'No se pudo guardar la publicación. Revisa los permisos de Firestore.';
        } finally {
          publishButton.disabled = false;
        }
      });

      try {
        await loadPublications();
      } catch (error) {
        console.error(`No se pudo inicializar la lista de publicaciones del aula ${aula.id}:`, error);
      }
      return publications;
    }

    async function renderAttendance(aula) {
      const attendance = document.createElement('section');
      attendance.className = 'attendance';
      const controls = document.createElement('div');
      controls.className = 'attendance-controls';
      const dateLabel = document.createElement('label');
      dateLabel.textContent = 'Fecha de clase';
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = getLocalDateString();
      dateLabel.append(dateInput);
      const saveButton = document.createElement('button');
      saveButton.className = 'attendance-save';
      saveButton.type = 'button';
      saveButton.textContent = 'Guardar asistencia';
      controls.append(dateLabel, saveButton);
      const attendanceSummary = document.createElement('div');
      attendanceSummary.className = 'attendance-summary';
      const roster = document.createElement('div');
      roster.className = 'attendance-roster';
      const historyContainer = document.createElement('div');
      const attendanceStatusText = document.createElement('p');
      attendanceStatusText.className = 'attendance-status';
      attendanceStatusText.setAttribute('role', 'status');
      attendance.append(controls, attendanceSummary, roster, attendanceStatusText, historyContainer);
      let savedSessions = [];
      let openAttendanceMenu = null;

      function closeAttendanceMenu() {
        if (!openAttendanceMenu) return;
        openAttendanceMenu.hidden = true;
        openAttendanceMenu = null;
      }

      function renderHistory() {
        attendanceSummary.replaceChildren();
        historyContainer.replaceChildren();
        if (!savedSessions.length || !aula.alumnos.length) {
          addText(attendanceSummary, 'span', 'attendance-stat', 'Los porcentajes aparecerán después de guardar asistencias.');
        } else {
          const totals = { asistencia: 0, falta: 0, retardo: 0, justificado: 0 };
          const assignedStudents = new Set(aula.alumnos.map((student) => `${student.coleccion}/${student.id}`));
          let totalMarks = 0;
          savedSessions.forEach((record) => {
            record.alumnos.forEach((student) => {
              if (!assignedStudents.has(`${student.coleccion}/${student.id}`)) return;
              const state = attendanceStatus(student);
              totals[state] += 1;
              totalMarks += 1;
            });
          });
          const percent = (value) => totalMarks ? Math.round((value / totalMarks) * 100) : 0;
          [
            ['Asistencia', totals.asistencia],
            ['Faltas', totals.falta],
            ['Retardos', totals.retardo],
            ['Justificados', totals.justificado]
          ].forEach(([label, count]) => {
            addText(attendanceSummary, 'span', 'attendance-stat', `${label}: ${percent(count)}%`);
          });
        }

        if (!savedSessions.length) {
          addText(historyContainer, 'p', 'tab-placeholder', 'Aún no hay fechas de asistencia guardadas.');
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'attendance-history-wrap';
        const table = document.createElement('table');
        table.className = 'attendance-history';
        const head = document.createElement('thead');
        const headerRow = document.createElement('tr');
        addText(headerRow, 'th', '', 'Alumno');
        savedSessions.forEach((record) => {
          const header = addText(headerRow, 'th', '', '');
          const dateHeader = document.createElement('div');
          dateHeader.className = 'attendance-date-header';
          addText(dateHeader, 'span', '', formatAttendanceDate(record.fecha));
          const deleteButton = addText(dateHeader, 'button', 'attendance-delete-date', '×');
          deleteButton.type = 'button';
          deleteButton.title = 'Eliminar pase de asistencia';
          deleteButton.setAttribute('aria-label', `Eliminar asistencia del ${formatAttendanceDate(record.fecha)}`);
          deleteButton.addEventListener('click', async () => {
            const formattedDate = formatAttendanceDate(record.fecha);
            if (!confirm(`¿Eliminar el pase de asistencia del ${formattedDate}? Se borrarán todos los registros de ese día y no se puede deshacer.`)) return;

            deleteButton.disabled = true;
            attendanceStatusText.textContent = `Eliminando el pase del ${formattedDate}...`;
            try {
              await deleteDoc(doc(db, 'Aulas', aula.id, 'asistencias', record.id));
              savedSessions = savedSessions.filter((session) => session.id !== record.id);
              renderHistory();
              attendanceStatusText.textContent = `Se eliminó el pase de asistencia del ${formattedDate}.`;
              if (dateInput.value === record.fecha) await loadSelectedDate();
            } catch (error) {
              console.error(`No se pudo eliminar la asistencia del aula ${aula.id} para ${record.fecha}:`, error);
              attendanceStatusText.textContent = 'No se pudo eliminar el pase. Revisa los permisos de eliminación de Firestore.';
              deleteButton.disabled = false;
            }
          });
          header.append(dateHeader);
        });
        ['% Asistencia', '% Falta', '% Retardo', '% Justificado'].forEach((label) => addText(headerRow, 'th', '', label));
        head.append(headerRow);
        const body = document.createElement('tbody');
        aula.alumnos.forEach((student) => {
          const studentKey = `${student.coleccion}/${student.id}`;
          const row = document.createElement('tr');
          addText(row, 'td', '', student.nombre || 'Alumno');
          const totals = { asistencia: 0, falta: 0, retardo: 0, justificado: 0 };
          let recordedSessions = 0;
          savedSessions.forEach((record) => {
            const attendanceRecord = record.alumnos.find((item) => `${item.coleccion}/${item.id}` === studentKey);
            const cell = document.createElement('td');
            if (attendanceRecord) {
              const state = attendanceStatus(attendanceRecord);
              totals[state] += 1;
              recordedSessions += 1;
              const stateClass = {
                asistencia: 'attended',
                falta: 'absent',
                retardo: 'late',
                justificado: 'justified'
              }[state];
              cell.className = `state-${stateClass}`;
            }
            const stateLabels = {
              asistencia: 'Asistencia',
              falta: 'Falta',
              retardo: 'Retardo',
              justificado: 'Justificado'
            };
            const cellTrigger = addText(cell, 'button', 'attendance-cell-trigger', attendanceRecord
              ? stateLabels[attendanceStatus(attendanceRecord)]
              : '—');
            cellTrigger.type = 'button';
            cellTrigger.setAttribute('aria-label', `${student.nombre || 'Alumno'}, ${record.fecha}: ${cellTrigger.textContent}. Clic para cambiar`);
            const menu = document.createElement('div');
            menu.className = 'attendance-cell-menu';
            menu.hidden = true;
            const stateSelect = document.createElement('select');
            stateSelect.setAttribute('aria-label', `Cambiar asistencia de ${student.nombre || 'alumno'} para ${formatAttendanceDate(record.fecha)}`);
            [
              ['asistencia', 'Asistencia'],
              ['retardo', 'Retardo'],
              ['falta', 'Falta'],
              ['justificado', 'Justificado']
            ].forEach(([value, label]) => stateSelect.add(new Option(label, value)));
            if (attendanceRecord) stateSelect.value = attendanceStatus(attendanceRecord);
            stateSelect.addEventListener('change', async () => {
              const previousState = attendanceRecord ? attendanceStatus(attendanceRecord) : null;
              const newState = stateSelect.value;
              stateSelect.disabled = true;
              attendanceStatusText.textContent = `Actualizando asistencia de ${student.nombre || 'alumno'}...`;
              try {
                const updatedStudents = [...record.alumnos];
                const recordIndex = updatedStudents.findIndex((item) => `${item.coleccion}/${item.id}` === studentKey);
                const studentRecord = {
                  ...(recordIndex >= 0 ? updatedStudents[recordIndex] : student),
                  id: student.id,
                  coleccion: student.coleccion,
                  nombre: student.nombre || 'Alumno',
                  email: student.email || '',
                  estado: newState,
                  presente: newState !== 'falta'
                };
                if (recordIndex >= 0) updatedStudents[recordIndex] = studentRecord;
                else updatedStudents.push(studentRecord);
                await updateDoc(doc(db, 'Aulas', aula.id, 'asistencias', record.id), {
                  alumnos: updatedStudents,
                  actualizadoEn: serverTimestamp()
                });
                record.alumnos = updatedStudents;
                const rosterSelect = Array.from(roster.querySelectorAll('select[data-student-key]'))
                  .find((select) => select.dataset.studentKey === studentKey);
                if (rosterSelect && dateInput.value === record.fecha) rosterSelect.value = newState;
                closeAttendanceMenu();
                renderHistory();
                attendanceStatusText.textContent = `Asistencia de ${student.nombre || 'alumno'} para ${formatAttendanceDate(record.fecha)} actualizada.`;
              } catch (error) {
                console.error(`No se pudo actualizar la asistencia del aula ${aula.id}, fecha ${record.fecha}, alumno ${studentKey}:`, error);
                attendanceStatusText.textContent = 'No se pudo actualizar la asistencia. Revisa los permisos de escritura de Firestore.';
                stateSelect.value = previousState || 'falta';
                stateSelect.disabled = false;
              }
            });
            menu.append(stateSelect);
            cellTrigger.addEventListener('click', () => {
              if (openAttendanceMenu && openAttendanceMenu !== menu) closeAttendanceMenu();
              menu.hidden = !menu.hidden;
              openAttendanceMenu = menu.hidden ? null : menu;
              if (!menu.hidden) stateSelect.focus();
            });
            cell.append(menu);
            row.append(cell);
          });
          const percent = (value) => recordedSessions ? `${Math.round((value / recordedSessions) * 100)}%` : '—';
          addText(row, 'td', 'state-attended', percent(totals.asistencia));
          addText(row, 'td', 'state-absent', percent(totals.falta));
          addText(row, 'td', 'state-late', percent(totals.retardo));
          addText(row, 'td', 'state-justified', percent(totals.justificado));
          body.append(row);
        });
        table.append(head, body);
        wrapper.append(table);
        historyContainer.append(wrapper);
      }

      function renderRoster(statusByStudent = new Map()) {
        roster.replaceChildren();
        if (!aula.alumnos.length) {
          addText(roster, 'p', 'tab-placeholder', 'El administrador todavía no asigna alumnos a esta aula.');
          return;
        }
        aula.alumnos.forEach((student) => {
          const row = document.createElement('label');
          row.className = 'attendance-row';
          const identity = document.createElement('span');
          identity.className = 'attendance-row-name';
          identity.append(document.createTextNode(student.nombre || 'Alumno'));
          if (student.email) addText(identity, 'span', 'attendance-row-email', student.email);
          const select = document.createElement('select');
          select.setAttribute('aria-label', `Estado de ${student.nombre || 'alumno'}`);
          [
            ['asistencia', 'Asistencia'],
            ['falta', 'Falta'],
            ['retardo', 'Retardo'],
            ['justificado', 'Justificado']
          ].forEach(([value, label]) => select.add(new Option(label, value)));
          select.value = statusByStudent.get(`${student.coleccion}/${student.id}`) || 'falta';
          select.dataset.studentKey = `${student.coleccion}/${student.id}`;
          row.append(identity, select);
          roster.append(row);
        });
      }

      async function loadSavedSessions() {
        attendanceStatusText.textContent = 'Cargando historial...';
        try {
          const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'asistencias'));
          savedSessions = snapshot.docs.map((sessionDoc) => {
            const data = sessionDoc.data();
            return {
              id: sessionDoc.id,
              fecha: data.fecha || sessionDoc.id,
              alumnos: Array.isArray(data.alumnos) ? data.alumnos : []
            };
          }).sort((left, right) => right.fecha.localeCompare(left.fecha));
          renderHistory();
          attendanceStatusText.textContent = savedSessions.length
            ? `${savedSessions.length} fecha(s) de clase guardada(s).`
            : 'Selecciona una fecha, marca el estado de cada alumno y guarda la asistencia.';
        } catch (error) {
          console.error(`No se pudo cargar el historial del aula ${aula.id}:`, error);
          attendanceStatusText.textContent = 'No se pudo cargar el historial. Revisa los permisos de lectura de Firestore.';
        }
      }

      async function loadSelectedDate() {
        const date = dateInput.value;
        if (!date) return;
        saveButton.disabled = true;
        dateInput.disabled = true;
        attendanceStatusText.textContent = 'Cargando asistencia de la fecha...';
        try {
          const snapshot = await getDoc(doc(db, 'Aulas', aula.id, 'asistencias', date));
          const records = snapshot.exists() && Array.isArray(snapshot.data().alumnos) ? snapshot.data().alumnos : [];
          const statusByStudent = new Map(records.map((student) => [
            `${student.coleccion}/${student.id}`,
            attendanceStatus(student)
          ]));
          renderRoster(statusByStudent);
          attendanceStatusText.textContent = snapshot.exists()
            ? `Asistencia del ${formatAttendanceDate(date)} cargada.`
            : `No hay asistencia para ${formatAttendanceDate(date)}. Selecciona el estado de cada alumno.`;
        } catch (error) {
          console.error(`No se pudo cargar la asistencia del aula ${aula.id} para ${date}:`, error);
          attendanceStatusText.textContent = 'No se pudo cargar esta fecha. Revisa los permisos de Firestore.';
        } finally {
          dateInput.disabled = false;
          saveButton.disabled = false;
        }
      }

      dateInput.addEventListener('change', loadSelectedDate);
      saveButton.addEventListener('click', async () => {
        if (!dateInput.value) {
          attendanceStatusText.textContent = 'Selecciona una fecha para guardar la asistencia.';
          return;
        }
        saveButton.disabled = true;
        attendanceStatusText.textContent = 'Guardando asistencia...';
        try {
          const alumnos = Array.from(roster.querySelectorAll('select[data-student-key]'), (select) => {
            const [coleccion, id] = select.dataset.studentKey.split('/');
            const student = aula.alumnos.find((item) => item.id === id && item.coleccion === coleccion);
            return {
              id,
              coleccion,
              nombre: student?.nombre || 'Alumno',
              email: student?.email || '',
              estado: select.value,
              presente: select.value !== 'falta'
            };
          });
          await setDoc(doc(db, 'Aulas', aula.id, 'asistencias', dateInput.value), {
            fecha: dateInput.value,
            profesorDocId: session.teacherDocId,
            alumnos,
            actualizadoEn: serverTimestamp()
          });
          attendanceStatusText.textContent = `Asistencia del ${formatAttendanceDate(dateInput.value)} guardada.`;
          await loadSavedSessions();
        } catch (error) {
          console.error(`No se pudo guardar la asistencia del aula ${aula.id}:`, error);
          attendanceStatusText.textContent = 'No se pudo guardar la asistencia. Revisa los permisos de escritura de Firestore.';
        } finally {
          saveButton.disabled = false;
        }
      });

      renderRoster();
      renderHistory();
      await Promise.all([loadSelectedDate(), loadSavedSessions()]);
      return attendance;
    }

    function formatTaskDeadline(value) {
      if (!value) return 'Sin fecha de entrega';
      const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
      return Number.isNaN(date.getTime())
        ? 'Fecha de entrega no válida'
        : new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
    }

    function getTaskDeadlineDate(value) {
      if (!value) return null;
      const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatDateTimeLocal(value) {
      if (!value) return '';
      const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    async function listTaskSubmissionFiles(folder) {
      const result = await listAll(folder);
      const nestedFiles = await Promise.all(result.prefixes.map((prefix) => listTaskSubmissionFiles(prefix)));
      return [...result.items, ...nestedFiles.flat()];
    }

    async function loadTaskSubmissions(task, container, statusText, summary) {
      const assignedStudents = Array.isArray(task.alumnosAsignados) ? task.alumnosAsignados : [];
      const evaluatedStudentKeys = new Set();
      const hasEvaluation = (feedback) => feedback.calificacion !== null
        && feedback.calificacion !== undefined
        && String(feedback.calificacion).trim() !== ''
        && Number.isFinite(Number(feedback.calificacion));
      const updateEvaluationSummary = () => {
        const evaluatedCount = evaluatedStudentKeys.size;
        const pendingCount = Math.max(0, assignedStudents.length - evaluatedCount);
        summary.textContent = `Alumnos asignados (${assignedStudents.length}) · Evaluados: ${evaluatedCount} · Pendientes: ${pendingCount}`;
      };
      summary.textContent = `Alumnos asignados (${assignedStudents.length}) · Consultando evaluaciones...`;
      try {
        const taskFolder = ref(storage, `entregas/${task.aulaId}/${task.id}`);
        const files = await listTaskSubmissionFiles(taskFolder);
        const submissions = await Promise.all(files.map(async (fileReference) => ({
          reference: fileReference,
          metadata: await getMetadata(fileReference),
          url: await getDownloadURL(fileReference)
        })));

        container.replaceChildren();
        submissions.sort((left, right) =>
          new Date(right.metadata.updated || 0).getTime() - new Date(left.metadata.updated || 0).getTime()
        );
        const submissionGroups = new Map();
        assignedStudents.forEach((student) => {
          const studentKey = `${student.coleccion}/${student.id}`;
          if (!submissionGroups.has(studentKey)) {
            submissionGroups.set(studentKey, {
              student,
              studentName: student.nombre || student.email || student.correo || 'Alumno',
              files: []
            });
          }
        });
        submissions.forEach((submission) => {
          const metadata = submission.metadata.customMetadata || {};
          const rosterStudent = assignedStudents.find((student) =>
            (metadata.studentId && metadata.studentCollection
              && String(student.id) === String(metadata.studentId)
              && student.coleccion === metadata.studentCollection)
            || (metadata.studentEmail
              && String(student.email || student.correo || '').trim().toLowerCase() === metadata.studentEmail.trim().toLowerCase())
          );
          const studentKey = rosterStudent
            ? `${rosterStudent.coleccion}/${rosterStudent.id}`
            : `unmatched/${metadata.studentEmail || metadata.studentName || submission.reference.fullPath}`;
          if (!submissionGroups.has(studentKey)) {
            submissionGroups.set(studentKey, {
              student: rosterStudent || null,
              studentName: metadata.studentName || metadata.studentEmail || 'Alumno',
              files: []
            });
          }
          submissionGroups.get(studentKey).files.push(submission);
        });

        for (const group of submissionGroups.values()) {
          const studentSection = document.createElement('section');
          studentSection.className = 'task-submission-review';
          addText(studentSection, 'strong', '', group.student?.nombre || group.studentName);
          if (!group.files.length) {
            addText(studentSection, 'p', 'task-submission-missing', 'Sin entrega.');
          }
          group.files.forEach(({ metadata, url }) => {
            const originalName = metadata.customMetadata?.originalName || 'entrega.pdf';
            const updatedAt = metadata.updated
              ? new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(metadata.updated))
              : '';
            const isPdf = metadata.contentType?.toLowerCase() === 'application/pdf'
              || /\.pdf$/i.test(originalName);
            if (isPdf) {
              const viewer = document.createElement('details');
              viewer.className = 'task-submission-pdf';
              const summary = addText(viewer, 'summary', 'task-submission-pdf-summary', `Ver PDF: ${originalName}`);
              summary.setAttribute('aria-label', `Mostrar PDF ${originalName}`);
              const frame = document.createElement('iframe');
              frame.className = 'task-submission-pdf-frame';
              frame.src = url;
              frame.title = `Vista previa de ${originalName}`;
              frame.loading = 'lazy';
              frame.referrerPolicy = 'no-referrer';
              viewer.append(frame);
              if (updatedAt) addText(viewer, 'span', 'task-submission-link', `Actualizada ${updatedAt}`);
              studentSection.append(viewer);
            } else {
              const link = document.createElement('a');
              link.className = 'task-submission-link';
              link.href = url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              addText(link, 'span', '', originalName);
              addText(link, 'span', '', updatedAt ? `Actualizada ${updatedAt}` : '');
              studentSection.append(link);
            }
          });

          if (group.student) {
            const feedbackId = `${group.student.coleccion}_${group.student.id}`;
            const feedbackRef = doc(db, 'Aulas', task.aulaId, 'tareas', task.id, 'calificaciones', feedbackId);
            const [gradeLabel, commentLabel] = ['Calificación', 'Retroalimentación'].map((labelText) => {
              const label = document.createElement('label');
              label.append(document.createTextNode(labelText));
              return label;
            });
            const gradeInput = document.createElement('input');
            gradeInput.type = 'number';
            gradeInput.min = '0';
            gradeInput.max = String(Number(task.puntos ?? 100));
            gradeInput.step = '0.01';
            gradeInput.required = true;
            gradeInput.setAttribute('aria-label', `Calificación para ${group.student.nombre || group.studentName}`);
            const commentEditor = document.createElement('div');
            commentEditor.className = 'announcement-editor';
            commentEditor.contentEditable = 'true';
            commentEditor.setAttribute('role', 'textbox');
            commentEditor.setAttribute('aria-label', `Retroalimentación para ${group.student.nombre || group.studentName}`);
            commentEditor.setAttribute('aria-multiline', 'true');
            commentEditor.dataset.placeholder = 'Escribe comentarios para el alumno...';
            const commentToolbar = document.createElement('div');
            commentToolbar.className = 'editor-toolbar';
            commentToolbar.setAttribute('aria-label', 'Formato de la retroalimentación');
            [
              { command: 'bold', label: 'B', title: 'Negrita', style: 'font-weight:700' },
              { command: 'italic', label: 'I', title: 'Cursiva', style: 'font-style:italic' },
              { command: 'underline', label: 'U', title: 'Subrayado', style: 'text-decoration:underline' },
              { command: 'formatBlock', value: 'H2', label: 'Título', title: 'Título' },
              { command: 'formatBlock', value: 'H3', label: 'Subtítulo', title: 'Subtítulo' },
              { command: 'insertUnorderedList', label: '• Lista', title: 'Lista con viñetas' },
              { command: 'insertOrderedList', label: '1. Lista', title: 'Lista numerada' }
            ].forEach(({ command, value, label, title, style }) => {
              const button = addText(commentToolbar, 'button', '', label);
              button.type = 'button';
              button.title = title;
              button.setAttribute('aria-label', title);
              if (style) button.style.cssText = style;
              button.addEventListener('mousedown', (event) => event.preventDefault());
              button.addEventListener('click', () => {
                commentEditor.focus();
                document.execCommand(command, false, value || null);
              });
            });
            commentToolbar.append(createEditorColorControl(commentEditor));
            const saveGradeButton = document.createElement('button');
            saveGradeButton.type = 'button';
            saveGradeButton.textContent = 'Guardar calificación';
            const feedbackStatus = addText(studentSection, 'p', 'task-submission-review-status', '');
            const gradeSnapshot = await getDoc(feedbackRef);
            if (gradeSnapshot.exists()) {
              const feedback = gradeSnapshot.data();
              gradeInput.value = feedback.calificacion ?? '';
              commentEditor.innerHTML = sanitizeAnnouncementHtml(feedback.comentario || '');
              if (hasEvaluation(feedback)) {
                evaluatedStudentKeys.add(`${group.student.coleccion}/${group.student.id}`);
              }
            } else if (!group.files.length
                && getTaskDeadlineDate(task.fechaEntrega)?.getTime() < Date.now()) {
              const automaticComment = 'Tarea no entregada.';
              const automaticFeedback = {
                estudianteId: group.student.id,
                estudianteColeccion: group.student.coleccion,
                estudianteNombre: group.student.nombre || group.studentName,
                tareaId: task.id,
                aulaId: task.aulaId,
                calificacion: 0,
                puntosMaximos: Number(task.puntos ?? 100),
                comentario: automaticComment,
                profesorDocId: session.teacherDocId,
                actualizadoEn: serverTimestamp()
              };
              const result = await runTransaction(db, async (transaction) => {
                const currentFeedback = await transaction.get(feedbackRef);
                if (currentFeedback.exists()) {
                  return { feedback: currentFeedback.data(), assignedAutomatically: false };
                }
                transaction.set(feedbackRef, automaticFeedback);
                return { feedback: automaticFeedback, assignedAutomatically: true };
              });
              gradeInput.value = result.feedback.calificacion ?? '';
              commentEditor.innerHTML = sanitizeAnnouncementHtml(result.feedback.comentario || '');
              if (hasEvaluation(result.feedback)) {
                evaluatedStudentKeys.add(`${group.student.coleccion}/${group.student.id}`);
              }
              if (result.assignedAutomatically) {
                feedbackStatus.textContent = 'Se asignó automáticamente 0 porque la tarea venció sin entrega.';
              }
            }
            updateEvaluationSummary();
            gradeLabel.append(gradeInput);
            commentLabel.append(commentToolbar, commentEditor);
            saveGradeButton.addEventListener('click', async () => {
              if (!gradeInput.reportValidity()) return;
              const grade = Number(gradeInput.value);
              const maxGrade = Number(task.puntos ?? 100);
              if (!Number.isFinite(grade) || grade < 0 || grade > maxGrade) {
                feedbackStatus.textContent = `La calificación debe estar entre 0 y ${maxGrade}.`;
                return;
              }
              const comentario = sanitizeAnnouncementHtml(commentEditor.innerHTML).trim();
              const commentText = new DOMParser().parseFromString(comentario, 'text/html').body.textContent.trim();
              if (commentText.length > 2000) {
                feedbackStatus.textContent = 'La retroalimentación no puede superar los 2000 caracteres.';
                return;
              }
              saveGradeButton.disabled = true;
              feedbackStatus.textContent = 'Guardando calificación...';
              try {
                await setDoc(feedbackRef, {
                  estudianteId: group.student.id,
                  estudianteColeccion: group.student.coleccion,
                  estudianteNombre: group.student.nombre || group.studentName,
                  tareaId: task.id,
                  aulaId: task.aulaId,
                  calificacion: grade,
                  puntosMaximos: maxGrade,
                  comentario: commentText ? comentario : '',
                  profesorDocId: session.teacherDocId,
                  actualizadoEn: serverTimestamp()
                });
                evaluatedStudentKeys.add(`${group.student.coleccion}/${group.student.id}`);
                updateEvaluationSummary();
                feedbackStatus.textContent = 'Calificación y retroalimentación guardadas.';
              } catch (error) {
                console.error(`No se pudo guardar la calificación de ${group.student.coleccion}/${group.student.id} para la tarea ${task.id}:`, error);
                feedbackStatus.textContent = 'No se pudo guardar. Revisa los permisos y la conexión de Firestore.';
              } finally {
                saveGradeButton.disabled = false;
              }
            });
            studentSection.append(gradeLabel, commentLabel, saveGradeButton);
          } else {
            addText(studentSection, 'p', 'task-submission-review-status', 'No se pudo relacionar esta entrega con un alumno asignado; no se puede guardar la calificación.');
          }
          container.append(studentSection);
        }
        const submittedStudents = Array.from(submissionGroups.values())
          .filter((group) => group.files.length && group.student).length;
        updateEvaluationSummary();
        statusText.textContent = assignedStudents.length
          ? `${submissions.length} archivo(s) recibido(s) · ${submittedStudents} de ${assignedStudents.length} alumno(s) entregaron.`
          : submissions.length
            ? `${submissions.length} entrega(s) recibida(s).`
            : 'Aún no hay entregas.';
      } catch (error) {
        console.error(`No se pudieron cargar las entregas de la tarea ${task.id}:`, error);
        summary.textContent = `Alumnos asignados (${assignedStudents.length}) · No se pudieron consultar las evaluaciones.`;
        statusText.textContent = error.code === 'storage/unauthorized'
          ? 'No se pudo consultar Storage. Verifica las reglas de storage.rules y que el alumno esté autenticado.'
          : 'No se pudieron consultar las entregas.';
      }
    }

    async function migrateTaskSubmissionAccess(aula, task) {
      const updates = {};
      const alumnosEmails = (Array.isArray(task.alumnosAsignados) ? task.alumnosAsignados : [])
        .map((student) => String(student.email || student.correo || '').trim().toLowerCase())
        .filter(Boolean);
      if (JSON.stringify(task.alumnosEmails || []) !== JSON.stringify(alumnosEmails)) {
        task.alumnosEmails = alumnosEmails;
        updates.alumnosEmails = task.alumnosEmails;
      }
      if (!task.profesorEmail && session.email) {
        task.profesorEmail = String(session.email).trim().toLowerCase();
        updates.profesorEmail = task.profesorEmail;
      }
      if (Object.keys(updates).length) {
        await updateDoc(doc(db, 'Aulas', aula.id, 'tareas', task.id), updates);
      }
    }

    async function migrateClassTaskSubmissionAccess(aula) {
      try {
        const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'tareas'));
        await Promise.all(snapshot.docs.map(async (taskDoc) => {
          const task = { id: taskDoc.id, ...taskDoc.data() };
          try {
            await migrateTaskSubmissionAccess(aula, task);
          } catch (error) {
            console.error(`No se pudieron preparar las entregas de la tarea ${task.id} del aula ${aula.id}:`, error);
          }
        }));
      } catch (error) {
        console.error(`No se pudieron preparar las entregas de las tareas del aula ${aula.id}:`, error);
      }
    }

    async function renderStudyMaterials(aula) {
      const page = document.createElement('section');
      page.className = 'study-materials-page';
      const toolbar = document.createElement('div');
      toolbar.className = 'tasks-toolbar';
      addText(toolbar, 'h3', '', 'Material de estudio');
      const intro = addText(page, 'p', 'study-materials-intro', 'Crea secciones para organizar los videos y agrega el enlace de cada recurso. YouTube y Vimeo se mostrarán en el material del alumno.');
      const sectionForm = document.createElement('form');
      sectionForm.className = 'study-section-form';
      const sectionLabel = document.createElement('label');
      sectionLabel.textContent = 'Nombre de la sección';
      const sectionInput = document.createElement('input');
      sectionInput.name = 'sectionTitle';
      sectionInput.maxLength = 100;
      sectionInput.required = true;
      sectionInput.placeholder = 'Ej. Álgebra';
      sectionLabel.append(sectionInput);
      const createSectionButton = addText(sectionForm, 'button', 'task-primary-button', 'Agregar sección');
      createSectionButton.type = 'submit';
      sectionForm.prepend(sectionLabel);
      const statusText = addText(page, 'p', 'study-video-status', 'Cargando material...');
      statusText.setAttribute('role', 'status');
      statusText.setAttribute('aria-live', 'polite');
      const sectionList = document.createElement('div');
      sectionList.className = 'study-section-list';
      page.append(toolbar, intro, sectionForm, statusText, sectionList);

      async function loadSections() {
        statusText.textContent = 'Cargando secciones y videos...';
        sectionList.replaceChildren();
        try {
          const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'materiales'));
          const sections = snapshot.docs
            .map((sectionDoc) => ({ id: sectionDoc.id, ...sectionDoc.data() }))
            .sort((left, right) => (left.orden ?? 0) - (right.orden ?? 0)
              || (left.titulo || '').localeCompare(right.titulo || '', 'es'));
          if (!sections.length) {
            statusText.textContent = 'Aún no hay secciones. Agrega una para comenzar.';
            return sections;
          }

          for (const section of sections) {
            const card = document.createElement('article');
            card.className = 'study-section-card';
            addText(card, 'h4', '', section.titulo || 'Sección sin título');
            const videoForm = document.createElement('form');
            videoForm.className = 'study-video-form';
            const titleLabel = document.createElement('label');
            titleLabel.textContent = 'Título del video';
            const titleInput = document.createElement('input');
            titleInput.name = 'videoTitle';
            titleInput.maxLength = 150;
            titleInput.required = true;
            titleInput.placeholder = 'Ej. Introducción al tema';
            titleLabel.append(titleInput);
            const urlLabel = document.createElement('label');
            urlLabel.textContent = 'Enlace del video';
            const urlInput = document.createElement('input');
            urlInput.name = 'videoUrl';
            urlInput.type = 'url';
            urlInput.maxLength = 2048;
            urlInput.required = true;
            urlInput.placeholder = 'https://www.youtube.com/watch?v=...';
            urlLabel.append(urlInput);
            const addVideoButton = addText(videoForm, 'button', 'task-primary-button', 'Agregar video');
            addVideoButton.type = 'submit';
            videoForm.prepend(titleLabel, urlLabel);
            const videoList = document.createElement('div');
            videoList.className = 'study-video-list';
            card.append(videoForm, videoList);

            try {
              const videoSnapshot = await getDocs(collection(
                db,
                'Aulas',
                aula.id,
                'materiales',
                section.id,
                'videos'
              ));
              const videos = videoSnapshot.docs
                .map((videoDoc) => ({ id: videoDoc.id, ...videoDoc.data() }))
                .filter((video) => {
                  try {
                    const url = new URL(video.url);
                    if (['http:', 'https:'].includes(url.protocol)) return true;
                  } catch {
                    console.error(`Se omitió el video ${video.id} porque su enlace no es válido.`);
                    return false;
                  }
                  console.error(`Se omitió el video ${video.id} porque su enlace no es HTTP(S).`);
                  return false;
                })
                .sort((left, right) => (left.titulo || '').localeCompare(right.titulo || '', 'es'));
              videos.forEach((video) => {
                const item = document.createElement('div');
                item.className = 'study-video-item';
                const link = addText(item, 'a', '', video.titulo || 'Video de estudio');
                link.href = video.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                const deleteButton = addText(item, 'button', 'study-video-delete', 'Eliminar');
                deleteButton.type = 'button';
                deleteButton.addEventListener('click', async () => {
                  if (!confirm(`¿Eliminar el video "${video.titulo || 'Video de estudio'}"?`)) return;
                  deleteButton.disabled = true;
                  statusText.textContent = 'Eliminando video...';
                  try {
                    await deleteDoc(doc(db, 'Aulas', aula.id, 'materiales', section.id, 'videos', video.id));
                    statusText.textContent = 'Video eliminado.';
                    await loadSections();
                  } catch (error) {
                    console.error(`No se pudo eliminar el video ${video.id} de la sección ${section.id} del aula ${aula.id}:`, error);
                    statusText.textContent = 'No se pudo eliminar el video. Revisa la conexión y los permisos de Firestore.';
                    deleteButton.disabled = false;
                  }
                });
                videoList.append(item);
              });
            } catch (error) {
              console.error(`No se pudieron cargar los videos de la sección ${section.id} del aula ${aula.id}:`, error);
              addText(videoList, 'p', 'study-video-status', 'No se pudieron cargar los videos de esta sección.');
            }

            videoForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const title = titleInput.value.trim();
              if (!title) {
                statusText.textContent = 'Escribe un título para el video.';
                return;
              }
              let url;
              try {
                url = new URL(urlInput.value.trim());
              } catch {
                urlInput.setAttribute('aria-invalid', 'true');
                statusText.textContent = 'Escribe un enlace válido para el video.';
                return;
              }
              urlInput.removeAttribute('aria-invalid');
              if (!['http:', 'https:'].includes(url.protocol)) {
                statusText.textContent = 'El enlace del video debe comenzar con http:// o https://.';
                return;
              }
              addVideoButton.disabled = true;
              statusText.textContent = 'Guardando video...';
              try {
                const videoReference = doc(collection(db, 'Aulas', aula.id, 'materiales', section.id, 'videos'));
                await setDoc(videoReference, {
                  titulo: title,
                  url: url.href,
                  creadoEn: serverTimestamp()
                });
                if (!await loadSections()) return;
                statusText.textContent = 'Video agregado.';
              } catch (error) {
                console.error(`No se pudo agregar un video a la sección ${section.id} del aula ${aula.id}:`, error);
                statusText.textContent = 'No se pudo guardar el video. Revisa la conexión y los permisos de Firestore.';
                addVideoButton.disabled = false;
              }
            });
            sectionList.append(card);
          }
          statusText.textContent = `${sections.length} sección(es) disponibles.`;
          return sections;
        } catch (error) {
          console.error(`No se pudo cargar el material del aula ${aula.id}:`, error);
          statusText.textContent = 'No se pudo cargar el material. Revisa la conexión y los permisos de Firestore.';
          return null;
        }
      }

      sectionForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = sectionInput.value.trim();
        if (!title) return;
        createSectionButton.disabled = true;
        statusText.textContent = 'Creando sección...';
        try {
          const currentSections = await getDocs(collection(db, 'Aulas', aula.id, 'materiales'));
          const duplicateSection = currentSections.docs.some((sectionDoc) =>
            (sectionDoc.data().titulo || '').trim().toLocaleLowerCase() === title.toLocaleLowerCase()
          );
          if (duplicateSection) {
            statusText.textContent = 'Ya existe una sección con ese nombre.';
            return;
          }
          const sectionReference = doc(collection(db, 'Aulas', aula.id, 'materiales'));
          await setDoc(sectionReference, {
            titulo: title,
            orden: currentSections.size,
            creadoEn: serverTimestamp()
          });
          sectionForm.reset();
          if (!await loadSections()) return;
          statusText.textContent = 'Sección creada. Ya puedes agregar videos.';
        } catch (error) {
          console.error(`No se pudo crear una sección de material para el aula ${aula.id}:`, error);
          statusText.textContent = 'No se pudo crear la sección. Revisa la conexión y los permisos de Firestore.';
        } finally {
          createSectionButton.disabled = false;
        }
      });

      await loadSections();
      return page;
    }

    async function loadClassroomEvaluationData(aula) {
      const [tasksSnapshot, examsSnapshot] = await Promise.all([
        getDocs(collection(db, 'Aulas', aula.id, 'tareas')),
        getDocs(collection(db, 'Aulas', aula.id, 'examenesSimulacros'))
      ]);
      const evaluations = [
        ...tasksSnapshot.docs.map((taskDoc) => ({
          ...taskDoc.data(),
          id: taskDoc.id,
          collectionName: 'tareas'
        })),
        ...examsSnapshot.docs.map((examDoc) => ({
          ...examDoc.data(),
          id: examDoc.id,
          collectionName: 'examenesSimulacros',
          tipoEvaluacion: 'simulacro'
        }))
      ].sort((left, right) => (right.creadoEn?.toMillis?.() || 0) - (left.creadoEn?.toMillis?.() || 0));
      const feedbackSnapshots = await Promise.all(evaluations.map((evaluation) =>
        getDocs(collection(db, 'Aulas', aula.id, evaluation.collectionName, evaluation.id, 'calificaciones'))
      ));
      return { tasks: evaluations, feedbackSnapshots };
    }

    async function renderPracticeExams(aula) {
      const page = document.createElement('section');
      page.className = 'tasks-page';
      const toolbar = document.createElement('div');
      toolbar.className = 'tasks-toolbar';
      addText(toolbar, 'h3', '', 'Exámenes simulacros');
      const form = document.createElement('form');
      form.className = 'practice-exam-form';
      const titleField = document.createElement('label');
      titleField.className = 'task-field';
      titleField.append(document.createTextNode('Nombre del examen'));
      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.maxLength = 160;
      titleInput.required = true;
      titleInput.placeholder = 'Ej. Simulacro de admisión 1';
      titleField.append(titleInput);
      const pointsField = document.createElement('label');
      pointsField.className = 'task-field';
      pointsField.append(document.createTextNode('Puntos máximos'));
      const pointsInput = document.createElement('input');
      pointsInput.type = 'number';
      pointsInput.min = '1';
      pointsInput.max = '10000';
      pointsInput.step = '1';
      pointsInput.value = '100';
      pointsInput.required = true;
      pointsField.append(pointsInput);
      const averageOption = document.createElement('label');
      averageOption.className = 'practice-exam-average-option';
      const includeInAverageInput = document.createElement('input');
      includeInAverageInput.type = 'checkbox';
      includeInAverageInput.checked = true;
      const averageOptionText = document.createElement('span');
      averageOptionText.textContent = 'Este examen cuenta para el promedio de simulacros';
      averageOption.append(includeInAverageInput, averageOptionText);
      const createButton = addText(form, 'button', 'task-primary-button', 'Crear examen');
      createButton.type = 'submit';
      const cancelEditButton = addText(form, 'button', 'task-secondary-button', 'Cancelar edición');
      cancelEditButton.type = 'button';
      cancelEditButton.hidden = true;
      const formActions = document.createElement('div');
      formActions.className = 'practice-exam-form-actions';
      formActions.append(createButton, cancelEditButton);
      let editingExamId = null;
      let editingExamMaxPoints = null;
      const statusText = addText(page, 'p', 'attendance-status', 'Cargando exámenes simulacros...');
      statusText.setAttribute('role', 'status');
      statusText.setAttribute('aria-live', 'polite');
      const examList = document.createElement('div');
      examList.className = 'task-list';
      form.append(titleField, pointsField, averageOption, formActions);
      page.append(toolbar, form, statusText, examList);

      function resetExamForm() {
        editingExamId = null;
        editingExamMaxPoints = null;
        form.reset();
        pointsInput.value = '100';
        includeInAverageInput.checked = true;
        createButton.textContent = 'Crear examen';
        cancelEditButton.hidden = true;
        statusText.textContent = '';
      }

      async function loadExams() {
        examList.replaceChildren();
        const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'examenesSimulacros'));
        const exams = snapshot.docs
          .map((examDoc) => ({ id: examDoc.id, ...examDoc.data() }))
          .sort((left, right) => (right.creadoEn?.toMillis?.() || 0) - (left.creadoEn?.toMillis?.() || 0));
        if (!exams.length) {
          statusText.textContent = 'Aún no hay exámenes simulacros asignados.';
          return;
        }

        for (const exam of exams) {
          const card = document.createElement('details');
          card.className = 'task-card practice-exam-card';
          const summary = addText(card, 'summary', 'practice-exam-summary', exam.titulo || 'Examen simulacro');
          const examDetails = document.createElement('div');
          examDetails.className = 'task-card-main practice-exam-content';
          const actions = document.createElement('div');
          actions.className = 'practice-exam-actions';
          const editButton = addText(actions, 'button', 'task-secondary-button', 'Modificar');
          editButton.type = 'button';
          editButton.addEventListener('click', () => {
            editingExamId = exam.id;
            editingExamMaxPoints = Number(exam.puntos ?? 100);
            titleInput.value = exam.titulo || '';
            pointsInput.value = String(exam.puntos ?? 100);
            includeInAverageInput.checked = exam.considerarEnPromedio !== false;
            createButton.textContent = 'Guardar cambios';
            cancelEditButton.hidden = false;
            statusText.textContent = `Modificando "${exam.titulo || 'Examen simulacro'}". Las calificaciones actuales se conservarán.`;
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });
            titleInput.focus();
          });
          const deleteButton = addText(actions, 'button', 'task-secondary-button practice-exam-delete', 'Eliminar');
          deleteButton.type = 'button';
          deleteButton.addEventListener('click', async () => {
            if (!confirm(`¿Eliminar el examen "${exam.titulo || 'Examen simulacro'}" y todas sus calificaciones? Esta acción no se puede deshacer.`)) return;
            editButton.disabled = true;
            deleteButton.disabled = true;
            statusText.textContent = 'Eliminando examen y calificaciones...';
            try {
              const feedbackSnapshot = await getDocs(collection(
                db,
                'Aulas',
                aula.id,
                'examenesSimulacros',
                exam.id,
                'calificaciones'
              ));
              for (let offset = 0; offset < feedbackSnapshot.docs.length; offset += 450) {
                const batch = writeBatch(db);
                feedbackSnapshot.docs.slice(offset, offset + 450).forEach((feedbackDoc) => batch.delete(feedbackDoc.ref));
                await batch.commit();
              }
              await deleteDoc(doc(db, 'Aulas', aula.id, 'examenesSimulacros', exam.id));
              if (editingExamId === exam.id) resetExamForm();
              await loadExams();
            } catch (error) {
              console.error(`No se pudo eliminar el examen simulacro ${exam.id} del aula ${aula.id}:`, error);
              statusText.textContent = 'No se pudo eliminar el examen o sus calificaciones. Revisa los permisos de Firestore e inténtalo de nuevo.';
              editButton.disabled = false;
              deleteButton.disabled = false;
            }
          });
          addText(examDetails, 'p', '', [
            exam.materia || 'General',
            exam.unidad || null,
            `${exam.puntos ?? 100} puntos`,
            exam.considerarEnPromedio === false ? 'No cuenta para el promedio' : 'Cuenta para el promedio'
          ].filter(Boolean).join(' · '));
          const studentsList = document.createElement('div');
          studentsList.className = 'practice-exam-students';
          const assignedStudents = Array.isArray(exam.alumnosAsignados) ? exam.alumnosAsignados : [];
          const feedbackSnapshot = await getDocs(collection(
            db,
            'Aulas',
            aula.id,
            'examenesSimulacros',
            exam.id,
            'calificaciones'
          ));
          const feedbackByStudent = new Map(feedbackSnapshot.docs.map((feedbackDoc) => [feedbackDoc.id, feedbackDoc.data()]));
          assignedStudents.forEach((student) => {
            const row = document.createElement('form');
            row.className = 'practice-exam-student';
            const studentName = student.nombre || student.email || student.correo || 'Alumno';
            const studentField = document.createElement('label');
            studentField.className = 'task-field';
            studentField.append(document.createTextNode(studentName));
            const gradeInput = document.createElement('input');
            gradeInput.type = 'number';
            gradeInput.min = '0';
            gradeInput.max = String(Number(exam.puntos ?? 100));
            gradeInput.step = '0.01';
            gradeInput.required = true;
            gradeInput.setAttribute('aria-label', `Calificación de ${studentName}`);
            const feedbackId = `${student.coleccion}_${student.id}`;
            const previousFeedback = feedbackByStudent.get(feedbackId);
            if (previousFeedback?.calificacion != null) gradeInput.value = String(previousFeedback.calificacion);
            studentField.append(gradeInput);
            const saveGradeButton = addText(row, 'button', 'task-secondary-button', 'Guardar calificación');
            saveGradeButton.type = 'submit';
            const gradeStatus = addText(row, 'span', 'attendance-status', '');
            gradeStatus.setAttribute('role', 'status');
            row.append(studentField, saveGradeButton, gradeStatus);
            row.addEventListener('submit', async (event) => {
              event.preventDefault();
              const score = Number(gradeInput.value);
              const maxScore = Number(exam.puntos ?? 100);
              if (!Number.isFinite(score) || score < 0 || score > maxScore) {
                gradeStatus.textContent = `Ingresa una calificación entre 0 y ${maxScore}.`;
                return;
              }
              saveGradeButton.disabled = true;
              gradeStatus.textContent = 'Guardando...';
              try {
                await setDoc(doc(
                  db,
                  'Aulas',
                  aula.id,
                  'examenesSimulacros',
                  exam.id,
                  'calificaciones',
                  feedbackId
                ), {
                  estudianteId: student.id,
                  estudianteColeccion: student.coleccion,
                  estudianteNombre: studentName,
                  calificacion: score,
                  puntosMaximos: maxScore,
                  comentario: '',
                  actualizadoEn: serverTimestamp()
                });
                gradeStatus.textContent = 'Calificación guardada.';
              } catch (error) {
                console.error(`No se pudo guardar la calificación del alumno ${student.id} en el examen ${exam.id}:`, error);
                gradeStatus.textContent = 'No se pudo guardar la calificación.';
              } finally {
                saveGradeButton.disabled = false;
              }
            });
            studentsList.append(row);
          });
          if (!assignedStudents.length) {
            addText(studentsList, 'p', 'attendance-status', 'Este examen no tiene alumnos asignados.');
          }
          examDetails.append(studentsList, actions);
          card.append(examDetails);
          examList.append(card);
        }
        statusText.textContent = `${exams.length} examen(es) simulacro(s). Las calificaciones se registran manualmente.`;
      }

      try {
        await loadExams();
      } catch (error) {
        console.error(`No se pudieron cargar los exámenes simulacros del aula ${aula.id}:`, error);
        statusText.textContent = 'No se pudieron cargar los exámenes simulacros. Revisa los permisos de Firestore.';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const examId = editingExamId;
        const title = titleInput.value.trim();
        const points = Number(pointsInput.value);
        const students = (Array.isArray(aula.alumnos) ? aula.alumnos : [])
          .filter((student) => student?.id != null && student.coleccion)
          .map((student) => ({
            id: student.id,
            coleccion: student.coleccion,
            nombre: student.nombre || '',
            email: String(student.email || student.correo || '').trim().toLowerCase()
          }));
        if (!title) {
          statusText.textContent = 'Escribe el nombre del examen simulacro.';
          return;
        }
        if (!examId && !students.length) {
          statusText.textContent = 'No hay alumnos asignados a esta aula.';
          return;
        }
        if (!Number.isInteger(points) || points < 1 || points > 10000) {
          statusText.textContent = 'Ingresa un puntaje entero entre 1 y 10000.';
          return;
        }
        createButton.disabled = true;
        cancelEditButton.disabled = true;
        statusText.textContent = examId ? 'Guardando cambios...' : 'Creando y asignando el examen simulacro...';
        try {
          const examData = {
            titulo: title,
            puntos: points,
            considerarEnPromedio: includeInAverageInput.checked,
            actualizadoEn: serverTimestamp()
          };
          if (examId) {
            const feedbackSnapshot = await getDocs(collection(
              db,
              'Aulas',
              aula.id,
              'examenesSimulacros',
              examId,
              'calificaciones'
            ));
            const highestExistingGrade = feedbackSnapshot.docs.reduce((highest, feedbackDoc) => {
              const score = Number(feedbackDoc.data().calificacion);
              return Number.isFinite(score) ? Math.max(highest, score) : highest;
            }, 0);
            if (feedbackSnapshot.size && points !== editingExamMaxPoints) {
              statusText.textContent = 'No se puede cambiar el puntaje máximo después de guardar calificaciones. Las demás modificaciones se pueden guardar sin cambiarlo.';
              return;
            }
            if (points < highestExistingGrade) {
              statusText.textContent = `El puntaje máximo no puede ser menor que una calificación ya guardada (${highestExistingGrade}).`;
              return;
            }
            await updateDoc(doc(db, 'Aulas', aula.id, 'examenesSimulacros', examId), examData);
          } else {
            await setDoc(doc(collection(db, 'Aulas', aula.id, 'examenesSimulacros')), {
              ...examData,
              materiaId: '',
              materia: 'General',
              unidad: '',
              alumnosAsignados: students,
              creadoEn: serverTimestamp()
            });
          }
          resetExamForm();
          await loadExams();
        } catch (error) {
          console.error(`No se pudo ${examId ? 'actualizar' : 'crear'} un examen simulacro en el aula ${aula.id}:`, error);
          statusText.textContent = `No se pudo ${examId ? 'actualizar' : 'crear'} el examen simulacro. Revisa los permisos de Firestore.`;
        } finally {
          createButton.disabled = false;
          cancelEditButton.disabled = false;
        }
      });

      cancelEditButton.addEventListener('click', resetExamForm);
      return page;
    }

    async function renderTasks(aula) {
      const tasksPage = document.createElement('section');
      tasksPage.className = 'tasks-page';
      const toolbar = document.createElement('div');
      toolbar.className = 'tasks-toolbar';
      addText(toolbar, 'h3', '', 'Tareas del aula');
      const createButton = addText(toolbar, 'button', 'task-primary-button', 'Crear tarea');
      createButton.type = 'button';
      const taskList = document.createElement('div');
      taskList.className = 'task-list';
      const listStatus = addText(tasksPage, 'p', 'task-form-status', 'Cargando tareas...');
      tasksPage.prepend(toolbar, listStatus);
      tasksPage.append(taskList);

      let assignedTasks = [];
      try {
        const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'tareas'));
        assignedTasks = snapshot.docs
          .map((taskDoc) => ({ id: taskDoc.id, ...taskDoc.data() }))
          .sort((left, right) => (right.creadoEn?.toMillis?.() || 0) - (left.creadoEn?.toMillis?.() || 0));
        await Promise.all(assignedTasks.map(async (task) => {
          try {
            await migrateTaskSubmissionAccess(aula, task);
          } catch (error) {
            console.error(`No se pudieron actualizar los permisos de entrega de la tarea ${task.id}:`, error);
          }
        }));
        listStatus.textContent = assignedTasks.length
          ? `${assignedTasks.length} tarea(s) asignada(s).`
          : 'Aún no hay tareas para esta aula.';
        const subjectGroups = new Map();
        const unitGroups = new Map();
        assignedTasks.forEach((task) => {
          const subjectName = task.materia || 'General';
          const subjectKey = task.materiaId || subjectName.toLocaleLowerCase();
          let subjectGroup = subjectGroups.get(subjectKey);
          if (!subjectGroup) {
            subjectGroup = document.createElement('section');
            subjectGroup.className = 'task-subject-group';
            addText(subjectGroup, 'h3', 'task-subject-heading', subjectName);
            subjectGroups.set(subjectKey, subjectGroup);
            taskList.append(subjectGroup);
          }
          const unitName = String(task.unidad || '').trim() || 'Sin unidad';
          const unitKey = `${subjectKey}\u0000${unitName.toLocaleLowerCase()}`;
          let unitGroup = unitGroups.get(unitKey);
          if (!unitGroup) {
            const element = document.createElement('details');
            element.className = 'task-unit-group';
            const heading = addText(element, 'summary', 'task-unit-heading', '');
            addText(heading, 'span', '', unitName);
            const headingCount = addText(heading, 'span', 'task-unit-count', '');
            unitGroup = { element, count: 0, headingCount };
            unitGroups.set(unitKey, unitGroup);
            subjectGroup.append(unitGroup.element);
          }
          unitGroup.count += 1;
          unitGroup.headingCount.textContent = `${unitGroup.count} ${unitGroup.count === 1 ? 'tarea' : 'tareas'}`;
          const card = document.createElement('article');
          card.className = 'task-card';
          const mainDetails = document.createElement('div');
          mainDetails.className = 'task-card-main';
          addText(mainDetails, 'h4', '', task.titulo || 'Tarea sin título');
          if (task.tema) addText(mainDetails, 'p', '', `Tema: ${task.tema}`);
          if (Array.isArray(task.alumnosAsignados)) {
            addText(mainDetails, 'p', '', `Asignada a ${task.alumnosAsignados.length} alumno(s).`);
          }
          card.append(mainDetails);
          const taskDetails = document.createElement('div');
          taskDetails.className = 'task-card-details';
          addText(taskDetails, 'span', 'task-card-due-label', 'Fecha de entrega');
          addText(taskDetails, 'span', 'task-card-due', formatTaskDeadline(task.fechaEntrega));
          addText(taskDetails, 'span', 'task-card-due', `${task.puntos ?? 100} puntos`);
          card.append(taskDetails);
          const submissions = document.createElement('details');
          submissions.className = 'task-submissions';
          submissions.open = false;
          const submissionSummary = addText(submissions, 'summary', 'task-submissions-summary', '');
          const submissionStatus = addText(submissions, 'p', 'task-submissions-status', 'Consultando entregas...');
          const submissionList = document.createElement('div');
          submissionList.className = 'task-submission-list';
          submissions.append(submissionList);
          card.append(submissions);
          loadTaskSubmissions({ ...task, aulaId: aula.id }, submissionList, submissionStatus, submissionSummary);
          const actions = document.createElement('div');
          actions.className = 'task-card-actions';
          const evaluationField = document.createElement('label');
          evaluationField.className = 'task-check-field';
          const evaluationInput = document.createElement('input');
          evaluationInput.type = 'checkbox';
          evaluationInput.checked = task.considerarEnPromedio !== false;
          const evaluationLabel = document.createElement('span');
          evaluationLabel.textContent = evaluationInput.checked
            ? 'Cuenta para el promedio'
            : 'No cuenta para el promedio';
          evaluationField.append(evaluationInput, evaluationLabel);
          evaluationInput.addEventListener('change', async () => {
            evaluationInput.disabled = true;
            evaluationLabel.textContent = 'Guardando...';
            try {
              await updateDoc(doc(db, 'Aulas', aula.id, 'tareas', task.id), {
                considerarEnPromedio: evaluationInput.checked,
                actualizadoEn: serverTimestamp()
              });
              task.considerarEnPromedio = evaluationInput.checked;
              evaluationLabel.textContent = evaluationInput.checked
                ? 'Cuenta para el promedio'
                : 'No cuenta para el promedio';
            } catch (error) {
              console.error(`No se pudo actualizar la inclusión de la tarea ${task.id} en el promedio:`, error);
              evaluationInput.checked = !evaluationInput.checked;
              evaluationLabel.textContent = evaluationInput.checked
                ? 'Cuenta para el promedio'
                : 'No cuenta para el promedio';
              listStatus.textContent = 'No se pudo actualizar si la tarea cuenta para el promedio. Revisa los permisos de Firestore.';
            } finally {
              evaluationInput.disabled = false;
            }
          });
          actions.append(evaluationField);
          const editButton = addText(actions, 'button', '', 'Editar');
          editButton.type = 'button';
          editButton.addEventListener('click', () => openTaskComposer(task));
          const deleteButton = addText(actions, 'button', 'task-delete-button', 'Eliminar');
          deleteButton.type = 'button';
          deleteButton.addEventListener('click', async () => {
            if (!confirm(`¿Eliminar la tarea "${task.titulo || 'Tarea sin título'}"? Esta acción no se puede deshacer.`)) return;
            deleteButton.disabled = true;
            editButton.disabled = true;
            deleteButton.textContent = 'Eliminando...';
            try {
              await deleteDoc(doc(db, 'Aulas', aula.id, 'tareas', task.id));
              const refreshedTasks = await renderTasks(aula);
              tasksPage.replaceWith(refreshedTasks);
            } catch (error) {
              console.error(`No se pudo eliminar la tarea ${task.id} del aula ${aula.id}:`, error);
              deleteButton.disabled = false;
              editButton.disabled = false;
              deleteButton.textContent = 'Eliminar';
              listStatus.textContent = 'No se pudo eliminar la tarea. Revisa los permisos de Firestore.';
            }
          });
          card.append(actions);
          unitGroup.element.append(card);
        });
      } catch (error) {
        console.error(`No se pudieron cargar las tareas del aula ${aula.id}:`, error);
        listStatus.textContent = 'No se pudieron cargar las tareas. Revisa los permisos de lectura de Firestore.';
      }

      async function openTaskComposer(editingTask = null) {
        let taskSubjects;
        try {
          const [subjectsSnapshot, pizarrasSnapshot] = await Promise.all([
            getDocs(collection(db, 'Aulas', aula.id, 'materias')),
            getDocs(collection(db, 'Aulas', aula.id, 'pizarras'))
          ]);
          taskSubjects = collectClassSubjects(subjectsSnapshot, pizarrasSnapshot);
        } catch (error) {
          console.error(`No se pudieron cargar las materias para las tareas del aula ${aula.id}:`, error);
          listStatus.textContent = 'No se pudieron cargar las materias. Revisa los permisos de lectura de Firestore.';
          return;
        }

        const composer = document.createElement('form');
        composer.className = 'task-composer';
        const main = document.createElement('div');
        main.className = 'task-composer-main';
        const contentCard = document.createElement('section');
        contentCard.className = 'task-composer-card';
        const titleInput = document.createElement('input');
        titleInput.className = 'task-title-input';
        titleInput.type = 'text';
        titleInput.maxLength = 160;
        titleInput.required = true;
        titleInput.placeholder = 'Título*';
        titleInput.setAttribute('aria-label', 'Título de la tarea');
        titleInput.value = editingTask?.titulo || '';

        const editorToolbar = document.createElement('div');
        editorToolbar.className = 'editor-toolbar';
        editorToolbar.setAttribute('aria-label', 'Formato de instrucciones');
        const instructions = document.createElement('div');
        instructions.className = 'task-instructions';
        instructions.contentEditable = 'true';
        instructions.setAttribute('role', 'textbox');
        instructions.setAttribute('aria-label', 'Instrucciones de la tarea');
        instructions.setAttribute('aria-multiline', 'true');
        instructions.dataset.placeholder = 'Instrucciones (opcional)';
        instructions.innerHTML = sanitizeRichHtml(editingTask?.instrucciones || '');
        const mathPreviewTitle = addText(contentCard, 'h4', 'task-math-preview-title', 'Vista previa de las instrucciones');
        mathPreviewTitle.hidden = true;
        const mathPreview = document.createElement('div');
        mathPreview.className = 'task-math-preview';
        mathPreview.hidden = true;
        [
          ['bold', 'B', 'Negrita', 'font-weight:700'],
          ['italic', 'I', 'Cursiva', 'font-style:italic'],
          ['underline', 'U', 'Subrayado', 'text-decoration:underline'],
          ['insertUnorderedList', '• Lista', 'Lista con viñetas', ''],
          ['removeFormat', 'Tx', 'Quitar formato', '']
        ].forEach(([command, label, title, style]) => {
          const button = addText(editorToolbar, 'button', '', label);
          button.type = 'button';
          button.title = title;
          button.setAttribute('aria-label', title);
          if (style) button.style.cssText = style;
          button.addEventListener('mousedown', (event) => event.preventDefault());
          button.addEventListener('click', () => {
            instructions.focus();
            document.execCommand(command);
          });
        });
        const mathHelp = addText(
          contentCard,
          'p',
          'task-math-help',
          String.raw`Para incluir operaciones, escribe LaTeX entre $$...$$; por ejemplo: $$\frac{1}{2}+\frac{3}{4}$$. La vista previa aparece debajo al pegar o escribir fórmulas.`
        );
        let mathPreviewRequest = 0;
        let mathPreviewTimer;
        function updateMathPreview() {
          const requestId = ++mathPreviewRequest;
          window.clearTimeout(mathPreviewTimer);
          const containsMath = /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/.test(instructions.textContent || '');
          mathPreview.hidden = !containsMath;
          mathPreviewTitle.hidden = !containsMath;
          if (!containsMath) {
            window.MathJax?.typesetClear?.([mathPreview]);
            mathPreview.replaceChildren();
            return;
          }

          mathPreviewTimer = window.setTimeout(async () => {
            try {
              const mathJax = window.MathJax;
              if (mathJax?.startup?.promise) await mathJax.startup.promise;
              if (requestId !== mathPreviewRequest) return;
              if (!mathJax?.typesetPromise) throw new Error('MathJax no está disponible.');
              mathJax.typesetClear?.([mathPreview]);
              mathPreview.innerHTML = sanitizeRichHtml(instructions.innerHTML);
              await mathJax.typesetPromise([mathPreview]);
            } catch (error) {
              console.error('No se pudo actualizar la vista previa matemática:', error);
            }
          }, 200);
        }
        instructions.addEventListener('input', updateMathPreview);
        instructions.addEventListener('paste', () => window.setTimeout(updateMathPreview, 0));
        updateMathPreview();
        contentCard.append(titleInput, editorToolbar, instructions, mathPreviewTitle, mathPreview, mathHelp);

        const attachmentsLabel = addText(contentCard, 'h4', '', 'Adjuntar');
        attachmentsLabel.style.margin = '16px 0 0';
        const attachments = document.createElement('div');
        attachments.className = 'task-attachments';
