<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aulas y alumnos asignados al profesor.">
  <title>Panel del profesor | Docére</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    window.MathJax = {
      tex: {
        packages: { '[+]': ['ams'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true

  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <link rel="stylesheet" href="panel-visual-theme.css">
  <link rel="stylesheet" href="student-due-calendar.css">
  <style>
    :root {
      --page: #f4f7fb;
      --surface: #fff;
      --ink: #142033;
      --muted: #64748b;
      --line: #dce4ee;
      --blue: #155eef;
      --green: #087f5b;
      --red: #b42318;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px max(20px, calc((100vw - 1160px) / 2)); background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .brand-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 7px; background: #eaf1ff; color: var(--blue); }
    .identity { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 14px; }
    .teacher-notifications { position: relative; }
    .teacher-notification-button { position: relative; display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); cursor: pointer; }
    .teacher-notification-button:hover, .teacher-notification-button[aria-expanded="true"] { background: #edf3fb; color: var(--blue); }
    .teacher-notification-count { position: absolute; top: -5px; right: -5px; display: grid; min-width: 18px; height: 18px; place-items: center; padding: 0 4px; border: 2px solid #fff; border-radius: 999px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; }
    .teacher-notification-count[hidden], .teacher-notification-panel[hidden], .teacher-notification-toast[hidden] { display: none; }
    .teacher-notification-panel { position: absolute; z-index: 120; top: calc(100% + 10px); right: 0; display: grid; width: min(340px, calc(100vw - 28px)); max-height: min(420px, 70vh); overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 12px 30px rgba(15, 23, 42, .18); }
    .teacher-notification-panel h2 { padding: 13px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .teacher-notification-list { display: grid; }
    .teacher-notification-item, .teacher-notification-empty { padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; color: var(--ink); text-align: left; }
    .teacher-notification-item { display: grid; gap: 4px; cursor: pointer; }
    .teacher-notification-item:hover { background: #f8fafc; }
    .teacher-notification-item strong { font-size: 13px; }
    .teacher-notification-item span, .teacher-notification-empty { color: var(--muted); font-size: 12px; }
    .teacher-notification-toast { position: fixed; z-index: 130; top: 75px; right: 20px; max-width: min(360px, calc(100vw - 32px)); padding: 12px 16px; border: 1px solid #bfdbfe; border-left: 4px solid var(--blue); border-radius: 7px; background: #fff; color: var(--ink); box-shadow: 0 8px 24px rgba(15, 23, 42, .18); font-size: 13px; }
    .logout { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); cursor: pointer; }
    .panel-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 63px); }
    .class-sidebar { padding: 20px 10px; background: #f7f9fc; border-right: 1px solid var(--line); }
    .sidebar-heading { display: flex; align-items: center; gap: 9px; padding: 0 10px 14px; color: #334155; font-size: 14px; font-weight: 750; }
    .class-list { display: grid; gap: 4px; }
    .class-nav-button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .class-nav-button:hover { background: #edf3fb; }
    .class-nav-button[aria-current="true"] { background: #d9efff; color: #075985; }
    .class-initial { flex: 0 0 28px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #e7edf5; color: #475569; font-size: 12px; font-weight: 750; }
    .class-nav-button[aria-current="true"] .class-initial { background: #fff; color: #075985; }
    .class-nav-text { min-width: 0; }
    .class-nav-name, .class-nav-course { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .class-nav-name { font-size: 13px; font-weight: 650; }
    .class-nav-course { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .class-workspace { min-width: 0; padding: 22px clamp(16px, 3vw, 42px) 40px; }
    .class-workspace[hidden] { display: none; }
    .class-heading { margin-bottom: 18px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .class-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    .status { min-height: 20px; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .classroom { overflow: hidden; border: 1px solid #d6dce3; border-radius: 10px; background: var(--surface); box-shadow: 0 2px 6px rgba(20, 32, 51, .05); }
    .classroom-header { position: relative; display: flex; min-height: 205px; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 24px; color: #fff; background: linear-gradient(125deg, #34464e, #526873); }
    .classroom-header::after { position: absolute; right: -24px; bottom: -46px; width: 148px; height: 110px; border: 18px solid rgba(255,255,255,.09); border-radius: 50%; content: ""; transform: rotate(-25deg); }
    .classroom-banner-1 { background: linear-gradient(125deg, #155e75, #1592a8); }
    .classroom-banner-2 { background: linear-gradient(125deg, #3f4f72, #667ca5); }
    .classroom-banner-3 { background: linear-gradient(125deg, #6a4a37, #a16d4c); }
    .classroom-header h2 { position: relative; z-index: 1; margin: 0 0 5px; font-size: clamp(22px, 3vw, 30px); line-height: 1.25; overflow-wrap: anywhere; }
    .classroom-header p { position: relative; z-index: 1; margin: 0; color: rgba(255,255,255,.88); font-size: 13px; font-weight: 600; }
    .student-count { position: relative; z-index: 1; flex: 0 0 auto; padding: 5px 8px; border-radius: 20px; background: rgba(255,255,255,.18); color: #fff; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .meeting-link-dialog { width: min(92vw, 500px); margin: auto; padding: 22px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); box-shadow: 0 20px 50px rgba(15, 23, 42, .25); }
    .meeting-link-dialog::backdrop { background: rgba(15, 23, 42, .55); }
    .meeting-link-dialog h2 { margin: 0 0 6px; font-size: 19px; }
    .meeting-link-dialog > p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .meeting-link-form { display: grid; gap: 10px; }
    .meeting-link-form label { font-size: 13px; font-weight: 650; }
    .meeting-link-form input { width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .meeting-link-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .meeting-link-actions button { min-height: 38px; padding: 0 13px; border: 0; border-radius: 5px; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
    .meeting-link-actions button[type="button"] { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .meeting-link-actions button:disabled { cursor: wait; opacity: .65; }
    .meeting-link-status { min-height: 18px; margin: 0; color: var(--muted); font-size: 12px; }
    .class-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
    .class-tab { flex: 0 0 auto; min-height: 48px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #475569; font-size: 12px; font-weight: 650; cursor: pointer; }
    .class-tab:hover { background: #f8fafc; }
    .class-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--ink); }
    .tab-content { min-height: 330px; padding: 18px; }
    .tab-content[hidden] { display: none; }
    .announcements { display: grid; gap: 14px; }
    .teacher-announcement-layout { display: grid; grid-template-columns: minmax(235px, 275px) minmax(0, 1fr) minmax(230px, 290px); align-items: start; gap: 14px; min-width: 0; }
    .teacher-evaluation-calendar, .teacher-announcement-main, .teacher-dashboard-sidebar { display: grid; min-width: 0; gap: 14px; }
    .teacher-evaluation-calendar { position: sticky; top: 82px; }
    .teacher-evaluation-calendar .student-due-calendar { margin: 0; padding: 12px; }
    .teacher-evaluation-calendar .student-due-calendar-header { display: grid; gap: 8px; }
    .teacher-evaluation-calendar .student-due-calendar-header h2 { font-size: 15px; }
    .teacher-evaluation-calendar .student-due-calendar-month-nav { justify-content: space-between; gap: 6px; }
    .teacher-evaluation-calendar .student-due-calendar-month { min-width: 0; font-size: 12px; }
    .teacher-evaluation-calendar .student-due-calendar-nav { width: 30px; height: 30px; flex: 0 0 30px; }
    .teacher-evaluation-calendar .student-due-calendar-grid { gap: 2px; }
    .teacher-evaluation-calendar .student-due-calendar-weekday { padding: 5px 0; font-size: 10px; }
    .teacher-evaluation-calendar .student-due-calendar-day { min-height: 36px; font-size: 11px; }
    .teacher-evaluation-calendar .student-due-calendar-details { padding: 9px; }
    .teacher-evaluation-calendar .student-due-calendar-details p,
    .teacher-evaluation-calendar .student-due-calendar-task-label { font-size: 11px; }
    .teacher-evaluation-calendar .student-due-calendar-task-meta { font-size: 10px; }
    .teacher-pending-undated { display: grid; gap: 7px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .teacher-pending-undated h3 { margin: 0; font-size: 13px; }
    .teacher-pending-undated-list { display: grid; max-height: 180px; gap: 6px; overflow-y: auto; }
    .teacher-pending-undated-item { display: grid; gap: 2px; padding: 7px; border: 1px solid var(--line); border-radius: 5px; }
    .teacher-pending-undated-item strong { font-size: 11px; overflow-wrap: anywhere; }
    .teacher-pending-undated-item span, .teacher-evaluation-status { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .teacher-dashboard-sidebar { position: sticky; top: 82px; }
    .teacher-sidebar-card { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .teacher-sidebar-card h3 { margin: 0; font-size: 15px; }
    .teacher-upcoming-events { display: grid; max-height: 300px; gap: 8px; overflow-y: auto; padding: 8px; border: 1px dashed var(--line); border-radius: 6px; }
    .teacher-upcoming-event { display: grid; gap: 3px; padding: 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
    .teacher-upcoming-event strong { color: var(--blue); font-size: 12px; overflow-wrap: anywhere; }
    .teacher-upcoming-event span, .teacher-sidebar-empty { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .teacher-create-event { width: 100%; min-height: 36px; padding: 0 10px; border: 1px solid var(--blue); border-radius: 5px; background: #fff; color: var(--blue); font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    .teacher-create-event:hover { background: #edf3fb; }
    .teacher-ranking-table-wrap { max-height: 280px; overflow: auto; }
    .teacher-ranking-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .teacher-ranking-table th, .teacher-ranking-table td { padding: 7px 5px; border-bottom: 1px solid var(--line); text-align: left; }
    .teacher-ranking-table th:last-child, .teacher-ranking-table td:last-child { text-align: right; white-space: nowrap; }
    .teacher-ranking-table td:nth-child(2) { overflow-wrap: anywhere; }
    .teacher-ranking-table tr:last-child td { border-bottom: 0; }
    .announcement-form { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .announcement-form input, .announcement-form select { min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 5px; }
    .editor-toolbar button { min-width: 36px; min-height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
    .editor-toolbar button:hover { background: #edf3fb; }
    .editor-color-control { position: relative; display: inline-flex; }
    .editor-color-trigger { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
    .editor-color-swatch { width: 16px; height: 16px; border: 1px solid rgba(15, 23, 42, .25); border-radius: 50%; }
    .editor-color-popover { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; display: grid; width: 240px; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(15, 23, 42, .2); }
    .editor-color-popover[hidden] { display: none; }
    .editor-color-saturation { position: relative; height: 130px; overflow: hidden; border-radius: 5px; background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(220 100% 50%)); cursor: crosshair; touch-action: none; }
    .editor-color-saturation::after { position: absolute; top: var(--color-value, 0%); left: var(--color-saturation, 100%); width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #111; content: ""; transform: translate(-50%, -50%); }
    .editor-color-hue { width: 100%; margin: 0; accent-color: var(--blue); }
    .editor-color-details { display: flex; align-items: center; gap: 8px; }
    .editor-color-preview { width: 30px; height: 30px; flex: 0 0 30px; border: 1px solid rgba(15, 23, 42, .25); border-radius: 50%; }
    .editor-color-hex { width: 100%; min-width: 0; min-height: 34px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; text-transform: uppercase; }
    .editor-color-hex[aria-invalid="true"] { border-color: var(--red); }
    .editor-color-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .editor-toolbar .editor-color-apply { min-height: 36px; padding: 0 12px; border: 0; border-radius: 5px; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
    .editor-toolbar .editor-color-apply:hover { background: #124bc2; }
    .editor-color-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    .announcement-editor { min-height: 140px; padding: 11px; border: 1px solid var(--line); border-radius: 5px; background: #fff; line-height: 1.5; }
    .announcement-editor:focus { outline: 2px solid #a9c4ff; border-color: var(--blue); }
    .announcement-editor:empty::before { color: #94a3b8; content: attr(data-placeholder); pointer-events: none; }
    .announcement-submit { justify-self: start; min-height: 38px; padding: 0 14px; border: 0; border-radius: 5px; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
    .announcement-submit:disabled { opacity: .6; cursor: wait; }
    .announcement-list { display: grid; gap: 10px; }
    .publication-form { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .publication-form input { width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .publication-form .announcement-editor { min-height: 120px; }
    .announcement-card { padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .announcement-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .announcement-card h3 { margin: 0 0 4px; font-size: 16px; }
    .announcement-meta { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .announcement-body { overflow-wrap: anywhere; line-height: 1.55; }
    .announcement-edit { flex: 0 0 auto; min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer; }
    .announcement-edit:hover { background: #edf3fb; }
    .pizarra-group { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .pizarra-group-header, .pizarra-entry, .pizarra-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pizarra-group-header h3, .pizarra-entry strong { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
    .pizarra-group-header h3 { font-size: 16px; }
    .pizarra-entry { flex-wrap: wrap; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .pizarra-entry > a { min-width: 0; color: var(--blue); overflow-wrap: anywhere; }
    .pizarra-actions { flex: 0 0 auto; }
    .pizarra-order-button { min-height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font-size: 12px; cursor: pointer; }
    .pizarra-order-button:hover:not(:disabled) { background: #edf3fb; }
    .pizarra-order-button:disabled { opacity: .45; cursor: not-allowed; }
    .pizarra-delete { flex: 0 0 auto; min-height: 34px; padding: 0 10px; border: 1px solid #fecdca; border-radius: 5px; background: #fff; color: var(--red); font-size: 12px; font-weight: 650; cursor: pointer; }
    .pizarra-delete:hover { background: #fef3f2; }
    .pizarra-delete:disabled, .announcement-edit:disabled { opacity: .6; cursor: wait; }
    .pizarra-group-empty { margin: 0; color: var(--muted); font-size: 13px; }
    .announcement-body > :first-child { margin-top: 0; }
    .announcement-body > :last-child { margin-bottom: 0; }
    .attendance-summary { display: flex; flex-wrap: wrap; gap: 8px; }
    .attendance-stat { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; }
    .attendance { grid-template-columns: minmax(0, 1fr); min-width: 0; }
    .attendance > * { min-width: 0; }
    .attendance-roster { display: grid; gap: 8px; width: 100%; min-width: 0; }
    .attendance-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); align-items: center; gap: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; }
    .attendance-row-name { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .attendance-row-email { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .attendance-row select { min-height: 36px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .attendance-history-wrap { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; border: 1px solid var(--line); border-radius: 7px; }
    .attendance-history { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
    .attendance-history th, .attendance-history td { padding: 9px 11px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: left; }
    .attendance-history th { position: sticky; top: 0; background: #f1f5f9; font-weight: 700; }
    .attendance-history th:first-child { position: sticky; left: 0; z-index: 1; }
    .attendance-history td:first-child { position: sticky; left: 0; background: #fff; font-weight: 650; }
    .attendance-history tr:last-child td { border-bottom: 0; }
    .attendance-date-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 5px; }
    .attendance-delete-date { display: grid; place-items: center; flex: 0 0 20px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: #fee4e2; color: var(--red); font-size: 16px; font-weight: 750; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s ease; }
    .attendance-history th:hover .attendance-delete-date, .attendance-delete-date:focus-visible { opacity: 1; }
    @media (hover: none) { .attendance-delete-date { opacity: 1; } }
    .attendance-delete-date:disabled { opacity: .6; cursor: wait; }
    .attendance-history td { position: relative; }
    .attendance-cell-trigger { width: 100%; min-width: 62px; min-height: 28px; padding: 3px 5px; border: 0; border-radius: 4px; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; }
    .attendance-cell-trigger:hover, .attendance-cell-trigger:focus-visible { outline: 2px solid #a9c4ff; outline-offset: -2px; background: #f8fafc; }
    .attendance-cell-menu { position: absolute; z-index: 3; top: calc(100% - 2px); left: 4px; min-width: 125px; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: #fff; box-shadow: 0 5px 16px rgba(15, 23, 42, .16); }
    .attendance-cell-menu[hidden] { display: none; }
    .attendance-cell-menu select { width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
    .attendance-cell-menu select:disabled { opacity: .65; }
    .attendance-history .state-attended { color: var(--green); font-weight: 650; }

    function createEditorColorControl(editor) {
      const control = document.createElement('div');
      control.className = 'editor-color-control';
      let hue = 220;
      let saturation = 0.91;
      let value = 0.94;
      let savedRange = null;
      let color = '#155eef';
      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'editor-color-trigger';
      trigger.setAttribute('aria-haspopup', 'true');

      swatch.className = 'editor-color-swatch';
      swatch.setAttribute('aria-hidden', 'true');
      trigger.append(swatch, document.createTextNode('Color'));
      const popover = document.createElement('div');
      popover.className = 'editor-color-popover';
      popover.hidden = true;
      popover.setAttribute('role', 'dialog');
      popover.setAttribute('aria-label', 'Selector de color');
      const saturationArea = document.createElement('div');
      saturationArea.className = 'editor-color-saturation';
      saturationArea.setAttribute('role', 'slider');
      saturationArea.setAttribute('aria-label', 'Saturación e intensidad del color');
      saturationArea.setAttribute('aria-valuemin', '0');
      saturationArea.setAttribute('aria-valuemax', '100');
      saturationArea.tabIndex = 0;
      const hueInput = document.createElement('input');
      hueInput.type = 'range';
      hueInput.className = 'editor-color-hue';
      hueInput.min = '0';
      hueInput.max = '360';
      hueInput.value = String(hue);
      hueInput.setAttribute('aria-label', 'Tono del color');
      const details = document.createElement('div');
      details.className = 'editor-color-details';
      const preview = document.createElement('span');
      preview.className = 'editor-color-preview';
      preview.setAttribute('aria-hidden', 'true');
      const hexInput = document.createElement('input');
      hexInput.type = 'text';
      hexInput.className = 'editor-color-hex';
      hexInput.value = color;
      hexInput.maxLength = 7;
      hexInput.setAttribute('aria-label', 'Código hexadecimal del color');
      hexInput.autocomplete = 'off';
      const colorStatus = document.createElement('span');
      colorStatus.className = 'editor-color-status';
      colorStatus.setAttribute('role', 'status');
      const actions = document.createElement('div');
      actions.className = 'editor-color-actions';
      const applyButton = addText(actions, 'button', 'editor-color-apply', 'Aceptar');
      applyButton.type = 'button';
      const closeButton = addText(actions, 'button', '', 'Cancelar');
      closeButton.type = 'button';
      closeButton.style.cssText = 'min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);cursor:pointer';

      const hsvToHex = () => {
        const chroma = value * saturation;
        const segment = hue / 60;
        const secondary = chroma * (1 - Math.abs((segment % 2) - 1));
        const offset = value - chroma;
        const [red, green, blue] = segment < 1 ? [chroma, secondary, 0]
          : segment < 2 ? [secondary, chroma, 0]
            : segment < 3 ? [0, chroma, secondary]
              : segment < 4 ? [0, secondary, chroma]
                : segment < 5 ? [secondary, 0, chroma]
                  : [chroma, 0, secondary];
        return `#${[red, green, blue].map((channel) =>
          Math.round((channel + offset) * 255).toString(16).padStart(2, '0')
        ).join('')}`;
      };
      const hexToHsv = (hex) => {
        const channels = hex.slice(1).match(/.{2}/g).map((channel) => parseInt(channel, 16) / 255);
        const [red, green, blue] = channels;
        const maximum = Math.max(red, green, blue);
        const minimum = Math.min(red, green, blue);
        const delta = maximum - minimum;
        let nextHue = 0;
        if (delta) {
          if (maximum === red) nextHue = 60 * (((green - blue) / delta) % 6);
          else if (maximum === green) nextHue = 60 * ((blue - red) / delta + 2);
          else nextHue = 60 * ((red - green) / delta + 4);
        }
        return {
          hue: (nextHue + 360) % 360,
          saturation: maximum ? delta / maximum : 0,
          value: maximum
        };
      };
      const updateColor = (nextColor = hsvToHex()) => {
        color = nextColor;
        hexInput.value = color;
        hexInput.removeAttribute('aria-invalid');
        colorStatus.textContent = '';
        swatch.style.backgroundColor = color;
        preview.style.backgroundColor = color;
        saturationArea.style.backgroundImage = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(${hue} 100% 50%))`;
        saturationArea.style.setProperty('--color-saturation', `${saturation * 100}%`);
        saturationArea.style.setProperty('--color-value', `${(1 - value) * 100}%`);
        saturationArea.setAttribute('aria-valuenow', String(Math.round(saturation * 100)));
      };
      const saveSelection = () => {
        const selection = window.getSelection();
        if (selection?.rangeCount && editor.contains(selection.anchorNode)) {
          savedRange = selection.getRangeAt(0).cloneRange();
        }
      };
      const setSaturationAndValue = (event) => {
        const bounds = saturationArea.getBoundingClientRect();
        saturation = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
        value = 1 - Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height));
        updateColor();
      };
      saturationArea.addEventListener('pointerdown', (event) => {
        saturationArea.setPointerCapture(event.pointerId);
        setSaturationAndValue(event);
      });
      saturationArea.addEventListener('pointermove', (event) => {
        if (saturationArea.hasPointerCapture(event.pointerId)) setSaturationAndValue(event);
      });
      saturationArea.addEventListener('keydown', (event) => {
        const increment = event.shiftKey ? 0.1 : 0.02;
        if (event.key === 'ArrowLeft') saturation = Math.max(0, saturation - increment);
        else if (event.key === 'ArrowRight') saturation = Math.min(1, saturation + increment);
        else if (event.key === 'ArrowUp') value = Math.min(1, value + increment);
        else if (event.key === 'ArrowDown') value = Math.max(0, value - increment);
        else return;
        event.preventDefault();
        updateColor();
      });
      hueInput.addEventListener('input', () => {
        hue = Number(hueInput.value);
        updateColor();
      });
      hexInput.addEventListener('input', () => {
        if (!/^#[\da-f]{6}$/i.test(hexInput.value)) {
          hexInput.setAttribute('aria-invalid', 'true');
          colorStatus.textContent = 'Escribe un color hexadecimal válido.';
          return;
        }
        hexInput.removeAttribute('aria-invalid');
        colorStatus.textContent = '';
        ({ hue, saturation, value } = hexToHsv(hexInput.value));
        hueInput.value = String(hue);
        updateColor(hexInput.value.toLowerCase());
      });
      trigger.addEventListener('pointerdown', saveSelection);
      trigger.addEventListener('focus', saveSelection);
      trigger.addEventListener('click', () => {
        popover.hidden = !popover.hidden;
        trigger.setAttribute('aria-expanded', String(!popover.hidden));
        if (!popover.hidden) saturationArea.focus();
      });
      const closePopover = () => {
        popover.hidden = true;
        trigger.setAttribute('aria-expanded', 'false');
        trigger.focus();
      };
      applyButton.addEventListener('click', () => {
        if (!/^#[\da-f]{6}$/i.test(hexInput.value)) {
          hexInput.setAttribute('aria-invalid', 'true');
          hexInput.focus();
          return;
        }
        editor.focus();
        if (savedRange) {
          const selection = window.getSelection();
          selection?.removeAllRanges();
          selection?.addRange(savedRange);
        }
        document.execCommand('foreColor', false, color);
        savedRange = null;
        closePopover();
      });
      closeButton.addEventListener('click', closePopover);
      popover.append(saturationArea, hueInput, details, colorStatus, actions);
      details.append(preview, hexInput);
      control.append(trigger, popover);
      ({ hue, saturation, value } = hexToHsv(color));
      hueInput.value = String(hue);
      updateColor();
      return control;
    }

    async function notifyStudents(students, notification) {
      const { notificationDocId, ...notificationData } = notification;
      const recipients = (Array.isArray(students) ? students : [])
        .filter((student) => student?.id && student?.coleccion);
      for (let offset = 0; offset < recipients.length; offset += 450) {
        const batch = writeBatch(db);
        recipients.slice(offset, offset + 450).forEach((student) => {
          const notificationId = notificationDocId || `${notification.tipo}_${notification.aulaId}_${notification.id}`;
          batch.set(doc(db, 'Notificaciones', getStudentNotificationKey(student), 'items', notificationId), {
            ...notificationData,
            estudianteId: student.id,
            estudianteColeccion: student.coleccion,
            leida: false,
            creadoEn: serverTimestamp()
          });
        });
        await batch.commit();
      }
    }

    function sanitizeRichHtml(html) {
      const allowedTags = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'H2', 'H3', 'UL', 'OL', 'LI', 'BLOCKQUOTE']);
      const blockedTags = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'SVG', 'MATH']);
      const parsed = new DOMParser().parseFromString(html, 'text/html');

      function copySafeNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent || '');
        if (node.nodeType !== Node.ELEMENT_NODE || blockedTags.has(node.tagName)) return document.createDocumentFragment();

        const fragment = document.createDocumentFragment();
        const target = allowedTags.has(node.tagName) ? document.createElement(node.tagName.toLowerCase()) : fragment;
        Array.from(node.childNodes).forEach((child) => target.append(copySafeNode(child)));
        return target;
      }

      const safeContent = document.createElement('div');
      Array.from(parsed.body.childNodes).forEach((node) => safeContent.append(copySafeNode(node)));
      return safeContent.innerHTML;
    }

    function sanitizeAnnouncementHtml(html) {
      const allowedTags = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'H2', 'H3', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'SPAN', 'FONT']);
      const blockedTags = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'SVG', 'MATH']);
      const parsed = new DOMParser().parseFromString(html, 'text/html');

      function copySafeNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent || '');
        if (node.nodeType !== Node.ELEMENT_NODE || blockedTags.has(node.tagName)) return document.createDocumentFragment();

        const fragment = document.createDocumentFragment();
        const isColorTag = node.tagName === 'SPAN' || node.tagName === 'FONT';
        const target = allowedTags.has(node.tagName)
          ? document.createElement(node.tagName === 'FONT' ? 'span' : node.tagName.toLowerCase())
          : fragment;
        const color = node.style?.color || (node.tagName === 'FONT' ? node.getAttribute('color') : '');
        if (isColorTag && /^#[\da-f]{3}(?:[\da-f]{3})?$/i.test(color || '')) target.style.color = color;
        Array.from(node.childNodes).forEach((child) => target.append(copySafeNode(child)));
        return target;
      }

      const safeContent = document.createElement('div');
      Array.from(parsed.body.childNodes).forEach((node) => safeContent.append(copySafeNode(node)));
      return safeContent.innerHTML;
    }

        return evaluationDataPromise;
      }

      async function loadUpcomingEvents() {
        upcomingEvents.replaceChildren();
        try {
          const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'publicaciones'));
          const today = getLocalDateString();
          const records = snapshot.docs
            .map((eventDoc) => ({ id: eventDoc.id, ...eventDoc.data() }))
            .filter((record) => typeof record.fecha === 'string'
              && /^\d{4}-\d{2}-\d{2}$/.test(record.fecha)
              && !Number.isNaN(new Date(`${record.fecha}T12:00:00`).getTime())
              && record.fecha >= today)
            .sort((left, right) => left.fecha.localeCompare(right.fecha))
            .slice(0, 5);
          if (!records.length) {
            addText(upcomingEvents, 'p', 'teacher-sidebar-empty', 'No hay próximos eventos.');
            return;
          }
          records.forEach((record) => {
            const eventCard = document.createElement('article');
            eventCard.className = 'teacher-upcoming-event';
            addText(eventCard, 'strong', '', record.titulo || 'Evento');
            const date = new Intl.DateTimeFormat('es-MX', {
              day: 'numeric',
              month: 'short',
              year: 'numeric'
            }).format(new Date(`${record.fecha}T12:00:00`));
            addText(eventCard, 'span', '', `Fecha: ${date}`);
            if (record.lugar) addText(eventCard, 'span', '', record.lugar);
            upcomingEvents.append(eventCard);
          });
        } catch (error) {
          console.error(`No se pudieron cargar los próximos eventos del aula ${aula.id}:`, error);
          addText(upcomingEvents, 'p', 'teacher-sidebar-empty', 'No se pudieron cargar los eventos.');
        }
      }

      function renderPendingEvaluationCalendar(tasks, feedbackSnapshots) {
        const pendingTasks = tasks.map((task, taskIndex) => {
          const assignedStudents = Array.isArray(task.alumnosAsignados)
            ? task.alumnosAsignados
            : Array.isArray(aula.alumnos) ? aula.alumnos : [];
          const evaluatedStudentKeys = new Set();
          feedbackSnapshots[taskIndex].docs.forEach((feedbackDoc) => {
            const feedback = feedbackDoc.data();
            if (feedback.calificacion == null || String(feedback.calificacion).trim() === '') return;
            const score = Number(feedback.calificacion);
            const maxScore = Number(feedback.puntosMaximos ?? task.puntos ?? 100);
            if (!Number.isFinite(score) || !Number.isFinite(maxScore)
                || maxScore <= 0 || score < 0 || score > maxScore) return;
            if (feedback.estudianteId != null && feedback.estudianteColeccion) {
              evaluatedStudentKeys.add(`${feedback.estudianteColeccion}/${feedback.estudianteId}`);
              return;
            }
            const assignedStudent = assignedStudents.find((student) =>
              feedbackDoc.id === `${student.coleccion}_${student.id}`
            );
            if (assignedStudent) evaluatedStudentKeys.add(`${assignedStudent.coleccion}/${assignedStudent.id}`);
          });
          const uniqueAssignees = new Map(assignedStudents
            .filter((student) => student?.id != null && student.coleccion)
            .map((student) => [`${student.coleccion}/${student.id}`, student]));
          const assignedCount = uniqueAssignees.size;
          const evaluatedCount = Array.from(uniqueAssignees.keys())
            .filter((studentKey) => evaluatedStudentKeys.has(studentKey)).length;
          const pendingCount = assignedCount - evaluatedCount;
          return pendingCount > 0 ? { ...task, assignedCount, pendingCount } : null;
        }).filter(Boolean);
        const tasksWithDates = pendingTasks.filter((task) => getTaskDeadlineDate(task.fechaEntrega));
        const tasksWithoutDates = pendingTasks.filter((task) => !getTaskDeadlineDate(task.fechaEntrega));
        createStudentDueCalendar(evaluationCalendarContainer, null, {
          title: 'Por evaluar',
          gridLabel: 'Fechas de evaluaciones pendientes',
          emptyDayMessage: 'No hay evaluaciones pendientes para este día.',
          countLabel: 'evaluación(es) por revisar'
        }).setTasks(tasksWithDates.map((task) => ({
          ...task,
          tema: `${task.tipoEvaluacion === 'simulacro' ? 'Examen simulacro' : task.materia || 'General'} · faltan ${task.pendingCount} de ${task.assignedCount} alumno(s)`
        })));
        undatedTasksList.replaceChildren();
        if (tasksWithoutDates.length) {
          tasksWithoutDates.forEach((task) => {
            const item = document.createElement('article');
            item.className = 'teacher-pending-undated-item';
            addText(item, 'strong', '', task.titulo || (task.tipoEvaluacion === 'simulacro' ? 'Examen simulacro' : 'Tarea sin título'));
            addText(item, 'span', '', `${task.tipoEvaluacion === 'simulacro' ? 'Examen simulacro' : task.materia || 'General'} · faltan ${task.pendingCount} de ${task.assignedCount} alumno(s)`);
            undatedTasksList.append(item);
          });
        } else {
          addText(undatedTasksList, 'p', 'teacher-evaluation-status', 'No hay tareas pendientes sin fecha.');
        }
        const pendingStudentCount = pendingTasks.reduce((total, task) => total + task.pendingCount, 0);
        evaluationCalendarStatus.textContent = pendingTasks.length
          ? `${pendingTasks.length} asignación(es) pendiente(s) · ${pendingStudentCount} evaluación(es) faltante(s).`
          : 'Todas las asignaciones ya tienen evaluación.';
      }

      async function loadDashboardInsights() {
        rankingContent.replaceChildren();
        try {
          const { tasks, feedbackSnapshots } = await loadEvaluationData();
          renderPendingEvaluationCalendar(tasks, feedbackSnapshots);
          const studentScores = new Map();
          feedbackSnapshots.forEach((snapshot, taskIndex) => {
            const evaluationType = tasks[taskIndex].tipoEvaluacion === 'simulacro' ? 'practiceExams' : 'assignments';
            if (tasks[taskIndex].considerarEnPromedio === false) return;
            snapshot.docs.forEach((feedbackDoc) => {
              const feedback = feedbackDoc.data();
              const score = Number(feedback.calificacion);
              const maxScore = Number(feedback.puntosMaximos ?? tasks[taskIndex].puntos ?? 100);
              if (feedback.estudianteId == null || !feedback.estudianteColeccion
                  || !Number.isFinite(score) || !Number.isFinite(maxScore)
                  || maxScore <= 0 || score < 0 || score > maxScore) {
                console.error(`Se omitió una calificación inválida del ranking (${feedbackDoc.ref.path}).`);
                return;
              }
              const studentKey = `${feedback.estudianteColeccion}/${feedback.estudianteId}`;
              const aggregate = studentScores.get(studentKey) || {
                name: feedback.estudianteNombre || 'Alumno',
                assignments: { total: 0, count: 0 },
                practiceExams: { total: 0, count: 0 }
              };
              aggregate.name = feedback.estudianteNombre || aggregate.name;
              aggregate[evaluationType].total += score;
              aggregate[evaluationType].count += 1;
              studentScores.set(studentKey, aggregate);
            });
          });
          const students = Array.from(studentScores.values());
          const rankingCategories = [
            { key: 'assignments', label: 'Promedio de asignaciones' },
            { key: 'practiceExams', label: 'Promedio de exámenes simulacros' }
          ];
          const populatedCategories = rankingCategories.filter(({ key }) =>
            students.some((student) => student[key].count)
          );
          if (!populatedCategories.length) {
            addText(rankingContent, 'p', 'teacher-sidebar-empty', 'Aún no hay calificaciones para mostrar el ranking.');
            return;
          }
          populatedCategories.forEach(({ key, label }) => {
            addText(rankingContent, 'h4', '', label);
            const rankedStudents = students
              .filter((student) => student[key].count)
              .map((student) => ({ ...student, average: student[key].total / student[key].count }))
              .sort((left, right) => right.average - left.average || left.name.localeCompare(right.name, 'es'));
            const table = document.createElement('table');
            table.className = 'teacher-ranking-table';
            const head = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['#', 'Alumno', 'Prom.'].forEach((header) => addText(headerRow, 'th', '', header));
            head.append(headerRow);
            const body = document.createElement('tbody');
            rankedStudents.forEach((student, index) => {
              const row = document.createElement('tr');
              addText(row, 'td', '', String(index + 1));
              addText(row, 'td', '', student.name);
              addText(row, 'td', '', new Intl.NumberFormat('es-MX', { maximumFractionDigits: 2 }).format(student.average));
              body.append(row);
            });
            table.append(head, body);
            rankingContent.append(table);
          });
        } catch (error) {
          console.error(`No se pudieron cargar las evaluaciones del aula ${aula.id}:`, error);
          evaluationCalendarStatus.textContent = 'No se pudieron consultar las tareas pendientes de evaluar.';
          evaluationCalendarContainer.replaceChildren();
          undatedTasksList.replaceChildren();
          addText(undatedTasksList, 'p', 'teacher-evaluation-status', 'No se pudieron cargar las tareas.');
          addText(rankingContent, 'p', 'teacher-sidebar-empty', 'No se pudo cargar el ranking.');
        }
      }

      function resetAnnouncementEditor() {
        editingAnnouncementId = null;
        titleInput.value = '';
        editor.replaceChildren();
        publishButton.textContent = 'Publicar anuncio';
        editorStatus.textContent = '';
      }

      async function loadAnnouncements() {
        announcementList.replaceChildren();
        try {
          const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'anuncios'));
          const records = snapshot.docs.map((announcementDoc) => ({ id: announcementDoc.id, ...announcementDoc.data() }));
          records.sort((left, right) => (right.creadoEn?.toMillis?.() || 0) - (left.creadoEn?.toMillis?.() || 0));
          if (!records.length) {
            addText(announcementList, 'p', 'tab-placeholder', 'Todavía no hay anuncios en esta aula.');
            return;
          }

          records.forEach((record) => {
            const card = document.createElement('article');
            card.className = 'announcement-card';
            const cardHeader = document.createElement('div');
            cardHeader.className = 'announcement-card-header';
            addText(cardHeader, 'h3', '', record.titulo || 'Anuncio');
            const editButton = document.createElement('button');
            editButton.className = 'announcement-edit';
            editButton.type = 'button';
            editButton.textContent = 'Editar';
            editButton.addEventListener('click', () => {
              editingAnnouncementId = record.id;
              titleInput.value = record.titulo || '';
              editor.innerHTML = sanitizeAnnouncementHtml(record.contenido || '');
              publishButton.textContent = 'Guardar cambios';

            card.append(cardHeader);
            addText(card, 'p', 'announcement-meta', `${record.autor || session.nombre} · ${formatAnnouncementDate(record.creadoEn)}`);
            const body = document.createElement('div');

            body.innerHTML = sanitizeAnnouncementHtml(record.contenido || '');
            card.append(body);
            announcementList.append(card);
          });
        } catch (error) {
          console.error(`No se pudieron cargar los anuncios del aula ${aula.id}:`, error);
          addText(announcementList, 'p', 'attendance-status', 'No se pudieron cargar los anuncios. Revisa los permisos de Firestore.');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const contenido = sanitizeAnnouncementHtml(editor.innerHTML);
        if (!titleInput.value.trim() || !editor.textContent.trim()) {
          editorStatus.textContent = 'Escribe un título y el contenido del anuncio.';
          return;
        }
        publishButton.disabled = true;
        const announcementId = editingAnnouncementId;
        editorStatus.textContent = announcementId ? 'Guardando cambios...' : 'Publicando anuncio...';
        try {
          const announcementData = {
            titulo: titleInput.value.trim(),
            contenido,
            autor: session.nombre || 'Profesor',
            profesorDocId: session.teacherDocId,
            actualizadoEn: serverTimestamp()
          };
          if (announcementId) {
            await updateDoc(doc(db, 'Aulas', aula.id, 'anuncios', announcementId), announcementData);
            resetAnnouncementEditor();
            editorStatus.textContent = 'Anuncio actualizado correctamente.';
          } else {
            const announcementRef = doc(collection(db, 'Aulas', aula.id, 'anuncios'));
            await setDoc(announcementRef, {
              ...announcementData,
              creadoEn: serverTimestamp()
            });
            try {
              await notifyStudents(aula.alumnos, {
                id: announcementRef.id,
                aulaId: aula.id,
                aulaNombre: aula.nombre || 'Aula',
                titulo: announcementData.titulo,
                tipo: 'anuncio',
                tipoTexto: 'Nuevo anuncio'
              });
            } catch (notificationError) {
              console.error(`El anuncio ${announcementRef.id} se guardó, pero no se pudieron guardar todas las notificaciones:`, notificationError);
              resetAnnouncementEditor();
              await loadAnnouncements();
              editorStatus.textContent = 'El anuncio se publicó, pero no se pudieron guardar todas las notificaciones.';
              return;
            }
            resetAnnouncementEditor();
            editorStatus.textContent = 'Anuncio publicado y notificaciones enviadas a los alumnos.';
          }
          await loadAnnouncements();
        } catch (error) {
          console.error(`No se pudo guardar el anuncio en el aula ${aula.id}:`, error);
          editorStatus.textContent = 'No se pudo guardar el anuncio. Revisa los permisos de Firestore.';
        } finally {
          publishButton.disabled = false;
        }
      });

      await Promise.all([loadAnnouncements(), loadUpcomingEvents(), loadDashboardInsights()]);
      return announcements;
    }

    function collectClassSubjects(subjectsSnapshot, pizarrasSnapshot) {
      const subjects = new Map();
      subjectsSnapshot.docs.forEach((subjectDoc) => {
        const data = subjectDoc.data();
        if (data.nombre) subjects.set(subjectDoc.id, { nombre: data.nombre });
      });
      pizarrasSnapshot.docs.forEach((pizarraDoc) => {
        const pizarra = pizarraDoc.data();
        if (pizarra.materiaId && subjects.has(pizarra.materiaId)) return;
        const subjectName = pizarra.materia || pizarra.nombre || 'Otras pizarras';
        const exists = Array.from(subjects.values()).some((subject) =>
          subject.nombre.toLocaleLowerCase() === subjectName.toLocaleLowerCase()
        );
        if (!exists) subjects.set(`legacy:${subjectName.toLocaleLowerCase()}`, { nombre: subjectName });
      });
      return subjects;
    }

    async function renderPizarras(aula) {
      const pizarras = document.createElement('section');
      pizarras.className = 'announcements';
      const subjectForm = document.createElement('form');
      subjectForm.className = 'announcement-form';
      const newSubjectInput = document.createElement('input');
      newSubjectInput.type = 'text';
      newSubjectInput.maxLength = 80;
      newSubjectInput.required = true;
      newSubjectInput.placeholder = 'Nueva materia (ej. Historia)';
      newSubjectInput.setAttribute('aria-label', 'Nombre de la nueva materia');
      const createSubjectButton = addText(subjectForm, 'button', 'announcement-submit', 'Crear materia');
      createSubjectButton.type = 'submit';
      const subjectStatus = addText(subjectForm, 'p', 'attendance-status', '');
      subjectStatus.setAttribute('role', 'status');
      subjectForm.prepend(newSubjectInput);

      const form = document.createElement('form');
      form.className = 'announcement-form';
      const subjectSelect = document.createElement('select');
      subjectSelect.required = true;
      subjectSelect.setAttribute('aria-label', 'Materia de la pizarra');
      subjectSelect.add(new Option('Selecciona una materia', ''));
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.maxLength = 120;
      nameInput.required = true;
      nameInput.placeholder = 'Tema (ej. Unidad 1)';
      nameInput.setAttribute('aria-label', 'Tema de la pizarra');
      const urlInput = document.createElement('input');
      urlInput.type = 'url';
      urlInput.required = true;
      urlInput.placeholder = 'https://...';
      urlInput.setAttribute('aria-label', 'Enlace de la pizarra');
      const publishField = document.createElement('label');
      publishField.className = 'task-check-field';
      const publishInput = document.createElement('input');
      publishInput.type = 'checkbox';
      publishInput.checked = true;
      const publishLabel = document.createElement('span');
      publishLabel.textContent = 'Publicar para los alumnos';
      publishField.append(publishInput, publishLabel);
      const saveButton = document.createElement('button');
      saveButton.className = 'announcement-submit';
      saveButton.type = 'submit';
      saveButton.textContent = 'Guardar pizarra';
      saveButton.disabled = true;
      const formStatus = addText(form, 'p', 'attendance-status', '');
      formStatus.setAttribute('role', 'status');
      form.prepend(subjectSelect, nameInput, urlInput, publishField, saveButton);
      const pizarraList = document.createElement('div');
      pizarraList.className = 'announcement-list';
      pizarras.append(subjectForm, form, pizarraList);
      let editingPizarraId = null;
      const subjects = new Map();
      const boardsBySubject = new Map();
      let editingPizarraWasPublished = false;

      function getSubjectDocumentId(subjectName) {
        return `materia-${encodeURIComponent(subjectName.trim().toLocaleLowerCase())}`;
      }

      function renderSubjectOptions(selectedId = '') {
        subjectSelect.replaceChildren(new Option('Selecciona una materia', ''));
        Array.from(subjects.entries())
          .sort((left, right) => left[1].nombre.localeCompare(right[1].nombre, 'es'))
          .forEach(([id, subject]) => subjectSelect.add(new Option(subject.nombre, id)));
        subjectSelect.value = selectedId;
        saveButton.disabled = !subjectSelect.value;
      }

      function resetForm() {
        editingPizarraId = null;
        editingPizarraWasPublished = false;
        nameInput.value = '';
        urlInput.value = '';
        publishInput.checked = true;
        renderSubjectOptions(subjectSelect.value);
      }

      function getBoardOrder(board) {
        return Number.isFinite(board.orden) ? board.orden : -(board.creadoEn?.toMillis?.() || 0);
      }

      async function moveBoard(subjectId, boardId, direction, moveButton) {
        const subjectBoards = boardsBySubject.get(subjectId) || [];
        const currentIndex = subjectBoards.findIndex((board) => board.id === boardId);
        const targetIndex = currentIndex + direction;
        if (currentIndex < 0 || targetIndex < 0 || targetIndex >= subjectBoards.length) return;

        moveButton.disabled = true;
        formStatus.textContent = 'Actualizando el orden de las pizarras...';
        const reorderedBoards = [...subjectBoards];
        [reorderedBoards[currentIndex], reorderedBoards[targetIndex]] = [reorderedBoards[targetIndex], reorderedBoards[currentIndex]];
        try {
          for (let offset = 0; offset < reorderedBoards.length; offset += 450) {
            const batch = writeBatch(db);
            reorderedBoards.slice(offset, offset + 450).forEach((board, index) => {
              batch.update(doc(db, 'Aulas', aula.id, 'pizarras', board.id), {
                orden: offset + index,
                actualizadoEn: serverTimestamp()
              });
            });
            await batch.commit();
          }
          formStatus.textContent = 'Orden actualizado.';
          await loadPizarras();
        } catch (error) {
          console.error(`No se pudo reordenar las pizarras del aula ${aula.id}:`, error);
          formStatus.textContent = 'No se pudo guardar el orden. Revisa los permisos de Firestore.';
          moveButton.disabled = false;
        }
      }

      async function deleteSubject(subjectId, subjectName, deleteButton) {
        const legacySubject = subjectId.startsWith('legacy:');
        deleteButton.disabled = true;
        subjectStatus.textContent = `Preparando la eliminación de ${subjectName}...`;
        try {
          const boardsSnapshot = await getDocs(collection(db, 'Aulas', aula.id, 'pizarras'));
          const normalizedName = subjectName.toLocaleLowerCase();
          const boardReferences = boardsSnapshot.docs
            .filter((boardDoc) => {
              const board = boardDoc.data();
              return board.materiaId === subjectId
                || subjectId.startsWith('legacy:')
                  && (!board.materiaId || !subjects.has(board.materiaId))
                  && (board.materia || board.nombre || '').toLocaleLowerCase() === normalizedName;
            })
            .map((boardDoc) => boardDoc.ref);
          const deleteCount = boardReferences.length + (legacySubject ? 0 : 1);
          if (!confirm(`¿Eliminar la materia "${subjectName}" y sus ${boardReferences.length} pizarra(s)? Se eliminarán ${deleteCount} registro(s) y no se puede deshacer.`)) {
            deleteButton.disabled = false;
            subjectStatus.textContent = '';
            return;
          }
          subjectStatus.textContent = `Eliminando ${subjectName} y sus pizarras...`;
          const references = [...boardReferences];
          if (!legacySubject) references.push(doc(db, 'Aulas', aula.id, 'materias', subjectId));
          for (let offset = 0; offset < references.length; offset += 500) {
            const batch = writeBatch(db);
            references.slice(offset, offset + 500).forEach((reference) => batch.delete(reference));
            await batch.commit();
          }
          subjects.delete(subjectId);
          renderSubjectOptions('');
          resetForm();
          subjectStatus.textContent = `Materia ${subjectName} eliminada.`;
          await loadPizarras();
        } catch (error) {
          console.error(`No se pudo eliminar la materia ${subjectName} del aula ${aula.id}:`, error);
          subjectStatus.textContent = 'No se pudo eliminar la materia y sus pizarras. Revisa los permisos de Firestore.';
          deleteButton.disabled = false;
        }
      }

      async function deleteBoard(record, deleteButton) {
        if (!confirm(`¿Eliminar la pizarra "${record.nombre || 'Tema'}"? Esta acción no se puede deshacer.`)) return;
        deleteButton.disabled = true;
        formStatus.textContent = 'Eliminando pizarra...';
        try {
          await deleteDoc(doc(db, 'Aulas', aula.id, 'pizarras', record.id));
          formStatus.textContent = 'Pizarra eliminada.';
          await loadPizarras();
        } catch (error) {
          console.error(`No se pudo eliminar la pizarra ${record.id} del aula ${aula.id}:`, error);
          formStatus.textContent = 'No se pudo eliminar la pizarra. Revisa los permisos de Firestore.';
          deleteButton.disabled = false;
        }
      }

      subjectForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const subjectName = newSubjectInput.value.trim();
        if (!subjectName) return;
        const existingSubject = Array.from(subjects.entries()).find(([, subject]) =>
          subject.nombre.toLocaleLowerCase() === subjectName.toLocaleLowerCase()
        );
        if (existingSubject) {
          renderSubjectOptions(existingSubject[0]);
          subjectStatus.textContent = 'Esa materia ya existe. Ya puedes agregarle una pizarra.';
          subjectForm.reset();
          return;
        }

        createSubjectButton.disabled = true;
        subjectStatus.textContent = 'Creando materia...';
        try {
          const subjectId = getSubjectDocumentId(subjectName);
          await setDoc(doc(db, 'Aulas', aula.id, 'materias', subjectId), {
            nombre: subjectName,
            profesorDocId: session.teacherDocId,
            creadoEn: serverTimestamp()
          }, { merge: true });
          subjects.set(subjectId, { nombre: subjectName });
          renderSubjectOptions(subjectId);
          subjectForm.reset();
          subjectStatus.textContent = `Materia ${subjectName} creada. Ahora agrega sus pizarras.`;
        } catch (error) {
          console.error(`No se pudo crear la materia del aula ${aula.id}:`, error);
          subjectStatus.textContent = 'No se pudo crear la materia. Revisa los permisos de Firestore.';
        } finally {
          createSubjectButton.disabled = false;
        }
      });

      subjectSelect.addEventListener('change', () => {
        saveButton.disabled = !subjectSelect.value;
        if (!editingPizarraId) formStatus.textContent = '';
      });

      async function loadPizarras() {
        pizarraList.replaceChildren();
        const [snapshot, subjectsSnapshot] = await Promise.all([
          getDocs(collection(db, 'Aulas', aula.id, 'pizarras')),
          getDocs(collection(db, 'Aulas', aula.id, 'materias'))
        ]);
        subjects.clear();
        collectClassSubjects(subjectsSnapshot, snapshot).forEach((subject, id) => subjects.set(id, subject));
        const records = snapshot.docs.map((pizarraDoc) => ({ id: pizarraDoc.id, ...pizarraDoc.data() }));
        renderSubjectOptions(subjectSelect.value);
        boardsBySubject.clear();
        subjects.forEach((_, subjectId) => boardsBySubject.set(subjectId, []));
        records.forEach((record) => {
          let subjectId = record.materiaId;
          if (!subjectId || !subjects.has(subjectId)) {
            const legacyName = (record.materia || record.nombre || '').toLocaleLowerCase();
            subjectId = Array.from(subjects.entries()).find(([, subject]) =>
              subject.nombre.toLocaleLowerCase() === legacyName
            )?.[0];
          }
          if (!subjectId) return;
          if (!boardsBySubject.has(subjectId)) boardsBySubject.set(subjectId, []);
          boardsBySubject.get(subjectId).push(record);
        });
        boardsBySubject.forEach((subjectBoards) => subjectBoards.sort((left, right) => getBoardOrder(left) - getBoardOrder(right)));

        if (!subjects.size) addText(pizarraList, 'p', 'tab-placeholder', 'Crea una materia para empezar a agregar pizarras.');
        Array.from(subjects.entries())
          .sort((left, right) => left[1].nombre.localeCompare(right[1].nombre, 'es'))
          .forEach(([subjectId, subject]) => {
            const group = document.createElement('section');
            group.className = 'pizarra-group';
            const groupHeader = document.createElement('div');
            groupHeader.className = 'pizarra-group-header';
            addText(groupHeader, 'h3', '', subject.nombre);
            const deleteSubjectButton = addText(groupHeader, 'button', 'pizarra-delete', 'Eliminar materia');
            deleteSubjectButton.type = 'button';
            deleteSubjectButton.setAttribute('aria-label', `Eliminar materia ${subject.nombre} y sus pizarras`);
            deleteSubjectButton.addEventListener('click', () => deleteSubject(subjectId, subject.nombre, deleteSubjectButton));
            group.append(groupHeader);

            const subjectBoards = boardsBySubject.get(subjectId) || [];
            if (!subjectBoards.length) addText(group, 'p', 'pizarra-group-empty', 'Todavía no hay pizarras en esta materia.');
            subjectBoards.forEach((record) => {
              const entry = document.createElement('div');
              entry.className = 'pizarra-entry';
              let link;
              try {
                const linkUrl = new URL(record.enlace);
                if (!['http:', 'https:'].includes(linkUrl.protocol)) throw new Error('Protocolo no permitido.');
                link = addText(entry, 'a', '', record.nombre || 'Tema');
                link.href = linkUrl.href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
              } catch {
                addText(entry, 'strong', '', `${record.nombre || 'Tema'} · Enlace no disponible`);
              }
              const actions = document.createElement('div');
              actions.className = 'pizarra-actions';
              const boardIndex = subjectBoards.indexOf(record);
              const moveUpButton = addText(actions, 'button', 'pizarra-order-button', 'Subir');
              moveUpButton.type = 'button';
              moveUpButton.disabled = boardIndex === 0;
              moveUpButton.setAttribute('aria-label', `Subir ${record.nombre || 'pizarra'}`);
              moveUpButton.addEventListener('click', () => moveBoard(subjectId, record.id, -1, moveUpButton));
              const moveDownButton = addText(actions, 'button', 'pizarra-order-button', 'Bajar');
              moveDownButton.type = 'button';
              moveDownButton.disabled = boardIndex === subjectBoards.length - 1;
              moveDownButton.setAttribute('aria-label', `Bajar ${record.nombre || 'pizarra'}`);
              moveDownButton.addEventListener('click', () => moveBoard(subjectId, record.id, 1, moveDownButton));
              const editButton = addText(actions, 'button', 'announcement-edit', 'Editar');
              editButton.type = 'button';
              editButton.addEventListener('click', () => {
                editingPizarraId = record.id;
                editingPizarraWasPublished = record.publicado === true;
                const subjectEntry = record.materiaId && subjects.has(record.materiaId)
                  ? record.materiaId
                  : subjectId;
                renderSubjectOptions(subjectEntry);
                nameInput.value = record.nombre || '';
                urlInput.value = record.enlace || '';
                publishInput.checked = record.publicado === true;
                formStatus.textContent = 'Edita los datos y guarda para actualizar la pizarra.';
                nameInput.focus();
                form.scrollIntoView({ behavior: 'smooth', block: 'center' });
              });
              const deleteBoardButton = addText(actions, 'button', 'pizarra-delete', 'Eliminar');
              deleteBoardButton.type = 'button';
              deleteBoardButton.setAttribute('aria-label', `Eliminar pizarra ${record.nombre || 'Tema'}`);
              deleteBoardButton.addEventListener('click', () => deleteBoard(record, deleteBoardButton));
              actions.prepend(editButton);
              entry.append(actions);
              group.append(entry);
            });
            pizarraList.append(group);
          });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const selectedSubject = subjects.get(subjectSelect.value);
        if (!selectedSubject) {
          formStatus.textContent = 'Crea o selecciona una materia para agregar la pizarra.';
          subjectSelect.focus();
          return;
        }
        if (!nameInput.value.trim()) {
          formStatus.textContent = 'Escribe el tema de la pizarra.';
          nameInput.focus();
          return;
        }
        let parsedUrl;
        try {
          parsedUrl = new URL(urlInput.value.trim());
        } catch {
          formStatus.textContent = 'Ingresa un enlace válido.';
          return;
        }
        if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
          formStatus.textContent = 'El enlace debe comenzar con http:// o https://.';
          return;
        }

        saveButton.disabled = true;
        formStatus.textContent = 'Guardando pizarra...';
        try {
          let subjectId = subjectSelect.value;
          if (subjectId.startsWith('legacy:')) {
            subjectId = getSubjectDocumentId(selectedSubject.nombre);
            await setDoc(doc(db, 'Aulas', aula.id, 'materias', subjectId), {
              nombre: selectedSubject.nombre,
              profesorDocId: session.teacherDocId,
              creadoEn: serverTimestamp()
            }, { merge: true });
            subjects.delete(subjectSelect.value);
            subjects.set(subjectId, { nombre: selectedSubject.nombre });
            renderSubjectOptions(subjectId);
          }
          const pizarraData = {
            materiaId: subjectId,
            nombre: nameInput.value.trim(),
            enlace: parsedUrl.href,
            publicado: publishInput.checked,
            profesorDocId: session.teacherDocId,
            profesorNombre: session.nombre || 'Profesor',
            ...(editingPizarraId ? {} : {
              orden: Math.max(-1, ...(boardsBySubject.get(subjectId) || []).map(getBoardOrder)) + 1
            }),
            actualizadoEn: serverTimestamp()
          };
          let pizarraRef;
          if (editingPizarraId) {
            pizarraRef = doc(db, 'Aulas', aula.id, 'pizarras', editingPizarraId);
            await updateDoc(pizarraRef, {
              ...pizarraData,
              materia: deleteField()
            });
          } else {
            pizarraRef = doc(collection(db, 'Aulas', aula.id, 'pizarras'));
            await setDoc(pizarraRef, {
              ...pizarraData,
              creadoEn: serverTimestamp()
            });
          }
          const notifyForPublishedBoard = publishInput.checked;
          const notificationType = editingPizarraWasPublished ? 'Pizarra actualizada' : 'Pizarra disponible';
          const boardName = pizarraData.nombre;
          const subjectName = selectedSubject.nombre;
          const isEditing = Boolean(editingPizarraId);
          resetForm();
          await loadPizarras();
          if (notifyForPublishedBoard) {
            try {
              await notifyStudents(aula.alumnos, {
                id: pizarraRef.id,
                notificationDocId: doc(collection(db, 'Aulas', aula.id, 'pizarras')).id,
                aulaId: aula.id,
                aulaNombre: aula.nombre || 'Aula',
                titulo: boardName,
                materia: subjectName,
                tipo: 'pizarra',
                tipoTexto: notificationType
              });
              formStatus.textContent = `${isEditing ? 'Pizarra actualizada' : 'Pizarra publicada'} y notificaciones enviadas a los alumnos.`;
            } catch (notificationError) {
              console.error(`La pizarra ${pizarraRef.id} se guardó, pero no se pudieron guardar todas las notificaciones:`, notificationError);
              formStatus.textContent = 'La pizarra se guardó, pero no se pudieron enviar las notificaciones a los alumnos.';
            }
          } else {
            formStatus.textContent = 'Pizarra guardada correctamente.';
          }
        } catch (error) {
          console.error(`No se pudo guardar la pizarra del aula ${aula.id}:`, error);
          const reason = error.code || error.message || 'Error desconocido';
          formStatus.textContent = `No se pudo guardar la pizarra: ${reason}`;
        } finally {
          saveButton.disabled = false;
        }
      });

      try {
        await loadPizarras();
      } catch (error) {
        console.error(`No se pudieron cargar las pizarras del aula ${aula.id}:`, error);
        addText(pizarraList, 'p', 'attendance-status', 'No se pudieron cargar las pizarras. Revisa los permisos de Firestore.');
      }
      return pizarras;
    }

    function attendanceStatus(studentRecord) {
      if (['asistencia', 'falta', 'retardo', 'justificado'].includes(studentRecord.estado)) return studentRecord.estado;
      return studentRecord.presente === true ? 'asistencia' : 'falta';
    }

    function formatAttendanceDate(date) {
      return new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' })
        .format(new Date(`${date}T12:00:00`));
    }

    async function renderPublications(aula) {
      const publications = document.createElement('section');
      publications.className = 'announcements';
      const form = document.createElement('form');
      form.className = 'publication-form';
      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.maxLength = 120;
      titleInput.required = true;
      titleInput.placeholder = 'Título de la publicación';
      titleInput.setAttribute('aria-label', 'Título de la publicación');

      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.required = true;
      dateInput.value = getLocalDateString();

      const locationInput = document.createElement('input');
      locationInput.type = 'text';
      locationInput.maxLength = 120;
      locationInput.placeholder = 'Lugar o modalidad (opcional)';
      locationInput.setAttribute('aria-label', 'Lugar o modalidad de la publicación');

      const descriptionToolbar = document.createElement('div');
      descriptionToolbar.className = 'editor-toolbar';
      descriptionToolbar.setAttribute('aria-label', 'Formato de la descripción');
      const descriptionCommands = [
        { command: 'bold', label: 'B', title: 'Negrita', style: 'font-weight:700' },
        { command: 'italic', label: 'I', title: 'Cursiva', style: 'font-style:italic' },
        { command: 'underline', label: 'U', title: 'Subrayado', style: 'text-decoration:underline' },
        { command: 'formatBlock', value: 'H2', label: 'Título', title: 'Título' },
        { command: 'formatBlock', value: 'H3', label: 'Subtítulo', title: 'Subtítulo' },
        { command: 'insertUnorderedList', label: '• Lista', title: 'Lista con viñetas' },
        { command: 'insertOrderedList', label: '1. Lista', title: 'Lista numerada' }
      ];
      const descriptionEditor = document.createElement('div');
      descriptionEditor.className = 'announcement-editor';
      descriptionEditor.contentEditable = 'true';
      descriptionEditor.setAttribute('role', 'textbox');
      descriptionEditor.setAttribute('aria-label', 'Descripción de la publicación');
      descriptionEditor.setAttribute('aria-multiline', 'true');
      descriptionEditor.setAttribute('aria-required', 'true');
      descriptionEditor.dataset.placeholder = 'Escribe la descripción completa del evento o publicación...';
      descriptionCommands.forEach(({ command, value, label, title, style }) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.title = title;
        button.setAttribute('aria-label', title);
        if (style) button.style.cssText = style;
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          descriptionEditor.focus();
          document.execCommand(command, false, value || null);
        });
        descriptionToolbar.append(button);
      });
      descriptionToolbar.append(createEditorColorControl(descriptionEditor));

      const formStatus = document.createElement('p');
      formStatus.className = 'attendance-status';
      formStatus.setAttribute('role', 'status');
      const publishButton = document.createElement('button');
      publishButton.type = 'submit';
      publishButton.className = 'announcement-submit';
      publishButton.textContent = 'Guardar publicación';

      form.append(titleInput, dateInput, locationInput, descriptionToolbar, descriptionEditor, publishButton, formStatus);
      const publicationList = document.createElement('div');
      publicationList.className = 'announcement-list';
      publications.append(form, publicationList);
      let editingPublicationId = null;

      function resetPublicationForm() {
        editingPublicationId = null;
        titleInput.value = '';
        dateInput.value = getLocalDateString();
        locationInput.value = '';
        descriptionEditor.replaceChildren();
        publishButton.textContent = 'Guardar publicación';
        formStatus.textContent = '';
      }

      async function loadPublications() {
        publicationList.replaceChildren();
        try {
          const snapshot = await getDocs(collection(db, 'Aulas', aula.id, 'publicaciones'));
          const records = snapshot.docs
            .map((publicationDoc) => ({ id: publicationDoc.id, ...publicationDoc.data() }))
            .sort((left, right) => {
              const leftDate = left.fecha ? new Date(`${left.fecha}T12:00:00`).getTime() : Number.MAX_SAFE_INTEGER;
              const rightDate = right.fecha ? new Date(`${right.fecha}T12:00:00`).getTime() : Number.MAX_SAFE_INTEGER;
              return leftDate - rightDate;
            });

          if (!records.length) {
            addText(publicationList, 'p', 'tab-placeholder', 'Todavía no hay publicaciones para esta aula.');
            return;
          }

          records.forEach((record) => {
            const card = document.createElement('article');
            card.className = 'announcement-card';
            const header = document.createElement('div');
            header.className = 'announcement-card-header';
            addText(header, 'h3', '', record.titulo || 'Publicación');

            const actions = document.createElement('div');
            actions.className = 'announcement-card-actions';
            const editButton = document.createElement('button');
            editButton.type = 'button';
            editButton.className = 'announcement-edit';
            editButton.textContent = 'Editar';
            editButton.addEventListener('click', () => {
              editingPublicationId = record.id;
              titleInput.value = record.titulo || '';
              dateInput.value = record.fecha || getLocalDateString();
              locationInput.value = record.lugar || '';
              descriptionEditor.innerHTML = sanitizeAnnouncementHtml(record.descripcion || '');
              publishButton.textContent = 'Guardar cambios';
              formStatus.textContent = 'Editando publicación. Guarda los cambios para actualizarla.';
              titleInput.focus();
              form.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'pizarra-delete';
            deleteButton.textContent = 'Eliminar';
            deleteButton.addEventListener('click', async () => {
              if (!confirm(`¿Eliminar la publicación "${record.titulo || 'sin título'}"?`)) return;
              deleteButton.disabled = true;
              try {
                await deleteDoc(doc(db, 'Aulas', aula.id, 'publicaciones', record.id));
                if (editingPublicationId === record.id) resetPublicationForm();
