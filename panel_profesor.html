<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aulas y alumnos asignados al profesor.">
  <title>Panel del profesor | Docére</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --page: #f4f7fb;
      --surface: #fff;
      --ink: #142033;
      --muted: #64748b;
      --line: #dce4ee;
      --blue: #155eef;
      --green: #087f5b;
      --red: #b42318;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px max(20px, calc((100vw - 1160px) / 2)); background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .brand-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 7px; background: #eaf1ff; color: var(--blue); }
    .identity { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 14px; }
    .logout { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); cursor: pointer; }
    .panel-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 63px); }
    .class-sidebar { padding: 20px 10px; background: #f7f9fc; border-right: 1px solid var(--line); }
    .sidebar-heading { display: flex; align-items: center; gap: 9px; padding: 0 10px 14px; color: #334155; font-size: 14px; font-weight: 750; }
    .class-list { display: grid; gap: 4px; }
    .class-nav-button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .class-nav-button:hover { background: #edf3fb; }
    .class-nav-button[aria-current="true"] { background: #d9efff; color: #075985; }
    .class-initial { flex: 0 0 28px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #e7edf5; color: #475569; font-size: 12px; font-weight: 750; }
    .class-nav-button[aria-current="true"] .class-initial { background: #fff; color: #075985; }
    .class-nav-text { min-width: 0; }
    .class-nav-name, .class-nav-course { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .class-nav-name { font-size: 13px; font-weight: 650; }
    .class-nav-course { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .class-workspace { min-width: 0; padding: 22px clamp(16px, 3vw, 42px) 40px; }
    .class-workspace[hidden] { display: none; }
    .class-heading { margin-bottom: 18px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .class-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    .status { min-height: 20px; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .classroom { overflow: hidden; border: 1px solid #d6dce3; border-radius: 10px; background: var(--surface); box-shadow: 0 2px 6px rgba(20, 32, 51, .05); }
    .classroom-header { position: relative; display: flex; min-height: 205px; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 24px; color: #fff; background: linear-gradient(125deg, #34464e, #526873); }
    .classroom-header::after { position: absolute; right: -24px; bottom: -46px; width: 148px; height: 110px; border: 18px solid rgba(255,255,255,.09); border-radius: 50%; content: ""; transform: rotate(-25deg); }
    .classroom-banner-1 { background: linear-gradient(125deg, #155e75, #1592a8); }
    .classroom-banner-2 { background: linear-gradient(125deg, #3f4f72, #667ca5); }
    .classroom-banner-3 { background: linear-gradient(125deg, #6a4a37, #a16d4c); }
    .classroom-header h2 { position: relative; z-index: 1; margin: 0 0 5px; font-size: clamp(22px, 3vw, 30px); line-height: 1.25; overflow-wrap: anywhere; }
    .classroom-header p { position: relative; z-index: 1; margin: 0; color: rgba(255,255,255,.88); font-size: 13px; font-weight: 600; }
    .student-count { position: relative; z-index: 1; flex: 0 0 auto; padding: 5px 8px; border-radius: 20px; background: rgba(255,255,255,.18); color: #fff; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .class-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
    .class-tab { flex: 0 0 auto; min-height: 48px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #475569; font-size: 12px; font-weight: 650; cursor: pointer; }
    .class-tab:hover { background: #f8fafc; }
    .class-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--ink); }
    .tab-content { min-height: 330px; padding: 18px; }
    .tab-content[hidden] { display: none; }
    .announcements { display: grid; gap: 14px; }
    .announcement-form { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .announcement-form input { min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; font: inherit; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 5px; }
    .editor-toolbar button { min-width: 36px; min-height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
    .editor-toolbar button:hover { background: #edf3fb; }
    .announcement-editor { min-height: 140px; padding: 11px; border: 1px solid var(--line); border-radius: 5px; background: #fff; line-height: 1.5; }
    .announcement-editor:focus { outline: 2px solid #a9c4ff; border-color: var(--blue); }
    .announcement-submit { justify-self: start; min-height: 38px; padding: 0 14px; border: 0; border-radius: 5px; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
    .announcement-submit:disabled { opacity: .6; cursor: wait; }
    .announcement-list { display: grid; gap: 10px; }
    .announcement-card { padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .announcement-card h3 { margin: 0 0 4px; font-size: 16px; }
    .announcement-meta { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .announcement-body { overflow-wrap: anywhere; line-height: 1.55; }
    .announcement-body > :first-child { margin-top: 0; }
    .announcement-body > :last-child { margin-bottom: 0; }
    .attendance-summary { display: flex; flex-wrap: wrap; gap: 8px; }
    .attendance-stat { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; }
    .attendance-roster { display: grid; gap: 8px; }
    .attendance-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); align-items: center; gap: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; }
    .attendance-row-name { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .attendance-row-email { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .attendance-row select { min-height: 36px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .attendance-history-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 7px; }
    .attendance-history { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
    .attendance-history th, .attendance-history td { padding: 9px 11px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: left; }
    .attendance-history th { position: sticky; top: 0; background: #f1f5f9; font-weight: 700; }
    .attendance-history th:first-child { position: sticky; left: 0; z-index: 1; }
    .attendance-history td:first-child { position: sticky; left: 0; background: #fff; font-weight: 650; }
    .attendance-history tr:last-child td { border-bottom: 0; }
    .attendance-history .state-attended { color: var(--green); font-weight: 650; }
    .attendance-history .state-absent { color: var(--red); font-weight: 650; }
    .attendance-history .state-late { color: #a15c00; font-weight: 650; }
    .tab-placeholder { padding: 26px 18px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
    .students { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; padding: 0; }
    .student { min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; }
    .student-name { display: block; margin-bottom: 3px; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .student-email { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .empty { grid-column: 1 / -1; padding: 32px 18px; border: 1px dashed var(--line); border-radius: 8px; background: rgba(255,255,255,.6); color: var(--muted); text-align: center; }
    .attendance { display: grid; gap: 12px; }
    .attendance-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
    .attendance-controls label { display: grid; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .attendance-controls input { min-height: 38px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); }
    .attendance-list { display: grid; gap: 7px; }
    .attendance-student { display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    .attendance-student input { width: 17px; height: 17px; margin: 0; accent-color: var(--blue); }
    .attendance-save { min-height: 38px; padding: 0 13px; border: 0; border-radius: 5px; background: var(--blue); color: white; font-weight: 650; cursor: pointer; }
    .attendance-save:disabled { opacity: .6; cursor: wait; }
    .attendance-status { min-height: 18px; margin: 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 620px) {
      .topbar { padding: 11px 14px; }
      .teacher-email { display: none; }
      .panel-layout { grid-template-columns: 1fr; }
      .class-sidebar { padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .class-list { display: flex; overflow-x: auto; }
      .class-nav-button { flex: 0 0 210px; }
      .class-workspace { padding: 18px 14px 28px; }
      .classroom-header { min-height: 150px; padding: 18px; }
      .tab-content { padding: 14px; }
      .students { grid-template-columns: 1fr; }
      .attendance-row { grid-template-columns: 1fr; gap: 7px; }
      .logout { padding: 0 9px; }
      .logout span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon"><i data-lucide="graduation-cap"></i></span><span>Portal Docére</span></div>
    <div class="identity">
      <span id="teacherName">Profesor</span>
      <span class="teacher-email" id="teacherEmail"></span>
      <button class="logout" id="logoutButton" type="button"><i data-lucide="log-out"></i><span>Cerrar sesión</span></button>
    </div>
  </header>

  <main>
    <div class="panel-layout">
      <aside class="class-sidebar" aria-label="Navegación de clases">
        <div class="sidebar-heading"><i data-lucide="users"></i><span>Clases impartidas</span></div>
        <p class="status" id="status" role="status">Cargando tus aulas...</p>
        <nav class="class-list" id="classList" aria-label="Aulas asignadas"></nav>
      </aside>
      <section class="class-workspace" id="classWorkspace" aria-label="Contenido del aula" hidden></section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, query, where, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC64X_uSvL_Sn1WQLw7ZV9QDme2aOfV5ag",
      authDomain: "docere-931ec.firebaseapp.com",
      projectId: "docere-931ec",
      storageBucket: "docere-931ec.firebasestorage.app",
      messagingSenderId: "1005663843239",
      appId: "1:1005663843239:web:d8f6c7524a5d10bf797c82",
      measurementId: "G-B6TDT4VE7S"
    };

    const sessionKey = 'teacherSession';
    const activityKey = 'teacherSessionLastActivity';
    const session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
    const status = document.getElementById('status');
    const classList = document.getElementById('classList');
    const classWorkspace = document.getElementById('classWorkspace');
    const db = getFirestore(initializeApp(firebaseConfig));
    let idleTimer;

    function endSession() {
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(activityKey);
      window.location.replace('login.html');
    }

    function recordActivity() {
      const lastActivity = Number(localStorage.getItem(activityKey));
      if (!Number.isFinite(lastActivity) || Date.now() - lastActivity >= 60 * 60 * 1000) {
        endSession();
        return;
      }
      localStorage.setItem(activityKey, String(Date.now()));
      clearTimeout(idleTimer);
      idleTimer = setTimeout(endSession, 60 * 60 * 1000);
    }

    ['click', 'keydown', 'pointerdown', 'touchstart'].forEach((eventName) => {
      document.addEventListener(eventName, recordActivity, { passive: true });
    });
    document.getElementById('logoutButton').addEventListener('click', endSession);

    function addText(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      element.className = className;
      element.textContent = text;
      parent.append(element);
      return element;
    }

    function getLocalDateString() {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    async function loadAttendance(aula, dateInput, attendanceList, statusText, saveButton) {
      const date = dateInput.value;
      saveButton.disabled = true;
      dateInput.disabled = true;
      statusText.textContent = 'Cargando asistencia...';
      try {
        const snapshot = await getDoc(doc(db, 'Aulas', aula.id, 'asistencias', date));
        const saved = snapshot.exists() && Array.isArray(snapshot.data().alumnos) ? snapshot.data().alumnos : [];
        const attendanceByStudent = new Map(saved.map((student) => [`${student.coleccion}/${student.id}`, student.presente === true]));
        attendanceList.replaceChildren();
        aula.alumnos.forEach((student) => {
          const label = document.createElement('label');
          label.className = 'attendance-student';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = `${student.coleccion}/${student.id}`;
          checkbox.checked = attendanceByStudent.get(checkbox.value) === true;
          label.append(checkbox, document.createTextNode(student.nombre || 'Alumno'));
          attendanceList.append(label);
        });
        statusText.textContent = snapshot.exists()
          ? `Asistencia del ${date} cargada.`
          : `Sin asistencia guardada para el ${date}. Marca a los presentes.`;
      } catch (error) {
        console.error(`No se pudo cargar la asistencia del aula ${aula.id}:`, error);
        attendanceList.replaceChildren();
        statusText.textContent = 'No se pudo cargar la asistencia. Revisa los permisos de Firestore.';
      } finally {
        dateInput.disabled = false;
        saveButton.disabled = false;
      }
    }

    function renderAttendance(aula) {
      const attendance = document.createElement('form');
      attendance.className = 'attendance';
      const controls = document.createElement('div');
      controls.className = 'attendance-controls';
      const dateLabel = document.createElement('label');
      dateLabel.textContent = 'Fecha de asistencia';
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = getLocalDateString();
      dateLabel.append(dateInput);
      const saveButton = document.createElement('button');
      saveButton.className = 'attendance-save';
      saveButton.type = 'submit';
      saveButton.textContent = 'Guardar asistencia';
      controls.append(dateLabel, saveButton);
      const attendanceList = document.createElement('div');
      attendanceList.className = 'attendance-list';
      const attendanceStatus = document.createElement('p');
      attendanceStatus.className = 'attendance-status';
      attendanceStatus.setAttribute('role', 'status');
      attendance.append(controls, attendanceList, attendanceStatus);

      dateInput.addEventListener('change', () => loadAttendance(aula, dateInput, attendanceList, attendanceStatus, saveButton));
      attendance.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!dateInput.value) {
          attendanceStatus.textContent = 'Selecciona una fecha para guardar la asistencia.';
          return;
        }
        saveButton.disabled = true;
        attendanceStatus.textContent = 'Guardando asistencia...';
        try {
          const alumnos = Array.from(attendanceList.querySelectorAll('input[type="checkbox"]'), (checkbox) => {
            const [coleccion, id] = checkbox.value.split('/');
            const student = aula.alumnos.find((item) => item.id === id && item.coleccion === coleccion);
            return { id, coleccion, nombre: student?.nombre || 'Alumno', presente: checkbox.checked };
          });
          await setDoc(doc(db, 'Aulas', aula.id, 'asistencias', dateInput.value), {
            fecha: dateInput.value,
            profesorDocId: session.teacherDocId,
            alumnos,
            actualizadoEn: serverTimestamp()
          });
          attendanceStatus.textContent = `Asistencia del ${dateInput.value} guardada.`;
        } catch (error) {
          console.error(`No se pudo guardar la asistencia del aula ${aula.id}:`, error);
          attendanceStatus.textContent = 'No se pudo guardar la asistencia. Revisa los permisos de Firestore.';
        } finally {
          saveButton.disabled = false;
        }
      });
      loadAttendance(aula, dateInput, attendanceList, attendanceStatus, saveButton);
      return attendance;
    }

    function showClassroom(aula, index) {
      classWorkspace.replaceChildren();
      classWorkspace.hidden = false;

      const heading = document.createElement('header');
      heading.className = 'class-heading';
      addText(heading, 'h1', '', aula.nombre || 'Aula sin nombre');
      addText(heading, 'p', '', aula.curso || 'Curso sin especificar');
      classWorkspace.append(heading);

      const classroom = document.createElement('article');
      classroom.className = 'classroom';
      const banner = document.createElement('header');
      banner.className = `classroom-header classroom-banner-${index % 4}`;
      const bannerTitle = document.createElement('div');
      addText(bannerTitle, 'h2', '', aula.nombre || 'Aula sin nombre');
      addText(bannerTitle, 'p', '', aula.curso || 'Curso sin especificar');
      addText(banner, 'span', 'student-count', `${aula.alumnos.length} alumno${aula.alumnos.length === 1 ? '' : 's'}`);
      banner.prepend(bannerTitle);
      classroom.append(banner);

      const tabs = document.createElement('div');
      tabs.className = 'class-tabs';
      tabs.setAttribute('role', 'tablist');
      tabs.setAttribute('aria-label', 'Secciones del aula');
      const content = document.createElement('section');
      content.className = 'tab-content';
      content.setAttribute('role', 'tabpanel');
      const tabOptions = [
        { id: 'padlet', label: 'Padlet' },
        { id: 'attendance', label: 'Lista de asistencias' },
        { id: 'grades', label: 'Lista de calificaciones' },
        { id: 'tasks', label: 'Tareas' },
        { id: 'calendar', label: 'Calendario de actividades' }
      ];

      function selectTab(selectedId) {
        tabs.querySelectorAll('.class-tab').forEach((button) => {
          const selected = button.dataset.tab === selectedId;
          button.setAttribute('aria-selected', String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
        content.replaceChildren();
        if (selectedId === 'attendance') {
          content.append(renderAttendance(aula));
        } else {
          const message = document.createElement('p');
          message.className = 'tab-placeholder';
          message.textContent = selectedId === 'padlet'
            ? 'El espacio del aula está listo. Aquí se mostrará el contenido cuando definamos qué debe incluir.'
            : 'Esta sección estará disponible cuando definamos su funcionamiento.';
          content.append(message);
        }
      }

      tabOptions.forEach(({ id, label }) => {
        const button = document.createElement('button');
        button.className = 'class-tab';
        button.type = 'button';
        button.dataset.tab = id;
        button.setAttribute('role', 'tab');
        button.textContent = label;
        button.addEventListener('click', () => selectTab(id));
        tabs.append(button);
      });
      classroom.append(tabs, content);
      classWorkspace.append(classroom);
      selectTab('padlet');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderClasses(aulas) {
      classList.replaceChildren();
      classWorkspace.replaceChildren();
      classWorkspace.hidden = true;
      if (!aulas.length) {
        addText(classList, 'div', 'empty', 'No hay aulas asignadas a tu cuenta. Pide al administrador que revise la asignación.');
        return;
      }

      aulas.forEach((aula, index) => {
        const button = document.createElement('button');
        button.className = 'class-nav-button';
        button.type = 'button';
        button.setAttribute('aria-current', 'false');
        const initial = addText(button, 'span', 'class-initial', (aula.nombre || 'A').trim().charAt(0).toLocaleUpperCase('es'));
        const text = document.createElement('span');
        text.className = 'class-nav-text';
        addText(text, 'span', 'class-nav-name', aula.nombre || 'Aula sin nombre');
        addText(text, 'span', 'class-nav-course', aula.curso || 'Curso sin especificar');
        button.append(initial, text);
        button.addEventListener('click', () => {
          classList.querySelectorAll('.class-nav-button').forEach((classButton) => classButton.setAttribute('aria-current', 'false'));
          button.setAttribute('aria-current', 'true');
          showClassroom(aula, index);
        });
        classList.append(button);
      });
      classList.querySelector('.class-nav-button')?.click();
    }

    document.getElementById('teacherName').textContent = session?.nombre || 'Profesor';
    document.getElementById('teacherEmail').textContent = session?.email || '';

    if (!session?.uid || !session?.teacherDocId || !session?.email || !Number.isFinite(Number(localStorage.getItem(activityKey)))) {
      endSession();
    } else {
      (async () => {
        try {
          const teacherSnapshot = await getDoc(doc(db, 'Profesores', session.teacherDocId));
          if (!teacherSnapshot.exists() || teacherSnapshot.data().email !== session.email) {
            endSession();
            return;
          }

          const ids = [...new Set([session.uid, session.teacherDocId, session.email])];
          const aulaQueries = [
            ['profesorDocId', session.teacherDocId],
            ['profesorEmail', session.email],
            ['profesor.email', session.email],
            ...ids.map((teacherId) => ['profesorUid', teacherId])
          ];
          const results = await Promise.all(aulaQueries.map(async ([field, value]) => {
            try {
              return await getDocs(query(collection(db, 'Aulas'), where(field, '==', value)));
            } catch (error) {
              console.error(`No se pudieron buscar aulas por ${field}:`, error);
              return null;
            }
          }));
          const snapshots = results.filter(Boolean);
          if (!snapshots.length) throw new Error('No se pudo consultar la colección Aulas.');

          const aulasById = new Map();
          snapshots.forEach((snapshot) => {
            snapshot.docs.forEach((aulaDoc) => {
              const data = aulaDoc.data();
              aulasById.set(aulaDoc.id, {
                id: aulaDoc.id,
                ...data,
                alumnos: Array.isArray(data.alumnos) ? data.alumnos : []
              });
            });
          });

          const aulas = Array.from(aulasById.values());
          status.textContent = aulas.length
            ? `${aulas.length} aula${aulas.length === 1 ? '' : 's'} asignada${aulas.length === 1 ? '' : 's'}`
            : 'No se encontraron aulas asignadas. Verifica la asignación desde el panel administrativo.';
          renderClasses(aulas);
          if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (error) {
          console.error('No se pudieron cargar las aulas del profesor:', error);
          status.textContent = 'No se pudieron consultar tus aulas. Revisa los permisos de lectura de Firestore.';
          classList.replaceChildren();
        }
      })();
    }

    window.addEventListener('storage', (event) => {
      if (event.key === sessionKey && !event.newValue) endSession();
    });
    idleTimer = setTimeout(endSession, Math.max(0, 60 * 60 * 1000 - (Date.now() - Number(localStorage.getItem(activityKey)))));
  </script>
</body>
</html>
