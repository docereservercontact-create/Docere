        const addAttachmentButton = addText(contentCard, 'button', 'task-add-link', '＋ Agregar enlace');
        addAttachmentButton.type = 'button';
        const attachmentItems = Array.isArray(editingTask?.adjuntos) ? [...editingTask.adjuntos] : [];
        attachmentItems.forEach(({ url, nombre }) => {
          if (typeof url !== 'string') return;
          let parsedUrl;
          try {
            parsedUrl = new URL(url);
          } catch {
            return;
          }
          if (!['http:', 'https:'].includes(parsedUrl.protocol)) return;
          const link = document.createElement('a');
          link.className = 'task-attachment-link';
          link.href = parsedUrl.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = nombre || parsedUrl.hostname;
          attachments.append(link);
        });
        addAttachmentButton.addEventListener('click', () => {
          const address = window.prompt('Pega un enlace web (Drive, YouTube u otro recurso):');
          if (!address) return;
          let url;
          try {
            url = new URL(address.trim());
          } catch {
            listStatus.textContent = 'El enlace no es válido. Incluye https:// al inicio.';
            return;
          }
          if (!['https:', 'http:'].includes(url.protocol)) {
            listStatus.textContent = 'Solo se permiten enlaces web http o https.';
            return;
          }
          attachmentItems.push({ url: url.href, nombre: url.hostname });
          const link = document.createElement('a');
          link.className = 'task-attachment-link';
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url.hostname;
          attachments.append(link);
        });
        contentCard.append(attachments);
        main.append(contentCard);

        const sidebar = document.createElement('aside');
        sidebar.className = 'task-composer-sidebar';
        const settingsCard = document.createElement('section');
        settingsCard.className = 'task-composer-card';
        const courseField = document.createElement('label');
        courseField.className = 'task-field';
        courseField.append(document.createTextNode('Para'));
        const courseInput = document.createElement('input');
        courseInput.value = `${aula.curso || 'Curso'} · ${aula.nombre || 'Aula'}`;
        courseInput.readOnly = true;
        courseField.append(courseInput);

        const subjectField = document.createElement('label');
        subjectField.className = 'task-field';
        subjectField.append(document.createTextNode('Materia'));
        const subjectSelect = document.createElement('select');
        function renderTaskSubjectOptions(selectedId = '') {
          subjectSelect.replaceChildren(new Option('General (sin materia)', ''));
          Array.from(taskSubjects.entries())
            .sort((left, right) => left[1].nombre.localeCompare(right[1].nombre, 'es'))
            .forEach(([id, subject]) => subjectSelect.add(new Option(subject.nombre, id)));
          subjectSelect.value = selectedId;
        }
        renderTaskSubjectOptions();
        const legacySelectedSubject = Array.from(taskSubjects.entries()).find(([, subject]) =>
          subject.nombre.toLocaleLowerCase() === String(editingTask?.materia || '').toLocaleLowerCase()
        );
        subjectSelect.value = editingTask?.materiaId
          || legacySelectedSubject?.[0]
          || '';
        subjectField.append(subjectSelect);
        const newSubjectControls = document.createElement('div');
        newSubjectControls.className = 'task-inline-create';
        const newSubjectField = document.createElement('label');
        newSubjectField.className = 'task-field';
        newSubjectField.append(document.createTextNode('Agregar materia'));
        const newSubjectInput = document.createElement('input');
        newSubjectInput.type = 'text';
        newSubjectInput.maxLength = 80;
        newSubjectInput.placeholder = 'Ej. Historia';
        newSubjectInput.setAttribute('aria-label', 'Nombre de la nueva materia');
        newSubjectField.append(newSubjectInput);
        const createSubjectButton = addText(newSubjectControls, 'button', 'task-secondary-button', 'Crear');
        createSubjectButton.type = 'button';
        newSubjectControls.prepend(newSubjectField);
        subjectField.append(newSubjectControls);

        const unitField = document.createElement('label');
        unitField.className = 'task-field';
        unitField.append(document.createTextNode('Unidad'));
        const unitInput = document.createElement('input');
        unitInput.type = 'text';
        unitInput.maxLength = 100;
        unitInput.placeholder = 'Ej. Unidad 1 · Números';
        unitInput.setAttribute('aria-label', 'Unidad de la tarea');
        unitInput.value = editingTask?.unidad || '';
        unitInput.required = Boolean(subjectSelect.value);
        const unitSuggestions = document.createElement('datalist');
        unitSuggestions.id = `task-unit-options-${aula.id}`;
        unitInput.setAttribute('list', unitSuggestions.id);
        unitField.append(unitInput);
        function getUnitsForSelectedSubject() {
          const selectedSubject = taskSubjects.get(subjectSelect.value);
          const subjectName = selectedSubject?.nombre || '';
          return new Set(assignedTasks
            .filter((task) => task.materiaId === subjectSelect.value
              || (!task.materiaId && subjectName
                && String(task.materia || '').toLocaleLowerCase() === subjectName.toLocaleLowerCase()))
            .map((task) => String(task.unidad || '').trim())
            .filter(Boolean));
        }
        function refreshUnitSuggestions() {
          unitSuggestions.replaceChildren();
          Array.from(getUnitsForSelectedSubject()).sort((left, right) => left.localeCompare(right, 'es')).forEach((unit) => {
            const option = document.createElement('option');
            option.value = unit;
            unitSuggestions.append(option);
          });
        }
        refreshUnitSuggestions();
        settingsCard.append(unitSuggestions);

        const assignField = document.createElement('div');
        assignField.className = 'task-field';
        addText(assignField, 'span', '', 'Asignar a');
        const assigneePicker = document.createElement('details');
        assigneePicker.className = 'task-assignee-picker';
        const assigneeSummary = addText(assigneePicker, 'summary', '', `Todos los alumnos (${aula.alumnos.length})`);
        const assigneeList = document.createElement('div');
        assigneeList.className = 'task-assignees';
        aula.alumnos.forEach((student) => {
          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          const existingAssignees = Array.isArray(editingTask?.alumnosAsignados)
            ? editingTask.alumnosAsignados
            : aula.alumnos;
          checkbox.checked = existingAssignees.some((assigned) =>
            assigned.id === student.id && assigned.coleccion === student.coleccion
          );
          checkbox.dataset.studentKey = `${student.coleccion}/${student.id}`;
          const name = document.createElement('span');
          name.textContent = student.nombre || student.email || 'Alumno';
          label.append(checkbox, name);
          assigneeList.append(label);
        });
        const initialCheckedCount = assigneeList.querySelectorAll('input:checked').length;
        assigneeSummary.textContent = initialCheckedCount === aula.alumnos.length
          ? `Todos los alumnos (${initialCheckedCount})`
          : `${initialCheckedCount} alumno(s) seleccionado(s)`;
        assigneeList.addEventListener('change', () => {
          const checkedCount = assigneeList.querySelectorAll('input:checked').length;
          assigneeSummary.textContent = checkedCount === aula.alumnos.length
            ? `Todos los alumnos (${checkedCount})`
            : `${checkedCount} alumno(s) seleccionado(s)`;
        });
        assigneePicker.append(assigneeList);
        assignField.append(assigneePicker);

        const pointsField = document.createElement('label');
        pointsField.className = 'task-field';
        pointsField.append(document.createTextNode('Puntos'));
        const pointsInput = document.createElement('input');
        pointsInput.type = 'number';
        pointsInput.min = '0';
        pointsInput.max = '10000';
        pointsInput.step = '1';
        pointsInput.value = String(editingTask?.puntos ?? 100);
        pointsInput.required = true;
        pointsField.append(pointsInput);

        const dueDateField = document.createElement('label');
        dueDateField.className = 'task-field';
        dueDateField.append(document.createTextNode('Fecha de entrega'));
        const dueDateInput = document.createElement('input');
        dueDateInput.type = 'datetime-local';
        dueDateInput.value = formatDateTimeLocal(editingTask?.fechaEntrega);
        dueDateField.append(dueDateInput);

        const closeField = document.createElement('label');
        closeField.className = 'task-check-field';
        const closeInput = document.createElement('input');
        closeInput.type = 'checkbox';
        closeInput.checked = Boolean(editingTask?.cerrarEntregas);
        const closeText = document.createElement('span');
        closeText.textContent = 'Cerrar entregas después de la fecha límite';
        closeField.append(closeInput, closeText);

        const topicField = document.createElement('label');
        topicField.className = 'task-field';
        topicField.append(document.createTextNode('Tema'));
        const topicSelect = document.createElement('select');
        function refreshTopicOptions(selectedValue = '', preserveExistingTopic = false) {
          topicSelect.replaceChildren(new Option('Selecciona una unidad', ''));
          const units = getUnitsForSelectedSubject();
          if (preserveExistingTopic && selectedValue && !units.has(selectedValue)) units.add(selectedValue);
          Array.from(units).sort((left, right) => left.localeCompare(right, 'es'))
            .forEach((unit) => topicSelect.add(new Option(unit, unit)));
          topicSelect.value = selectedValue;
        }
        refreshTopicOptions(editingTask?.tema || '', true);
        topicField.append(topicSelect);
        subjectSelect.addEventListener('change', () => {
          refreshUnitSuggestions();
          refreshTopicOptions();
          unitInput.required = Boolean(subjectSelect.value);
        });

        const includeInAverageField = document.createElement('label');
        includeInAverageField.className = 'task-check-field';
        const includeInAverageInput = document.createElement('input');
        includeInAverageInput.type = 'checkbox';
        includeInAverageInput.checked = editingTask?.considerarEnPromedio !== false;
        const includeInAverageLabel = document.createElement('span');
        includeInAverageLabel.textContent = 'Incluir la calificación en el promedio';
        includeInAverageField.append(includeInAverageInput, includeInAverageLabel);
        settingsCard.append(courseField, subjectField, unitField, assignField, pointsField, dueDateField, closeField, topicField, includeInAverageField);

        const actionsCard = document.createElement('section');
        actionsCard.className = 'task-composer-card';
        const actions = document.createElement('div');
        actions.className = 'task-form-actions';
        const cancelButton = addText(actions, 'button', 'task-secondary-button', 'Cancelar');
        cancelButton.type = 'button';
        const saveButton = addText(actions, 'button', 'task-primary-button', editingTask ? 'Guardar cambios' : 'Asignar tarea');
        saveButton.type = 'submit';
        const formStatus = addText(actionsCard, 'p', 'task-form-status', '');
        formStatus.setAttribute('role', 'status');
        actionsCard.append(actions, formStatus);
        createSubjectButton.addEventListener('click', async () => {
          const subjectName = newSubjectInput.value.trim();
          if (!subjectName) {
            formStatus.textContent = 'Escribe el nombre de la materia.';
            newSubjectInput.focus();
            return;
          }
          const existingSubject = Array.from(taskSubjects.entries()).find(([, subject]) =>
            subject.nombre.toLocaleLowerCase() === subjectName.toLocaleLowerCase()
          );
          if (existingSubject) {
            renderTaskSubjectOptions(existingSubject[0]);
            refreshUnitSuggestions();
            formStatus.textContent = 'Esa materia ya existe y quedó seleccionada.';
            newSubjectInput.value = '';
            return;
          }
          createSubjectButton.disabled = true;
          formStatus.textContent = 'Creando materia...';
          try {
            const subjectId = `materia-${encodeURIComponent(subjectName.toLocaleLowerCase())}`;
            await setDoc(doc(db, 'Aulas', aula.id, 'materias', subjectId), {
              nombre: subjectName,
              profesorDocId: session.teacherDocId,
              creadoEn: serverTimestamp()
            }, { merge: true });
            taskSubjects.set(subjectId, { nombre: subjectName });
            renderTaskSubjectOptions(subjectId);
            refreshUnitSuggestions();
            newSubjectInput.value = '';
            formStatus.textContent = `Materia ${subjectName} creada y seleccionada.`;
          } catch (error) {
            console.error(`No se pudo crear la materia ${subjectName} del aula ${aula.id}:`, error);
            formStatus.textContent = 'No se pudo crear la materia. Revisa los permisos de Firestore.';
          } finally {
            createSubjectButton.disabled = false;
          }
        });
        sidebar.append(settingsCard, actionsCard);
        composer.append(main, sidebar);
        tasksPage.replaceChildren(composer);

        cancelButton.addEventListener('click', async () => {
          tasksPage.replaceWith(await renderTasks(aula));
        });
        composer.addEventListener('submit', async (event) => {
          event.preventDefault();
          const safeInstructions = sanitizeRichHtml(instructions.innerHTML);
          if (!titleInput.value.trim()) {
            formStatus.textContent = 'Escribe el título de la tarea.';
            titleInput.focus();
            return;
          }
          if (!aula.alumnos.length) {
            formStatus.textContent = 'No hay alumnos asignados a esta aula.';
            return;
          }
          const selectedKeys = new Set(Array.from(
            assigneeList.querySelectorAll('input:checked'),
            (checkbox) => checkbox.dataset.studentKey
          ));
          if (!selectedKeys.size) {
            formStatus.textContent = 'Selecciona al menos un alumno para asignar la tarea.';
            return;
          }
          const points = Number(pointsInput.value);
          if (!Number.isInteger(points) || points < 0 || points > 10000) {
            formStatus.textContent = 'Ingresa un puntaje entero entre 0 y 10000.';
            return;
          }
          let dueDate = null;
          if (dueDateInput.value) {
            dueDate = new Date(dueDateInput.value);
            if (Number.isNaN(dueDate.getTime())) {
              formStatus.textContent = 'La fecha de entrega no es válida.';
              return;
            }
          }

          saveButton.disabled = true;
          cancelButton.disabled = true;
          formStatus.textContent = editingTask ? 'Guardando cambios...' : 'Guardando y asignando tarea...';
          try {
            const alumnosAsignados = aula.alumnos
              .filter((student) => selectedKeys.has(`${student.coleccion}/${student.id}`))
              .map((student) => ({
                id: student.id,
                coleccion: student.coleccion,
                nombre: student.nombre || '',
                email: String(student.email || student.correo || '').trim().toLowerCase()
              }));
            const selectedSubject = subjectSelect.value ? taskSubjects.get(subjectSelect.value) : null;
            const taskData = {
              titulo: titleInput.value.trim(),
              instrucciones: safeInstructions,
              puntos: points,
              fechaEntrega: dueDate,
              cerrarEntregas: closeInput.checked,
              tema: topicSelect.value,
              materiaId: selectedSubject ? subjectSelect.value : '',
              materia: selectedSubject?.nombre || '',
              unidad: unitInput.value.trim(),
              considerarEnPromedio: includeInAverageInput.checked,
              adjuntos: attachmentItems,
              alumnosAsignados,
              alumnosEmails: alumnosAsignados
                .map((student) => String(student.email || student.correo || '').trim().toLowerCase())
                .filter(Boolean),
              aulaId: aula.id,
              aulaNombre: aula.nombre || '',
              curso: aula.curso || '',
              profesorDocId: session.teacherDocId,
              profesorEmail: String(session.email || '').trim().toLowerCase(),
              profesorNombre: session.nombre || 'Profesor'
            };
            let notificationsFailed = false;
            if (editingTask) {
              await updateDoc(doc(db, 'Aulas', aula.id, 'tareas', editingTask.id), {
                ...taskData,
                actualizadoEn: serverTimestamp()
              });
            } else {
              const taskRef = doc(collection(db, 'Aulas', aula.id, 'tareas'));
              await setDoc(taskRef, {
                ...taskData,
                creadoEn: serverTimestamp()
              });
              try {
                await notifyStudents(alumnosAsignados, {
                  id: taskRef.id,
                  aulaId: aula.id,
                  aulaNombre: aula.nombre || 'Aula',
                  titulo: taskData.titulo,
                  tipo: 'tarea',
                  tipoTexto: 'Nueva tarea'
                });
              } catch (notificationError) {
                console.error(`La tarea ${taskRef.id} se guardó, pero no se pudieron guardar todas las notificaciones:`, notificationError);
                notificationsFailed = true;
              }
            }
            if (editingTask) listStatus.textContent = 'Tarea actualizada correctamente.';
            else listStatus.textContent = notificationsFailed
              ? 'La tarea se asignó, pero no se pudieron guardar todas las notificaciones.'
              : 'Tarea asignada correctamente y notificaciones enviadas.';
            tasksPage.replaceWith(await renderTasks(aula));
          } catch (error) {
            console.error(`No se pudo ${editingTask ? 'actualizar' : 'asignar'} la tarea en el aula ${aula.id}:`, error);
            formStatus.textContent = `No se pudo ${editingTask ? 'actualizar' : 'guardar'} la tarea. Revisa los permisos de escritura de Firestore.`;
            saveButton.disabled = false;
            cancelButton.disabled = false;
          }
        });
      }

      createButton.addEventListener('click', () => openTaskComposer());
      return tasksPage;
    }

    async function renderGrades(aula) {
      const gradesPage = document.createElement('section');
      gradesPage.className = 'grades-page';
      const statusText = addText(gradesPage, 'p', 'attendance-status', 'Cargando calificaciones...');
      const summary = document.createElement('div');
      summary.className = 'grades-summary';
      const gradesList = document.createElement('div');
      gradesList.className = 'grades-list';
      gradesPage.append(summary, gradesList);

      try {
        const { tasks, feedbackSnapshots } = await loadClassroomEvaluationData(aula);
        const students = new Map();
        (Array.isArray(aula.alumnos) ? aula.alumnos : []).forEach((student) => {
          if (student.id == null || !student.coleccion) return;
          const studentKey = `${student.coleccion}/${student.id}`;
          students.set(studentKey, {
            key: studentKey,
            nombre: student.nombre || 'Alumno',
            grades: new Map()
          });
        });
        let gradeCount = 0;
        const includedGradeTotals = {
          assignments: { count: 0, score: 0 },
          practiceExams: { count: 0, score: 0 }
        };

        feedbackSnapshots.forEach((snapshot, taskIndex) => {
          const task = tasks[taskIndex];
          const includeInAverage = task.considerarEnPromedio !== false;
          snapshot.docs.forEach((feedbackDoc) => {
            const feedback = feedbackDoc.data();
            const studentId = feedback.estudianteId;
            const studentCollection = feedback.estudianteColeccion;
            const score = Number(feedback.calificacion);
            const maxScore = Number(feedback.puntosMaximos ?? task.puntos ?? 100);
            if (studentId == null || !studentCollection || !Number.isFinite(score)
                || !Number.isFinite(maxScore) || maxScore <= 0 || score < 0 || score > maxScore) {
              console.error(`Se omitió una calificación con datos inválidos (${feedbackDoc.ref.path}).`);
              return;
            }

            const studentKey = `${studentCollection}/${studentId}`;
            if (!students.has(studentKey)) {
              students.set(studentKey, {
                key: studentKey,
                nombre: feedback.estudianteNombre || 'Alumno',
                grades: new Map()
              });
            }
            const student = students.get(studentKey);
            student.nombre = feedback.estudianteNombre || student.nombre;
            const feedbackText = new DOMParser().parseFromString(feedback.comentario || '', 'text/html')
              .body.textContent.trim();
            student.grades.set(`${task.collectionName}/${task.id}`, {
              score,
              maxScore,
              includeInAverage,
              evaluationType: task.tipoEvaluacion === 'simulacro' ? 'practiceExams' : 'assignments',
              notSubmitted: feedbackText.toLocaleLowerCase() === 'tarea no entregada.',
              comentario: sanitizeAnnouncementHtml(feedback.comentario || '')
            });
            gradeCount += 1;
            if (includeInAverage) {
              const evaluationType = task.tipoEvaluacion === 'simulacro' ? 'practiceExams' : 'assignments';
              includedGradeTotals[evaluationType].count += 1;
              includedGradeTotals[evaluationType].score += score;
            }
          });
        });

        if (!tasks.length) {
          statusText.textContent = '';
          addText(gradesList, 'p', 'tab-placeholder', 'Aún no hay asignaciones en esta aula.');
          return gradesPage;
        }

        const allStudents = Array.from(students.values())
          .sort((left, right) => left.nombre.localeCompare(right.nombre, 'es'));
        const formatGrade = (value) => new Intl.NumberFormat('es-MX', {
          maximumFractionDigits: 2
        }).format(value);
        const getStudentAverage = (student, evaluationType) => {
          const includedGrades = Array.from(student.grades.values())
            .filter((grade) => grade.includeInAverage && grade.evaluationType === evaluationType);
          return includedGrades.length
            ? includedGrades.reduce((sum, grade) => sum + grade.score, 0) / includedGrades.length
            : null;
        };
        [
          { key: 'assignments', label: 'Promedio de asignaciones' },
          { key: 'practiceExams', label: 'Promedio de exámenes simulacros' }
        ].forEach(({ key, label }) => {
          const totals = includedGradeTotals[key];
          const averageCard = document.createElement('div');
          averageCard.className = 'grades-average';
          averageCard.append(document.createTextNode(label));
          addText(averageCard, 'strong', '', totals.count
            ? formatGrade(totals.score / totals.count)
            : '—');
          summary.append(averageCard);
        });

        statusText.textContent = gradeCount
          ? `${gradeCount} calificación(es) asignada(s); ${includedGradeTotals.assignments.count} considerada(s) en el promedio de asignaciones y ${includedGradeTotals.practiceExams.count} en el de exámenes simulacros.`
          : 'Aún no hay calificaciones asignadas; se muestran todas las asignaciones y alumnos del aula.';
        const wrapper = document.createElement('div');
        wrapper.className = 'grades-table-wrap';
        wrapper.tabIndex = 0;
        wrapper.setAttribute('role', 'region');
        wrapper.setAttribute('aria-label', 'Tabla completa de calificaciones; desplázate horizontalmente para ver todas las asignaciones');
        const feedbackTooltip = document.createElement('div');
        feedbackTooltip.className = 'grades-feedback-tooltip';
        feedbackTooltip.hidden = true;
        feedbackTooltip.setAttribute('role', 'tooltip');
        const tooltipTitle = addText(feedbackTooltip, 'strong', '', 'Retroalimentación');
        const tooltipBody = document.createElement('div');
        tooltipBody.className = 'grades-feedback-tooltip-body';
        feedbackTooltip.append(tooltipBody);
        document.body.append(feedbackTooltip);
        const hideFeedbackTooltip = () => {
          feedbackTooltip.hidden = true;
        };
        const tooltipCleanupObserver = new MutationObserver(() => {
          if (gradesPage.isConnected) return;
          hideFeedbackTooltip();
          feedbackTooltip.remove();
          tooltipCleanupObserver.disconnect();
        });
        tooltipCleanupObserver.observe(document.body, { childList: true, subtree: true });
        const showFeedbackTooltip = (cell, grade) => {
          tooltipTitle.textContent = grade.notSubmitted ? 'Justificación' : 'Retroalimentación';
          tooltipBody.innerHTML = grade.comentario || '<p>Sin justificación registrada.</p>';
          feedbackTooltip.hidden = false;
          const cellBounds = cell.getBoundingClientRect();
          const tooltipBounds = feedbackTooltip.getBoundingClientRect();
          const left = Math.max(12, Math.min(
            cellBounds.left + cellBounds.width / 2 - tooltipBounds.width / 2,
            window.innerWidth - tooltipBounds.width - 12
          ));
          const top = cellBounds.bottom + tooltipBounds.height + 12 <= window.innerHeight
            ? cellBounds.bottom + 8
            : Math.max(12, cellBounds.top - tooltipBounds.height - 8);
          feedbackTooltip.style.left = `${left}px`;
          feedbackTooltip.style.top = `${top}px`;
        };
        wrapper.addEventListener('scroll', hideFeedbackTooltip);
        const table = document.createElement('table');
        table.className = 'grades-table';
        const head = document.createElement('thead');
        const headerRow = document.createElement('tr');
        addText(headerRow, 'th', '', 'Materia / unidad / asignación');
        allStudents.forEach((student) => {
          const header = document.createElement('th');
          const studentHeader = document.createElement('div');
          studentHeader.className = 'grades-student-header';
          addText(studentHeader, 'span', '', student.nombre);
          const assignmentAverage = getStudentAverage(student, 'assignments');
          const practiceExamAverage = getStudentAverage(student, 'practiceExams');
          addText(studentHeader, 'span', 'grades-student-average', assignmentAverage === null
            ? 'Asignaciones: —'
            : `Asignaciones: ${formatGrade(assignmentAverage)}`);
          addText(studentHeader, 'span', 'grades-student-average', practiceExamAverage === null
            ? 'Simulacros: —'
            : `Simulacros: ${formatGrade(practiceExamAverage)}`);
          header.append(studentHeader);
          headerRow.append(header);
        });
        head.append(headerRow);
        const body = document.createElement('tbody');
        const subjectGroups = new Map();
        tasks.forEach((task) => {
          const subjectName = String(task.materia || 'General').trim() || 'General';
          const subjectKey = task.materiaId || subjectName.toLocaleLowerCase();
          let subjectGroup = subjectGroups.get(subjectKey);
          if (!subjectGroup) {
            subjectGroup = { name: subjectName, units: new Map() };
            subjectGroups.set(subjectKey, subjectGroup);
          }
          const unitName = String(task.unidad || '').trim() || 'Sin unidad';
          const unitKey = unitName.toLocaleLowerCase();
          if (!subjectGroup.units.has(unitKey)) {
            subjectGroup.units.set(unitKey, { name: unitName, tasks: [] });
          }
          subjectGroup.units.get(unitKey).tasks.push(task);
        });

        const appendGroupRow = (label, className) => {
          const row = document.createElement('tr');
          row.className = className;
          addText(row, 'th', '', label).scope = 'row';
          allStudents.forEach(() => row.append(document.createElement('td')));
          body.append(row);
        };
        subjectGroups.forEach((subjectGroup) => {
          appendGroupRow(subjectGroup.name, 'grades-subject-row');
          subjectGroup.units.forEach((unitGroup) => {
            appendGroupRow(unitGroup.name, 'grades-unit-row');
            unitGroup.tasks.forEach((task) => {
              const row = document.createElement('tr');
              row.className = 'grades-task-row';
              const evaluationTitle = task.tipoEvaluacion === 'simulacro'
                ? `Examen simulacro: ${task.titulo || 'Sin título'}`
                : task.titulo || 'Tarea sin título';
              addText(row, 'th', '', task.considerarEnPromedio === false
                ? `${evaluationTitle} (No cuenta)`
                : evaluationTitle).scope = 'row';
              allStudents.forEach((student) => {
                const grade = student.grades.get(`${task.collectionName}/${task.id}`);
                const taskHasAssigneeList = Array.isArray(task.alumnosAsignados);
                const studentIsAssigned = !taskHasAssigneeList || task.alumnosAsignados.some((assigned) =>
                  `${assigned.coleccion}/${assigned.id}` === student.key
                );
                const cell = document.createElement('td');
                if (grade?.notSubmitted) {
                  cell.className = 'grades-not-submitted';
                  cell.textContent = 'No entregada';
                  cell.setAttribute('aria-label', `${student.nombre}: tarea no entregada`);
                } else if (grade) {
                  cell.textContent = formatGrade(grade.score);
                  cell.setAttribute('aria-label', `${student.nombre}: ${formatGrade(grade.score)} de ${formatGrade(grade.maxScore)} puntos`);
                } else {
                  cell.textContent = studentIsAssigned ? '—' : 'No asignada';
                }
                if (grade) {
                  cell.dataset.feedback = 'true';
                  cell.tabIndex = 0;
                  cell.setAttribute('aria-describedby', feedbackTooltip.id || 'grades-feedback-tooltip');
                  feedbackTooltip.id = 'grades-feedback-tooltip';
                  cell.addEventListener('pointerenter', () => showFeedbackTooltip(cell, grade));
                  cell.addEventListener('pointerleave', hideFeedbackTooltip);
                  cell.addEventListener('focus', () => showFeedbackTooltip(cell, grade));
                  cell.addEventListener('blur', hideFeedbackTooltip);
                }
                row.append(cell);
              });
              body.append(row);
            });
          });
        });

        table.append(head, body);
        wrapper.append(table);
        gradesList.append(wrapper);
        gradesPage.addEventListener('remove', hideFeedbackTooltip, { once: true });
      } catch (error) {
        console.error(`No se pudieron cargar las calificaciones del aula ${aula.id}:`, error);
        statusText.textContent = 'No se pudieron cargar las calificaciones. Revisa la conexión y los permisos de Firestore.';
      }

      return gradesPage;
    }

    function showClassroom(aula, index) {
      classWorkspace.replaceChildren();
      classWorkspace.hidden = false;

      const classroom = document.createElement('article');
      classroom.className = 'classroom';
      const banner = document.createElement('header');
      banner.className = `classroom-header classroom-banner-${index % 4}`;
      const bannerTitle = document.createElement('div');
      addText(bannerTitle, 'h2', '', aula.nombre || 'Aula sin nombre');
      addText(bannerTitle, 'p', '', aula.curso || 'Curso sin especificar');
      addText(banner, 'span', 'student-count', `${aula.alumnos.length} alumno${aula.alumnos.length === 1 ? '' : 's'}`);
      banner.prepend(bannerTitle);

      classroom.append(banner);

      const tabs = document.createElement('div');
      tabs.className = 'class-tabs';
      tabs.setAttribute('role', 'tablist');
      tabs.setAttribute('aria-label', 'Secciones del aula');
      const content = document.createElement('section');
      content.className = 'tab-content';
      content.setAttribute('role', 'tabpanel');
      const meetingDialog = document.createElement('dialog');
      meetingDialog.className = 'meeting-link-dialog';
      meetingDialog.setAttribute('aria-labelledby', `meeting-title-${aula.id}`);
      const meetingTitle = addText(meetingDialog, 'h2', '', 'Enlace de Google Meet');
      meetingTitle.id = `meeting-title-${aula.id}`;
      addText(meetingDialog, 'p', '', `Configura el enlace que usarán los alumnos del grupo ${aula.nombre || 'de esta aula'}.`);
      const meetingForm = document.createElement('form');
      meetingForm.className = 'meeting-link-form';
      const meetingLabel = addText(meetingForm, 'label', '', 'Enlace de la reunión');
      const meetingInput = document.createElement('input');
      meetingInput.type = 'url';
      meetingInput.inputMode = 'url';
      meetingInput.placeholder = 'https://meet.google.com/... o https://zoom.us/...';
      meetingInput.value = aula.enlaceClase || '';
      meetingInput.autocomplete = 'url';
      meetingInput.required = true;
      meetingInput.setAttribute('aria-label', `Enlace de Google Meet para ${aula.nombre || 'esta aula'}`);
      meetingLabel.htmlFor = `meeting-url-${aula.id}`;
      meetingInput.id = meetingLabel.htmlFor;
      const meetingStatus = addText(meetingForm, 'p', 'meeting-link-status', '');
      meetingStatus.setAttribute('role', 'status');
      const meetingActions = document.createElement('div');
      meetingActions.className = 'meeting-link-actions';
      const saveMeetingButton = addText(meetingActions, 'button', '', 'Guardar para este grupo');
      saveMeetingButton.type = 'submit';
      const closeMeetingButton = addText(meetingActions, 'button', '', 'Cancelar');
      closeMeetingButton.type = 'button';
      closeMeetingButton.addEventListener('click', () => meetingDialog.close());
      meetingForm.append(meetingInput, meetingStatus, meetingActions);
      meetingForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!meetingInput.reportValidity()) return;
        let parsedUrl;
        try {
          parsedUrl = new URL(meetingInput.value.trim());
        } catch {
          meetingStatus.textContent = 'Escribe un enlace válido de Google Meet o Zoom.';
          return;
        }
        const isGoogleMeet = parsedUrl.hostname === 'meet.google.com';
        const isZoom = parsedUrl.hostname === 'zoom.us' || parsedUrl.hostname.endsWith('.zoom.us');
        if (parsedUrl.protocol !== 'https:' || (!isGoogleMeet && !isZoom) || parsedUrl.pathname === '/') {
          meetingStatus.textContent = 'Usa un enlace HTTPS de Google Meet o Zoom.';
          return;
        }

        saveMeetingButton.disabled = true;
        meetingStatus.textContent = 'Guardando enlace para este grupo...';
        try {
          const meetingUrl = parsedUrl.href;
          await updateDoc(doc(db, 'Aulas', aula.id), {
            enlaceClase: meetingUrl,
            enlaceClaseActualizadoEn: serverTimestamp()
          });
          aula.enlaceClase = meetingUrl;
          meetingStatus.textContent = 'Enlace guardado. Los alumnos de este grupo ya pueden entrar a la reunión.';
        } catch (error) {
          console.error(`No se pudo guardar el enlace de Google Meet del aula ${aula.id}:`, error);
          meetingStatus.textContent = 'No se pudo guardar el enlace. Revisa la conexión y los permisos de Firestore.';
        } finally {
          saveMeetingButton.disabled = false;
        }
      });
      meetingDialog.append(meetingForm);
      meetingDialog.addEventListener('click', (event) => {
        if (event.target === meetingDialog) meetingDialog.close();
      });
      classroom.append(meetingDialog);
      const tabOptions = [
        { id: 'padlet', label: 'Padlet' },
        { id: 'pizarras', label: 'Pizarras' },
        { id: 'meeting-link', label: 'Enlace de clase' },
        { id: 'publications', label: 'Eventos' },
        { id: 'study-materials', label: 'Material de estudio' },
        { id: 'attendance', label: 'Lista de asistencias' },
        { id: 'grades', label: 'Lista de calificaciones' },
        { id: 'tasks', label: 'Tareas' },
        { id: 'practice-exams', label: 'Exámenes simulacros' }
      ];

      async function selectTab(selectedId) {
        tabs.querySelectorAll('.class-tab').forEach((button) => {
          const selected = button.dataset.tab === selectedId;
          button.setAttribute('aria-selected', String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
        content.replaceChildren();
        if (selectedId === 'padlet') {
          content.append(await renderAnnouncements(aula, () => selectTab('publications')));
        } else if (selectedId === 'pizarras') {
          content.append(await renderPizarras(aula));
        } else if (selectedId === 'publications') {
          content.append(await renderPublications(aula));
        } else if (selectedId === 'study-materials') {
          content.append(await renderStudyMaterials(aula));
        } else if (selectedId === 'attendance') {
          content.append(await renderAttendance(aula));
        } else if (selectedId === 'grades') {
          content.append(await renderGrades(aula));
        } else if (selectedId === 'tasks') {
          content.append(await renderTasks(aula));
        } else if (selectedId === 'practice-exams') {
          content.append(await renderPracticeExams(aula));
        } else {
          const message = document.createElement('p');
          message.className = 'tab-placeholder';
          message.textContent = 'Esta sección estará disponible cuando definamos su funcionamiento.';
          content.append(message);
        }
      }

      tabOptions.forEach(({ id, label }) => {
        const button = document.createElement('button');
        button.className = 'class-tab';
        button.type = 'button';
        button.dataset.tab = id;
        button.setAttribute('role', 'tab');
        button.textContent = label;
        button.addEventListener('click', () => {
          if (id === 'meeting-link') {
            meetingInput.value = aula.enlaceClase || '';
            meetingStatus.textContent = '';
            meetingDialog.showModal();
            return;
          }
          selectTab(id).catch((error) => {
            console.error(`No se pudo abrir la sección ${id} del aula ${aula.id}:`, error);
            content.replaceChildren();
            addText(content, 'p', 'tab-placeholder', 'No se pudo cargar esta sección. Inténtalo de nuevo.');
          });
        });
        tabs.append(button);
      });
      classroom.append(tabs, content);
      classWorkspace.append(classroom);
      selectTab('padlet').catch((error) => {
        console.error(`No se pudo abrir el Padlet del aula ${aula.id}:`, error);
        addText(content, 'p', 'tab-placeholder', 'No se pudieron cargar los anuncios. Inténtalo de nuevo.');
      });
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderClasses(aulas) {
      classList.replaceChildren();
      classWorkspace.replaceChildren();
      classWorkspace.hidden = true;
      if (!aulas.length) {
        addText(classList, 'div', 'empty', 'No hay aulas asignadas a tu cuenta. Pide al administrador que revise la asignación.');
        return;
      }

      aulas.forEach((aula, index) => {
        const button = document.createElement('button');
        button.className = 'class-nav-button';
        button.type = 'button';
        button.dataset.classroomId = aula.id;
        button.setAttribute('aria-current', 'false');
        const initial = addText(button, 'span', 'class-initial', (aula.nombre || 'A').trim().charAt(0).toLocaleUpperCase('es'));
        const text = document.createElement('span');
        text.className = 'class-nav-text';
        addText(text, 'span', 'class-nav-name', aula.nombre || 'Aula sin nombre');
        addText(text, 'span', 'class-nav-course', aula.curso || 'Curso sin especificar');
        button.append(initial, text);
        button.addEventListener('click', () => {
          classList.querySelectorAll('.class-nav-button').forEach((classButton) => classButton.setAttribute('aria-current', 'false'));
          button.setAttribute('aria-current', 'true');
          showClassroom(aula, index);
        });
        classList.append(button);
      });
      classList.querySelector('.class-nav-button')?.click();
    }

    const teacherName = document.getElementById('teacherName');
    teacherName.textContent = session?.nombre || 'Nombre del profesor';

    if (!session?.uid || !session?.teacherDocId || !session?.email || !Number.isFinite(Number(localStorage.getItem(activityKey)))) {
      endSession();
    } else {
      (async () => {
        try {
          const teacherSnapshot = await getDoc(doc(db, 'Profesores', session.teacherDocId));
          if (!teacherSnapshot.exists() || teacherSnapshot.data().email !== session.email) {
            endSession();
            return;
          }

          const ids = [...new Set([session.uid, session.teacherDocId, session.email])];
          const aulaQueries = [
            ['profesorDocId', session.teacherDocId],
            ['profesorEmail', session.email],
            ['profesor.email', session.email],
            ...ids.map((teacherId) => ['profesorUid', teacherId])
          ];
          const results = await Promise.all(aulaQueries.map(async ([field, value]) => {
            try {
              return await getDocs(query(collection(db, 'Aulas'), where(field, '==', value)));
            } catch (error) {
              console.error(`No se pudieron buscar aulas por ${field}:`, error);
              return null;
            }
          }));
          const snapshots = results.filter(Boolean);
          if (!snapshots.length) throw new Error('No se pudo consultar la colección Aulas.');

          const aulasById = new Map();
          snapshots.forEach((snapshot) => {
            snapshot.docs.forEach((aulaDoc) => {
              const data = aulaDoc.data();
              aulasById.set(aulaDoc.id, {
                id: aulaDoc.id,
                ...data,
                alumnos: Array.isArray(data.alumnos) ? data.alumnos : []
              });
            });
          });

          const aulas = Array.from(aulasById.values());
          status.textContent = aulas.length
            ? `${aulas.length} aula${aulas.length === 1 ? '' : 's'} asignada${aulas.length === 1 ? '' : 's'}`
            : 'No se encontraron aulas asignadas. Verifica la asignación desde el panel administrativo.';
          renderClasses(aulas);
          subscribeTeacherSubmissionNotifications(aulas);
          aulas.forEach((aula) => migrateClassTaskSubmissionAccess(aula));
          if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (error) {
          console.error('No se pudieron cargar las aulas del profesor:', error);
          status.textContent = 'No se pudieron consultar tus aulas. Revisa los permisos de lectura de Firestore.';
          classList.replaceChildren();
        }
      })();
    }

    window.addEventListener('storage', (event) => {
      if (event.key === sessionKey && !event.newValue) endSession();
    });
    idleTimer = setTimeout(endSession, Math.max(0, 60 * 60 * 1000 - (Date.now() - Number(localStorage.getItem(activityKey)))));
  </script>
</body>
</html>
