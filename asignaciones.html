  <style>
    :root {
      --page: #eef5fa;
      --surface: #fff;
      --ink: #101d32;
      --muted: #52647b;
      --line: #d7e3ee;
      --blue: #155eef;
      --teal: #10a6a1;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #e5f2f6 0, #f4f8fb 100%); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { width: min(100% - 40px, 1200px); margin: 0 auto; padding: 32px 0 56px; }
    .page-banner { position: relative; display: flex; min-height: 190px; align-items: center; overflow: hidden; margin-bottom: 24px; padding: 32px 42px; border-radius: 22px; background: linear-gradient(110deg, #174879, #079b9d); box-shadow: 0 14px 30px rgba(24, 70, 112, .15); }
    .page-banner::before, .page-banner::after { position: absolute; right: 8%; width: 230px; height: 230px; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; content: ""; }
    .page-banner::before { top: -145px; box-shadow: 0 0 0 26px rgba(255,255,255,.035), 0 0 0 54px rgba(255,255,255,.025); }
    .page-banner::after { right: 25%; bottom: -180px; width: 210px; height: 210px; }
    .page-banner h1 { position: relative; z-index: 1; margin: 0; color: #fff; font-size: clamp(32px, 5vw, 56px); font-weight: 500; }
    .assignment-surface { padding: 24px 27px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.78); box-shadow: 0 10px 30px rgba(38, 78, 115, .06); }
    .status { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .assignment-list { display: grid; gap: 14px; }
    .assignment-card { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; padding: 16px 22px; border: 1px solid #dbe5ee; border-left: 4px solid var(--teal); border-radius: 12px; background: linear-gradient(115deg, #fff, #f9fcfd); box-shadow: 0 4px 12px rgba(29, 68, 103, .035); }
    .assignment-card h2 { margin: 0 0 4px; font-size: 21px; font-weight: 500; overflow-wrap: anywhere; }
    .assignment-context { margin: 0; color: var(--ink); font-size: 16px; }
    .assignment-meta { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .assignment-details { display: grid; align-content: start; justify-items: stretch; gap: 10px; }
    .assignment-due-label { color: var(--ink); font-size: 17px; text-align: right; }
    .assignment-due { color: var(--muted); font-size: 14px; text-align: right; }
    .assignment-submit { min-height: 46px; margin-top: 4px; padding: 0 16px; border: 0; border-radius: 9px; background: linear-gradient(110deg, #2479df, #118f9a); box-shadow: 0 5px 12px rgba(28, 120, 168, .17); color: #fff; font-size: 15px; font-weight: 650; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
    .assignment-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(28, 120, 168, .22); }
    .assignment-submit:disabled { opacity: .65; cursor: wait; }
    .assignment-submit:focus-visible, .assignment-dialog-close:focus-visible, .submission-upload:focus-visible { outline: 3px solid #41c9c4; outline-offset: 2px; }
    .empty { padding: 28px 18px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
    dialog.assignment-dialog { width: min(620px, calc(100% - 28px)); max-height: min(82vh, 700px); padding: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); box-shadow: 0 24px 70px rgba(15, 35, 58, .28); }
    dialog.assignment-dialog::backdrop { background: rgba(13, 31, 51, .52); }
    .assignment-dialog-header, .assignment-dialog-body { padding: 20px 22px; }
    .assignment-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
    .assignment-dialog-header h2 { margin: 0; font-size: 20px; }
    .assignment-dialog-close { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
    .assignment-instructions { line-height: 1.6; overflow-wrap: anywhere; }
    .assignment-instructions > :first-child { margin-top: 0; }
    .assignment-instructions > :last-child { margin-bottom: 0; }
    .assignment-attachments { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .assignment-attachments a { color: var(--blue); overflow-wrap: anywhere; }
    .submission-form { display: grid; gap: 12px; margin-top: 22px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: #f6fafc; }
    .submission-form label { display: grid; gap: 8px; color: var(--ink); font-size: 14px; font-weight: 650; }
    .submission-form input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #9bb6ca; border-radius: 8px; background: #fff; color: var(--muted); }
    .submission-help, .submission-status { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .submission-status:empty { display: none; }
    .submission-upload { min-height: 42px; padding: 0 15px; border: 0; border-radius: 9px; background: linear-gradient(110deg, #2479df, #118f9a); color: #fff; font-weight: 650; cursor: pointer; }
    .submission-upload:disabled { opacity: .65; cursor: wait; }
    .submission-file-link { color: var(--blue); font-weight: 650; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      .page { width: min(100% - 28px, 1200px); padding: 20px 0 36px; }
      .page-banner { min-height: 140px; margin-bottom: 16px; padding: 24px; border-radius: 16px; }
      .assignment-surface { padding: 14px; border-radius: 12px; }
      .assignment-card { grid-template-columns: 1fr; gap: 14px; padding: 16px; }
      .assignment-details { grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; }
      .assignment-due-label, .assignment-due { text-align: left; }
      .assignment-submit { grid-column: 1 / -1; }
    }
  </style>

  <main class="page">
    <header class="page-banner"><h1>Asignaciones</h1></header>
    <section class="assignment-surface" aria-label="Asignaciones del alumno">
      <p class="status" id="assignmentsStatus" role="status" aria-live="polite">Cargando asignaciones...</p>
      <div class="assignment-list" id="assignmentsList"></div>
    </section>
  </main>

  <dialog class="assignment-dialog" id="assignmentDialog" aria-labelledby="assignmentDialogTitle">
    <div class="assignment-dialog-header">
      <div><h2 id="assignmentDialogTitle"></h2><p class="assignment-meta" id="assignmentDialogContext"></p></div>
      <button class="assignment-dialog-close" id="assignmentDialogClose" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="assignment-dialog-body">
      <div class="assignment-instructions" id="assignmentDialogInstructions"></div>
      <div class="assignment-attachments" id="assignmentDialogAttachments"></div>
      <form class="submission-form" id="submissionForm">
        <label for="submissionFile">Entrega tu trabajo en PDF</label>
        <input id="submissionFile" name="submissionFile" type="file" accept=".pdf,application/pdf" required>
        <p class="submission-help">Solo archivos PDF de hasta 10 MB. Puedes reemplazar tu entrega antes del cierre.</p>
        <p class="submission-status" id="submissionStatus" role="status" aria-live="polite"></p>
        <button class="submission-upload" id="submissionUploadButton" type="submit">Subir PDF</button>
      </form>

  <script type="module">
    import { getApps, initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { collection, getDocs, getFirestore, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getDownloadURL, getMetadata, getStorage, ref, uploadBytes } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
    import { getStudentAbsenceStatus, getSuspensionMessage } from './student-access.js';
    import { auth, authApp, firebaseConfig, signOutPortalUser } from './portal-auth.js';

    const appName = 'studentAssignments';
    const app = getApps().find((firebaseApp) => firebaseApp.name === appName)
      || initializeApp(firebaseConfig, appName);
    const db = getFirestore(app);
    const storage = getStorage(authApp);
    const assignmentsStatus = document.getElementById('assignmentsStatus');
    const assignmentsList = document.getElementById('assignmentsList');
    const assignmentDialog = document.getElementById('assignmentDialog');
    const assignmentDialogTitle = document.getElementById('assignmentDialogTitle');
    const assignmentDialogContext = document.getElementById('assignmentDialogContext');
    const assignmentDialogInstructions = document.getElementById('assignmentDialogInstructions');
    const assignmentDialogAttachments = document.getElementById('assignmentDialogAttachments');
    const submissionForm = document.getElementById('submissionForm');
    const submissionFile = document.getElementById('submissionFile');
    const submissionStatus = document.getElementById('submissionStatus');
    const submissionUploadButton = document.getElementById('submissionUploadButton');
    let selectedTask = null;

    function addText(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      element.className = className;
      element.textContent = text;
      parent.append(element);
      return element;
    }

    function isStudentInClassroom(classroom, student) {
      return Array.isArray(classroom.alumnos) && classroom.alumnos.some((assignedStudent) =>
        (assignedStudent.id === student.id && assignedStudent.coleccion === student.coleccion)
        || (student.email && assignedStudent.email === student.email)
      );
    }

    function isTaskAssignedToStudent(task, student) {
      if (!Array.isArray(task.alumnosAsignados)) return true;
      return task.alumnosAsignados.some((assignedStudent) =>
        (assignedStudent.id === student.id && assignedStudent.coleccion === student.coleccion)
        || (student.email && assignedStudent.email === student.email)
      );
    }

    function sanitizeRichHtml(html) {
      const allowedTags = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'H2', 'H3', 'UL', 'OL', 'LI', 'BLOCKQUOTE']);
      const blockedTags = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'SVG', 'MATH']);
      const parsed = new DOMParser().parseFromString(html, 'text/html');

      function copySafeNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent || '');
        if (node.nodeType !== Node.ELEMENT_NODE || blockedTags.has(node.tagName)) return document.createDocumentFragment();
        const fragment = document.createDocumentFragment();
        const target = allowedTags.has(node.tagName) ? document.createElement(node.tagName.toLowerCase()) : fragment;
        Array.from(node.childNodes).forEach((child) => target.append(copySafeNode(child)));
        return target;
      }

      const safeContent = document.createElement('div');
      Array.from(parsed.body.childNodes).forEach((node) => safeContent.append(copySafeNode(node)));
      return safeContent.innerHTML;
    }

    function formatDeadline(value) {
      if (!value) return 'Sin fecha de entrega';
      const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
      return Number.isNaN(date.getTime())
        ? 'Fecha de entrega no válida'
        : new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
    }

    function getDeadlineDate(value) {
      if (!value) return null;
      const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function isSubmissionClosed(task) {
      if (task.cerrarEntregas !== true) return false;
      const deadline = getDeadlineDate(task.fechaEntrega);
      return Boolean(deadline && Date.now() > deadline.getTime());
    }

    function getAuthenticatedStudent() {
      return new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(auth, (user) => {
          unsubscribe();
          const sessionEmail = String(studentSession?.email || '').trim().toLowerCase();
          if (!user || user.email?.toLowerCase() !== sessionEmail) {
            reject(new Error('No hay una sesión segura de Firebase para este alumno. Cierra sesión y vuelve a ingresar.'));
            return;
          }
          resolve(user);
        }, (error) => {
          unsubscribe();
          reject(error);
        });
      });
    }

    function getSubmissionReference(task, user) {
      return ref(storage, `entregas/${task.aulaId}/${task.id}/${user.uid}.pdf`);
    }

    async function showExistingSubmission(task) {
      try {
        const user = await getAuthenticatedStudent();
        const fileReference = getSubmissionReference(task, user);
        const metadata = await getMetadata(fileReference);
        const link = addText(submissionStatus, 'a', 'submission-file-link', `Ya entregaste: ${metadata.customMetadata?.originalName || 'entrega.pdf'}. Abrir archivo`);
        link.href = await getDownloadURL(fileReference);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        if (isSubmissionClosed(task)) {
          submissionFile.disabled = true;
          submissionUploadButton.disabled = true;
          submissionStatus.append(document.createTextNode(' · La fecha límite ya pasó.'));
        } else {
          submissionStatus.append(document.createTextNode(' · Al subir otro PDF, reemplazarás esta entrega.'));
        }
      } catch (error) {
        if (error.code === 'storage/object-not-found') return;
        console.error(`No se pudo consultar la entrega de la tarea ${task.id}:`, error);
        submissionStatus.textContent = error.message || 'No se pudo consultar tu entrega.';
      }
    }

    function renderAssignment(task) {
      const card = document.createElement('article');
      card.className = 'assignment-card';
      const content = document.createElement('div');
      addText(content, 'h2', '', task.titulo || 'Asignación sin título');
      addText(content, 'p', 'assignment-context', task.tema || task.curso || 'Materia');
      addText(content, 'p', 'assignment-meta', `${task.curso || 'Curso'} · ${task.aulaNombre || 'Aula'}${task.profesorNombre ? ` · ${task.profesorNombre}` : ''}`);

      const details = document.createElement('aside');
      details.className = 'assignment-details';
      addText(details, 'span', 'assignment-due-label', 'Fecha de entrega');
      addText(details, 'span', 'assignment-due', formatDeadline(task.fechaEntrega));
      const closed = isSubmissionClosed(task);
      const deliverButton = addText(details, 'button', 'assignment-submit', closed ? 'Entrega cerrada' : 'Entregar tarea');
      deliverButton.type = 'button';
      deliverButton.disabled = closed;
      deliverButton.addEventListener('click', () => {
        selectedTask = task;
        assignmentDialogTitle.textContent = task.titulo || 'Asignación';
        assignmentDialogContext.textContent = `${task.tema || 'Materia'} · ${task.puntos ?? 100} puntos · ${formatDeadline(task.fechaEntrega)}`;
        assignmentDialogInstructions.innerHTML = sanitizeRichHtml(task.instrucciones || 'El profesor no agregó instrucciones.');
        assignmentDialogAttachments.replaceChildren();
        (Array.isArray(task.adjuntos) ? task.adjuntos : []).forEach((attachment) => {
          try {
            const url = new URL(attachment.url);
            if (!['http:', 'https:'].includes(url.protocol)) return;
            const link = addText(assignmentDialogAttachments, 'a', '', attachment.nombre || url.hostname);
            link.href = url.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          } catch {
            return;
          }
        });
        submissionForm.reset();
        submissionStatus.replaceChildren();
        submissionFile.disabled = closed;
        submissionUploadButton.disabled = closed;
        submissionUploadButton.textContent = closed ? 'Entrega cerrada' : 'Subir PDF';
        if (closed) submissionStatus.textContent = 'La fecha límite para entregar esta tarea ya pasó.';
        assignmentDialog.showModal();
        if (!closed) showExistingSubmission(task);
      });
      card.append(content, details);
      return card;
    }

    document.getElementById('assignmentDialogClose').addEventListener('click', () => assignmentDialog.close());
    assignmentDialog.addEventListener('click', (event) => {
      if (event.target === assignmentDialog) assignmentDialog.close();
    });

    submissionForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!selectedTask || isSubmissionClosed(selectedTask)) {
        submissionStatus.textContent = 'La fecha límite para entregar esta tarea ya pasó.';
        return;
      }

      const file = submissionFile.files?.[0];
      if (!file) {
        submissionStatus.textContent = 'Selecciona un archivo PDF antes de subirlo.';
        return;
      }
      if (!file.name.toLowerCase().endsWith('.pdf') || (file.type && file.type !== 'application/pdf')) {
        submissionStatus.textContent = 'El archivo debe ser un PDF.';
        return;
      }
      if (!file.size || file.size > 10 * 1024 * 1024) {
        submissionStatus.textContent = 'El archivo debe pesar menos de 10 MB.';
        return;
      }
      const signature = new TextDecoder().decode(await file.slice(0, 5).arrayBuffer());
      if (signature !== '%PDF-') {
        submissionStatus.textContent = 'El archivo seleccionado no contiene un documento PDF válido.';
        return;
      }

      submissionUploadButton.disabled = true;
      submissionFile.disabled = true;
      submissionStatus.textContent = 'Subiendo tu entrega...';
      try {
        const user = await getAuthenticatedStudent();
        const fileReference = getSubmissionReference(selectedTask, user);
        await uploadBytes(fileReference, file, {
          contentType: 'application/pdf',
          customMetadata: {
            originalName: file.name.slice(0, 200),
            studentId: String(studentSession.id),
            studentCollection: String(studentSession.coleccion),
            studentName: String(studentSession.nombre || 'Alumno'),
            studentEmail: user.email || '',
            taskTitle: String(selectedTask.titulo || 'Asignación')
          }
        });
        const link = addText(submissionStatus, 'a', 'submission-file-link', 'Entrega subida correctamente. Abrir PDF');
        link.href = await getDownloadURL(fileReference);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        submissionStatus.append(document.createTextNode(' · Si vuelves a subir un archivo, reemplazará este PDF.'));
      } catch (error) {
        console.error(`No se pudo subir la entrega de la tarea ${selectedTask.id}:`, error);
        submissionStatus.textContent = error.code === 'storage/unauthorized'
          ? 'Firebase Storage rechazó la subida (storage/unauthorized). Comprueba que las reglas estén publicadas en el bucket correcto, que la tarea tenga el correo de este alumno en alumnosEmails y que la fecha de entrega siga abierta. En el simulador de reglas prueba create (o update al reemplazar), activa Autenticado y usa entregas/{aulaId}/{taskId}/{uid}.pdf.'
          : error.code === 'storage/bucket-not-found'
            ? 'No se encontró el bucket de Firebase Storage. Revisa la configuración storageBucket del proyecto.'
            : error.message || 'No se pudo subir el archivo. Inténtalo de nuevo.';
      } finally {
        submissionUploadButton.disabled = isSubmissionClosed(selectedTask);
        submissionFile.disabled = isSubmissionClosed(selectedTask);
        if (!isSubmissionClosed(selectedTask)) submissionUploadButton.textContent = 'Subir PDF';
      }
    });

    const studentSession = JSON.parse(localStorage.getItem('studentSession') || 'null');
    document.getElementById('userNameLabel').textContent = studentSession?.nombre || 'Alumno';
    if (typeof lucide !== 'undefined') lucide.createIcons();
    document.getElementById('btnCerrarSesion').addEventListener('click', async () => {
      if (!confirm('¿Deseas cerrar sesión?')) return;
      try {
        const { logSessionEvent } = await import('./session-audit.js');
        await logSessionEvent(studentSession, 'cierre_sesion', 'alumno');
      } catch (error) {
        console.error('No se pudo registrar el cierre de sesión del alumno:', error);
      }
      try {
        await signOutPortalUser();
      } catch (error) {
        console.error('No se pudo cerrar la sesión segura de Firebase:', error);
      }
      localStorage.removeItem('studentSession');
      localStorage.removeItem('studentSessionLastActivity');
      window.location.href = 'index.html';
    });

    async function loadAssignments() {
      const student = JSON.parse(localStorage.getItem('studentSession') || 'null');
      if (!student?.id || !student?.coleccion) {
        assignmentsStatus.textContent = 'No se encontró la sesión del alumno. Inicia sesión para consultar tus asignaciones.';
        return;
      }

      try {
        const absenceStatus = await getStudentAbsenceStatus(student);
        if (absenceStatus.isSuspended) {
          assignmentsStatus.textContent = getSuspensionMessage(absenceStatus);
          return;
        }

        const classroomsSnapshot = await getDocs(collection(db, 'Aulas'));
        const classrooms = classroomsSnapshot.docs
          .map((classroomDoc) => ({ id: classroomDoc.id, ...classroomDoc.data() }))
          .filter((classroom) => isStudentInClassroom(classroom, student));

        if (!classrooms.length) {
          assignmentsStatus.textContent = 'Aún no estás asignado a un aula.';
          assignmentsList.append(addText(document.createElement('div'), 'p', 'empty', 'Cuando se te asigne un aula, aquí aparecerán tus tareas.'));
          return;
        }

        const assignmentsByClassroom = new Map();
        const loadedClassrooms = new Set();
        const unsubscribeTasks = [];

        function renderAssignments() {
          const assignments = Array.from(assignmentsByClassroom.values())
            .filter(Boolean)
            .flat()
            .sort((left, right) => (right.creadoEn?.toMillis?.() || 0) - (left.creadoEn?.toMillis?.() || 0));
          assignmentsList.replaceChildren();
          assignments.forEach((task) => assignmentsList.append(renderAssignment(task)));

          const failedCount = Array.from(assignmentsByClassroom.values()).filter((result) => result === null).length;
          if (loadedClassrooms.size < classrooms.length) {
            assignmentsStatus.textContent = assignments.length
              ? `${assignments.length} asignación(es). Cargando ${classrooms.length - loadedClassrooms.size} aula(s)...`
              : 'Cargando asignaciones...';
          } else if (!assignments.length) {
            assignmentsStatus.textContent = failedCount
              ? `No se pudieron consultar las tareas de ${failedCount} aula(s). Revisa los permisos de Firestore.`
              : 'Todavía no tienes asignaciones.';
          } else {
            assignmentsStatus.textContent = failedCount
              ? `${assignments.length} asignación(es). No se pudieron consultar ${failedCount} aula(s).`
              : `${assignments.length} asignación(es) en ${classrooms.length} aula(s).`;
          }
        }

        classrooms.forEach((classroom) => {
          const unsubscribe = onSnapshot(collection(db, 'Aulas', classroom.id, 'tareas'), (snapshot) => {
            assignmentsByClassroom.set(classroom.id, snapshot.docs
              .map((taskDoc) => ({ id: taskDoc.id, ...taskDoc.data() }))
              .filter((task) => isTaskAssignedToStudent(task, student))
              .map((task) => ({
                ...task,
                aulaId: classroom.id,
                aulaNombre: classroom.nombre || task.aulaNombre || 'Aula',
                curso: classroom.curso || task.curso || ''
              })));
            loadedClassrooms.add(classroom.id);
            renderAssignments();
          }, (error) => {
            console.error(`No se pudieron escuchar las asignaciones del aula ${classroom.id}:`, error);
            assignmentsByClassroom.set(classroom.id, null);
            loadedClassrooms.add(classroom.id);
            renderAssignments();
          });
          unsubscribeTasks.push(unsubscribe);
        });

        window.addEventListener('pagehide', () => unsubscribeTasks.forEach((unsubscribe) => unsubscribe()), { once: true });
        assignmentsStatus.textContent = 'Cargando asignaciones...';
      } catch (error) {
        console.error('No se pudieron cargar las asignaciones del alumno:', error);
        assignmentsStatus.textContent = 'No se pudieron cargar tus asignaciones. Revisa la conexión y los permisos de Firestore.';
      }
    }

    loadAssignments();
  </script>
</body>
</html>
