<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de administración Docére.">
  <title>Panel administrativo | Docére</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --page: #f4f7fb;
      --surface: #ffffff;
      --ink: #142033;
      --muted: #64748b;
      --line: #dce4ee;
      --blue: #155eef;
      --green: #087f5b;
      --red: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px max(24px, calc((100vw - 1440px) / 2));
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #eaf1ff;
      color: var(--blue);
    }
    .brand-title { font-size: 15px; font-weight: 750; }
    .brand-subtitle { color: var(--muted); font-size: 12px; }

    .admin-actions { display: flex; align-items: center; gap: 14px; }
    .admin-name { color: var(--muted); font-size: 14px; }
    .logout-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .logout-button:hover { background: #f7f9fc; }

    main { width: min(1440px, calc(100% - 48px)); margin: 30px auto; }
    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 22px;
    }
    h1 { margin: 0 0 5px; font-size: 26px; }
    .page-heading p { margin: 0; color: var(--muted); font-size: 14px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    .tab {
      min-height: 44px;
      padding: 0 15px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 650;
      cursor: pointer;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
    .teacher-create {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      align-self: center;
      padding: 0 12px;
      border: 1px solid var(--blue);
      border-radius: 6px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }
    .teacher-create:hover { background: #edf3ff; }
    .teacher-create[hidden] { display: none; }
    .classroom-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
    }
    .classroom-form[hidden] { display: none; }
    .classroom-form label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .classroom-form input:not([type="checkbox"]),
    .classroom-form select {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .classroom-form select[multiple] { min-height: 150px; }
    .classroom-form .full { grid-column: 1 / -1; }
    .class-schedule-fields { display: grid; grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .schedule-days { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; }
    .schedule-days legend { padding: 0 5px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .schedule-days label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; font-weight: 500; }
    .schedule-days input { width: 16px; min-height: 16px; margin: 0; }
    .class-schedule-fields > label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .class-schedule-fields input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .student-picker { display: grid; gap: 6px; max-height: 240px; overflow-y: auto; padding: 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
    .student-option { display: flex !important; grid-template-columns: auto 1fr; align-items: center; gap: 8px !important; padding: 7px; border-radius: 4px; color: var(--ink) !important; font-weight: 500 !important; cursor: pointer; }
    .student-option:hover { background: #f4f7fb; }
    .student-option input { width: 16px !important; min-height: 16px !important; margin: 0; padding: 0; }
    .roster-editor { display: grid; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .roster-editor h3 { margin: 0; font-size: 15px; }
    .roster-editor .student-picker { max-height: 300px; }
    .roster-editor label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .roster-editor input,
    .roster-editor select { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
    .roster-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .roster-actions button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 5px; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
    .roster-actions .delete-classroom { background: var(--red); }
    .roster-actions button:disabled { opacity: 0.6; cursor: wait; }
    .roster-message { min-height: 18px; margin: 0; color: var(--muted); font-size: 13px; }
    .record-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .record-actions button { min-height: 38px; padding: 0 13px; border: 0; border-radius: 5px; background: var(--red); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    .record-actions button:disabled { opacity: 0.6; cursor: wait; }
    .classroom-form button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 0;
      border-radius: 5px;
      background: var(--blue);
      color: #fff;
      font-weight: 650;
      cursor: pointer;
    }
    .classroom-form button:disabled { opacity: 0.6; cursor: wait; }
    .classroom-form-message { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 13px; }
    .count {
      display: inline-grid;
      min-width: 22px;
      height: 22px;
      margin-left: 5px;
      padding: 0 5px;
      place-items: center;
      border-radius: 11px;
      background: #edf2f8;
      color: var(--muted);
      font-size: 12px;
    }

    .search-wrap { position: relative; width: min(320px, 40vw); }
    .search-wrap svg { position: absolute; top: 11px; left: 11px; color: var(--muted); }
    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
    }
    .search-input:focus { outline: 2px solid #a9c4ff; border-color: var(--blue); }

    .status-line { min-height: 26px; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .records { display: grid; gap: 10px; }
    .record {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
    }
    .record summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 58px;
      padding: 11px 16px;
      cursor: pointer;
      list-style: none;
    }
    .record summary::-webkit-details-marker { display: none; }
    .record summary::after { content: "+"; color: var(--blue); font-size: 20px; }
    .record[open] summary::after { content: "−"; }
    .record-title { font-weight: 700; }
    .record-meta { margin-top: 3px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .record-details { padding: 0 16px 16px; }
    .details-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
    .detail-item { min-width: 0; padding: 11px 12px 7px 0; }
    .detail-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .detail-value { display: block; color: var(--ink); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .empty-state {
      padding: 40px 20px;
      border: 1px dashed var(--line);
      border-radius: 7px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.65);
    }

    @media (max-width: 760px) {
      .topbar { padding: 12px 16px; }
      main { width: calc(100% - 32px); margin: 22px auto; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 8px; }
      .tabs { overflow-x: auto; flex-wrap: nowrap; }
      .tab { flex: 0 0 auto; padding: 0 12px; }
      .search-wrap { width: 100%; margin-bottom: 10px; }
      .details-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .classroom-form { grid-template-columns: 1fr; padding: 14px; }
      .class-schedule-fields { grid-template-columns: 1fr; }
      .classroom-form .full { grid-column: auto; }
    }

    @media (max-width: 480px) {
      .brand-subtitle, .admin-name { display: none; }
      h1 { font-size: 23px; }
      .details-grid { grid-template-columns: 1fr; }
      .record summary { padding: 11px 12px; }
      .record-details { padding: 0 12px 12px; }
      .logout-button { padding: 0 9px; }
      .logout-button span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="layout-dashboard"></i></span>
      <span><span class="brand-title">Docére</span><br><span class="brand-subtitle">Administración</span></span>
    </div>
    <div class="admin-actions">
      <span class="admin-name" id="adminName">Administrador</span>
      <button class="logout-button" id="logoutButton" type="button">
        <i data-lucide="log-out"></i><span>Cerrar sesión</span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <div>
        <h1>Registros</h1>
        <p>Consulta la información recibida en cada formulario.</p>
      </div>
    </section>

    <section aria-label="Registros guardados">
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="Colecciones">
          <button class="tab" id="tabAspirantes" type="button" role="tab" aria-selected="true" data-collection="aspirantes_admision">Aspirantes UNAM <span class="count" id="countAspirantes">—</span></button>
          <button class="tab" id="tabCursos" type="button" role="tab" aria-selected="false" data-collection="Cursos">Otros cursos <span class="count" id="countCursos">—</span></button>
          <button class="tab" id="tabProfesores" type="button" role="tab" aria-selected="false" data-collection="Profesores">Profesores <span class="count" id="countProfesores">—</span></button>
          <button class="tab" id="tabAulas" type="button" role="tab" aria-selected="false" data-collection="Aulas">Aulas <span class="count" id="countAulas">—</span></button>
        </div>
        <a class="teacher-create" id="teacherCreateLink" href="Registro_profesorado.html" hidden>
          <i data-lucide="user-plus" aria-hidden="true"></i>
          <span>Dar de alta profesor</span>
        </a>
        <label class="search-wrap">
          <i data-lucide="search" width="17" height="17" aria-hidden="true"></i>
          <input class="search-input" id="searchInput" type="search" placeholder="Buscar en los registros" autocomplete="off">
        </label>
      </div>
      <form class="classroom-form" id="classroomForm" hidden>
        <label>Nombre del aula *<input name="nombre" required maxlength="100" placeholder="Ej. Grupo UNAM matutino"></label>
        <label>Curso *<input name="curso" required maxlength="120" placeholder="Ej. Ingreso UNAM"></label>
        <label>Profesor asignado *<select name="profesorUid" id="teacherSelect" required><option value="">Selecciona un profesor</option></select></label>
        <div class="class-schedule-fields" id="classScheduleFields">
          <fieldset class="schedule-days">
            <legend>Días de clase *</legend>
            <label><input type="checkbox" name="diasClase" value="lunes"> Lunes</label>
            <label><input type="checkbox" name="diasClase" value="martes"> Martes</label>
            <label><input type="checkbox" name="diasClase" value="miercoles"> Miércoles</label>
            <label><input type="checkbox" name="diasClase" value="jueves"> Jueves</label>
            <label><input type="checkbox" name="diasClase" value="viernes"> Viernes</label>
            <label><input type="checkbox" name="diasClase" value="sabado"> Sábado</label>
            <label><input type="checkbox" name="diasClase" value="domingo"> Domingo</label>
          </fieldset>
          <label>Hora de inicio *<input name="horaInicio" type="time" required></label>
          <label>Hora de fin *<input name="horaFin" type="time" required></label>
          <label>Horas totales del curso *<input name="horasCursoTotal" type="number" min="0.25" step="0.25" required placeholder="Ej. 120"></label>
        </div>
        <label class="full">Alumnos asignados *<div id="studentSelect"></div></label>
        <p class="classroom-form-message">Marca únicamente los alumnos que quieres agregar al grupo. Puedes cambiar la selección cuando quieras.</p>
        <p class="classroom-form-message" id="classroomFormMessage" role="status"></p>
        <button id="createClassroomButton" type="submit"><i data-lucide="plus"></i> Crear aula y asignar</button>
      </form>
      <p class="status-line" id="statusLine" role="status">Verificando acceso administrativo...</p>
      <div class="records" id="recordsList"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC64X_uSvL_Sn1WQLw7ZV9QDme2aOfV5ag",
      authDomain: "docere-931ec.firebaseapp.com",
      projectId: "docere-931ec",
      storageBucket: "docere-931ec.firebasestorage.app",
      messagingSenderId: "1005663843239",
      appId: "1:1005663843239:web:d8f6c7524a5d10bf797c82",
      measurementId: "G-B6TDT4VE7S"
    };

    const sessionKey = 'adminSession';
    const activityKey = 'adminSessionLastActivity';
    const idleLimit = 60 * 60 * 1000;
    const session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
    const lastActivity = Number(localStorage.getItem(activityKey));
    const statusLine = document.getElementById('statusLine');
    const recordsList = document.getElementById('recordsList');
    const searchInput = document.getElementById('searchInput');
    const teacherCreateLink = document.getElementById('teacherCreateLink');
    const classroomForm = document.getElementById('classroomForm');
    const classroomFormMessage = document.getElementById('classroomFormMessage');
    const teacherSelect = document.getElementById('teacherSelect');
    const studentSelect = document.getElementById('studentSelect');
    const classroomSubmit = document.getElementById('createClassroomButton');
    const app = initializeApp(firebaseConfig, 'adminPanel');
    const db = getFirestore(app);
    const collections = {
      aspirantes_admision: { countId: 'countAspirantes', titleKeys: ['asp_nombre', 'nombre'], secondaryKeys: ['asp_apellido1', 'email'] },
      Cursos: { countId: 'countCursos', titleKeys: ['asp_nombre', 'nombre'], secondaryKeys: ['curso', 'email'] },
      Profesores: { countId: 'countProfesores', titleKeys: ['nombre'], secondaryKeys: ['apellidoPaterno', 'email'] },
      Aulas: { countId: 'countAulas', titleKeys: ['nombre'], secondaryKeys: ['curso'] }
    };
    const cache = new Map();
    let activeCollection = 'aspirantes_admision';
    let activityTimer;

    function closeAdminSession() {
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(activityKey);
      window.location.replace('login.html');
    }

    if (!session?.id || !session?.email || !Number.isFinite(lastActivity) || Date.now() - lastActivity >= idleLimit) {
      closeAdminSession();
    } else {
      document.getElementById('adminName').textContent = session.nombre || session.email;
    }

    document.getElementById('logoutButton').addEventListener('click', closeAdminSession);

    function updateActivity() {
      if (!session) return;
      const now = Date.now();
      if (now - Number(localStorage.getItem(activityKey)) >= idleLimit) {
        closeAdminSession();
        return;
      }
      localStorage.setItem(activityKey, String(now));
  clearTimeout(activityTimer);
  activityTimer = setTimeout(closeAdminSession, idleLimit);
    }

    ['click', 'keydown', 'pointerdown', 'touchstart'].forEach((eventName) => {
      document.addEventListener(eventName, updateActivity, { passive: true });
    });

    function isSensitiveField(key) {
      return /password|contrase[nñ]a|secret|token/i.test(key);
    }

    function getDisplayEntries(data) {
      return Object.entries(data).filter(([key]) => !isSensitiveField(key));
    }

    function valueToText(value) {
      if (value === null || value === undefined || value === '') return '—';
      if (typeof value?.toDate === 'function') {
        return new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' }).format(value.toDate());
      }
      if (Array.isArray(value)) return value.map((item) => valueToText(item)).join('\n');
      if (typeof value === 'object') {
        if (typeof value.seconds === 'number') {
          return new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value.seconds * 1000));
        }
        return Object.entries(value)
          .filter(([key]) => !isSensitiveField(key))
          .map(([key, nestedValue]) => `${formatLabel(key)}: ${valueToText(nestedValue)}`)
          .join('\n');
      }
      return String(value);
    }

    function formatLabel(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[_-]+/g, ' ')
        .replace(/^./, (character) => character.toUpperCase());
    }

    function getValue(data, keys) {
      for (const key of keys) {
        if (data[key] !== undefined && data[key] !== '') return valueToText(data[key]);
      }
      return '';
    }

    function displayStudentName(data) {
      return [data.asp_nombre || data.nombre, data.asp_apellido1, data.asp_apellido2]
        .filter(Boolean)
        .join(' ') || data.email || 'Alumno sin nombre';
    }

    const classDays = [
      ['lunes', 'Lunes'],
      ['martes', 'Martes'],
      ['miercoles', 'Miércoles'],
      ['jueves', 'Jueves'],
      ['viernes', 'Viernes'],
      ['sabado', 'Sábado'],
      ['domingo', 'Domingo']
    ];

    function createScheduleFields(schedule = {}, totalHours = '') {
      const fields = document.createElement('div');
      fields.className = 'class-schedule-fields';
      const days = document.createElement('fieldset');
      days.className = 'schedule-days';
      const legend = document.createElement('legend');
      legend.textContent = 'Días de clase *';
      days.append(legend);
      classDays.forEach(([value, label]) => {
        const dayLabel = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = 'diasClase';
        checkbox.value = value;
        checkbox.checked = Array.isArray(schedule.dias) && schedule.dias.includes(value);
        dayLabel.append(checkbox, document.createTextNode(` ${label}`));
        days.append(dayLabel);
      });
      fields.append(days);

      [
        ['horaInicio', 'Hora de inicio *', schedule.horaInicio || ''],
        ['horaFin', 'Hora de fin *', schedule.horaFin || '']
      ].forEach(([name, text, value]) => {
        const label = document.createElement('label');
        label.append(document.createTextNode(text));
        const input = document.createElement('input');
        input.name = name;
        input.type = 'time';
        input.required = true;
        input.value = value;
        label.append(input);
        fields.append(label);
      });

      const totalHoursLabel = document.createElement('label');
      totalHoursLabel.append(document.createTextNode('Horas totales del curso *'));
      const totalHoursInput = document.createElement('input');
      totalHoursInput.name = 'horasCursoTotal';
      totalHoursInput.type = 'number';
      totalHoursInput.min = '0.25';
      totalHoursInput.step = '0.25';
      totalHoursInput.required = true;
      totalHoursInput.placeholder = 'Ej. 120';
      totalHoursInput.value = totalHours || '';
      totalHoursLabel.append(totalHoursInput);
      fields.append(totalHoursLabel);
      return fields;
    }

    function readClassSchedule(form) {
      const dias = Array.from(form.querySelectorAll('input[name="diasClase"]:checked'), (input) => input.value);
      const horaInicio = form.elements.horaInicio.value;
      const horaFin = form.elements.horaFin.value;
      const horasCursoTotal = Number(form.elements.horasCursoTotal.value);
      if (!dias.length) return { error: 'Selecciona al menos un día de clase.' };
      const [startHour, startMinute] = horaInicio.split(':').map(Number);
      const [endHour, endMinute] = horaFin.split(':').map(Number);
      const minutosPorClase = (endHour * 60 + endMinute) - (startHour * 60 + startMinute);
      if (!Number.isFinite(minutosPorClase) || minutosPorClase <= 0) {
        return { error: 'La hora de fin debe ser posterior a la hora de inicio.' };
      }
      if (!Number.isFinite(horasCursoTotal) || horasCursoTotal <= 0) {
        return { error: 'Ingresa un total de horas válido para el curso.' };
      }
      return {
        horario: {
          dias,
          horaInicio,
          horaFin,
          horasPorClase: minutosPorClase / 60
        },
        horasCursoTotal
      };
    }

    function getAssignableStudents() {
      return [
        ...(cache.get('aspirantes_admision') || []).map((record) => ({ ...record, collectionName: 'aspirantes_admision', courseLabel: record.data.curso || 'Admisión UNAM' })),
        ...(cache.get('Cursos') || []).map((record) => ({ ...record, collectionName: 'Cursos', courseLabel: record.data.curso || 'Otros cursos' }))
      ];
    }

    function createStudentPicker(students, selectedStudents = []) {
      const picker = document.createElement('div');
      picker.className = 'student-picker';
      const selectedKeys = new Set(selectedStudents.map((student) => `${student.coleccion}/${student.id}`));

      students.forEach(({ id, data, collectionName, courseLabel }) => {
        const option = document.createElement('label');
        option.className = 'student-option';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = `${collectionName}/${id}`;
        checkbox.checked = selectedKeys.has(checkbox.value);
        const text = document.createElement('span');
        text.textContent = `${displayStudentName(data)} · ${courseLabel}`;
        option.append(checkbox, text);
        picker.append(option);
      });

      if (!students.length) {
        const empty = document.createElement('span');
        empty.className = 'roster-message';
        empty.textContent = 'No hay alumnos disponibles para asignar.';
        picker.append(empty);
      }
      return picker;
    }

    function getSelectedStudents(picker, students) {
      const studentByKey = new Map(students.map((student) => [`${student.collectionName}/${student.id}`, student]));
      return Array.from(picker.querySelectorAll('input:checked'), (checkbox) => {
        const student = studentByKey.get(checkbox.value);
        return {
          id: student.id,
          coleccion: student.collectionName,
          email: student.data.email || '',
          nombre: displayStudentName(student.data)
        };
      });
    }

    function populateAssignmentOptions() {
      const teachers = cache.get('Profesores') || [];
      const students = getAssignableStudents();

      teacherSelect.replaceChildren(new Option('Selecciona un profesor', ''));
      teachers.forEach(({ id, data }) => {
        const label = `${displayStudentName(data)}${data.email ? ` · ${data.email}` : ''}`;
        teacherSelect.add(new Option(label, id));
      });

      studentSelect.replaceChildren(createStudentPicker(students));

      classroomFormMessage.textContent = teachers.length
        ? `${teachers.length} profesor(es) y ${students.length} alumno(s) disponibles para asignar.`
        : 'Aún no hay profesores registrados para asignar.';
      classroomSubmit.disabled = !teachers.length || !students.length;
    }

    function renderRecords() {
      const records = cache.get(activeCollection) || [];
      const config = collections[activeCollection];
      const searchTerm = searchInput.value.trim().toLocaleLowerCase('es');
      const visibleRecords = records.filter(({ data }) => {
        const searchable = getDisplayEntries(data)
          .map(([key, value]) => `${key} ${valueToText(value)}`)
          .join(' ')
          .toLocaleLowerCase('es');
        return searchable.includes(searchTerm);
      });

      recordsList.replaceChildren();
      if (!visibleRecords.length) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        emptyState.textContent = searchTerm ? 'No hay registros que coincidan con la búsqueda.' : 'Aún no hay registros en esta colección.';
        recordsList.append(emptyState);
        return;
      }

      visibleRecords.forEach(({ id, data }) => {
        const recordCollection = activeCollection;
        const details = document.createElement('details');
        details.className = 'record';
        const summary = document.createElement('summary');
        const summaryContent = document.createElement('span');
        const title = document.createElement('span');
        title.className = 'record-title';
        title.textContent = getValue(data, config.titleKeys) || 'Registro sin nombre';
        const secondary = document.createElement('span');
        secondary.className = 'record-meta';
        secondary.textContent = getValue(data, config.secondaryKeys) || `Documento: ${id}`;
        summaryContent.append(title, document.createElement('br'), secondary);
        summary.append(summaryContent);

        const detailContainer = document.createElement('div');
        detailContainer.className = 'record-details';
        const grid = document.createElement('div');
        grid.className = 'details-grid';
        const entries = getDisplayEntries(data);
        entries.sort(([left], [right]) => left.localeCompare(right, 'es'));
        entries.forEach(([key, value]) => {
          const item = document.createElement('div');
          item.className = 'detail-item';
          const label = document.createElement('span');
          label.className = 'detail-label';
          label.textContent = formatLabel(key);
          const displayValue = document.createElement('span');
          displayValue.className = 'detail-value';
          displayValue.textContent = valueToText(value);
          item.append(label, displayValue);
          grid.append(item);
        });
        const idItem = document.createElement('div');
        idItem.className = 'detail-item';
        const idLabel = document.createElement('span');
        idLabel.className = 'detail-label';
        idLabel.textContent = 'ID del documento';
        const idValue = document.createElement('span');
        idValue.className = 'detail-value';
        idValue.textContent = id;
        idItem.append(idLabel, idValue);
        grid.append(idItem);
        detailContainer.append(grid);
        if (['Profesores', 'aspirantes_admision', 'Cursos'].includes(recordCollection)) {
          const actions = document.createElement('div');
          actions.className = 'record-actions';
          const deleteRecordButton = document.createElement('button');
          deleteRecordButton.type = 'button';
          deleteRecordButton.textContent = recordCollection === 'Profesores' ? 'Eliminar profesor' : 'Eliminar alumno';
          const deleteMessage = document.createElement('p');
          deleteMessage.className = 'roster-message';
          deleteMessage.setAttribute('role', 'status');
          actions.append(deleteRecordButton);
          detailContainer.append(actions, deleteMessage);
          deleteRecordButton.addEventListener('click', async () => {
            const recordName = displayStudentName(data);
            const isTeacher = recordCollection === 'Profesores';
            const confirmation = isTeacher
              ? `¿Eliminar el registro del profesor "${recordName}"? Se quitará su asignación de las aulas, pero no se eliminará una cuenta independiente de Firebase Authentication.`
              : `¿Eliminar el registro del alumno "${recordName}"? Se quitará de las aulas; el historial de asistencia se conservará.`;
            if (!window.confirm(confirmation)) return;

            deleteRecordButton.disabled = true;
            deleteRecordButton.textContent = 'Eliminando...';
            deleteMessage.textContent = '';
            try {
              const aulasSnapshot = await getDocs(collection(db, 'Aulas'));
              const batch = writeBatch(db);
              const updatedClassrooms = [];
              let operationCount = 1;

              aulasSnapshot.docs.forEach((aulaDoc) => {
                const aula = aulaDoc.data();
                if (isTeacher) {
                  const matchesTeacher = aula.profesorDocId === id
                    || [data.authUid, id, data.email].filter(Boolean).includes(aula.profesorUid);
                  if (!matchesTeacher) return;

                  const update = {
                    profesorDocId: '',
                    profesorUid: '',
                    profesorEmail: '',
                    profesor: { nombre: 'Sin asignar', email: '' },
                    actualizadoEn: serverTimestamp()
                  };
                  batch.update(aulaDoc.ref, update);
                  updatedClassrooms.push({ id: aulaDoc.id, update });
                  operationCount += 1;
                  return;
                }

                const currentStudents = Array.isArray(aula.alumnos) ? aula.alumnos : [];
                const alumnos = currentStudents.filter((student) =>
                  !(student.id === id && student.coleccion === recordCollection)
                );
                if (alumnos.length === currentStudents.length) return;

                const update = { alumnos, actualizadoEn: serverTimestamp() };
                batch.update(aulaDoc.ref, update);
                updatedClassrooms.push({ id: aulaDoc.id, update });
                operationCount += 1;
              });

              if (operationCount > 500) {
                throw new Error('La operación excede el límite de escrituras por lote de Firestore.');
              }
              batch.delete(doc(db, recordCollection, id));
              await batch.commit();

              cache.set(recordCollection, (cache.get(recordCollection) || []).filter((record) => record.id !== id));
              document.getElementById(collections[recordCollection].countId).textContent = String(cache.get(recordCollection).length);
              const classroomCache = cache.get('Aulas') || [];
              updatedClassrooms.forEach(({ id: aulaId, update }) => {
                const aulaRecord = classroomCache.find((record) => record.id === aulaId);
                if (aulaRecord) Object.assign(aulaRecord.data, update);
              });
              statusLine.textContent = isTeacher
                ? 'Profesor eliminado y aulas relacionadas liberadas.'
                : 'Alumno eliminado y retirado de las aulas. El historial de asistencia se conservó.';
              renderRecords();
            } catch (error) {
              console.error(`No se pudo eliminar el registro ${recordCollection}/${id}:`, error);
              deleteMessage.textContent = 'No se pudo eliminar el registro y actualizar sus aulas. Revisa permisos de Firestore y conexión.';
              deleteRecordButton.disabled = false;
              deleteRecordButton.textContent = isTeacher ? 'Eliminar profesor' : 'Eliminar alumno';
            }
          });
        }
        if (activeCollection === 'Aulas') {
          const editForm = document.createElement('form');
          editForm.className = 'roster-editor';
          const editHeading = document.createElement('h3');
          editHeading.textContent = 'Administrar aula';
          const nameLabel = document.createElement('label');
          nameLabel.textContent = 'Nombre del aula';
          const nameInput = document.createElement('input');
          nameInput.name = 'nombre';
          nameInput.required = true;
          nameInput.maxLength = 100;
          nameInput.value = data.nombre || '';
          nameLabel.append(nameInput);
          const courseLabel = document.createElement('label');
          courseLabel.textContent = 'Curso';
          const courseInput = document.createElement('input');
          courseInput.name = 'curso';
          courseInput.required = true;
          courseInput.maxLength = 120;
          courseInput.value = data.curso || '';
          courseLabel.append(courseInput);
          const scheduleFields = createScheduleFields(data.horario || {}, data.horasCursoTotal);
          const teacherLabel = document.createElement('label');
          teacherLabel.textContent = 'Profesor asignado';
          const editTeacherSelect = document.createElement('select');
          editTeacherSelect.required = true;
          editTeacherSelect.add(new Option('Selecciona un profesor', ''));
          const teachers = cache.get('Profesores') || [];
          teachers.forEach(({ id: teacherId, data: teacherData }) => {
            const label = `${displayStudentName(teacherData)}${teacherData.email ? ` · ${teacherData.email}` : ''}`;
            editTeacherSelect.add(new Option(label, teacherId));
          });
          const assignedTeacher = teachers.find(({ id: teacherId, data: teacherData }) =>
            teacherId === data.profesorDocId
            || teacherData.email === data.profesorEmail
            || (data.profesorUid && [teacherData.authUid, teacherId, teacherData.email].includes(data.profesorUid))
          );
          editTeacherSelect.value = assignedTeacher?.id || '';
          teacherLabel.append(editTeacherSelect);
          const rosterHint = document.createElement('p');
          rosterHint.className = 'roster-message';
          rosterHint.textContent = 'Marca los alumnos que deben pertenecer a esta aula. Desmarca los que quieras quitar.';
          const studentPicker = createStudentPicker(getAssignableStudents(), Array.isArray(data.alumnos) ? data.alumnos : []);
          const actions = document.createElement('div');
          actions.className = 'roster-actions';
          const saveButton = document.createElement('button');
          saveButton.type = 'submit';
          saveButton.textContent = 'Guardar cambios';
          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'delete-classroom';
          deleteButton.textContent = 'Eliminar aula';
          actions.append(saveButton, deleteButton);
          const editMessage = document.createElement('p');
          editMessage.className = 'roster-message';
          editMessage.setAttribute('role', 'status');
          editForm.append(editHeading, nameLabel, courseLabel, scheduleFields, teacherLabel, rosterHint, studentPicker, actions, editMessage);
          editForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const schedule = readClassSchedule(editForm);
            if (schedule.error) {
              editMessage.textContent = schedule.error;
              return;
            }
            const selectedTeacher = teachers.find(({ id: teacherId }) => teacherId === editTeacherSelect.value);
            if (!selectedTeacher) {
              editMessage.textContent = 'Selecciona un profesor registrado.';
              return;
            }
            saveButton.disabled = true;
            deleteButton.disabled = true;
            saveButton.textContent = 'Guardando...';
            editMessage.textContent = '';
            try {
              const alumnos = getSelectedStudents(studentPicker, getAssignableStudents());
              await updateDoc(doc(db, 'Aulas', id), {
                alumnos,
                nombre: nameInput.value.trim(),
                curso: courseInput.value.trim(),
                ...schedule,
                profesorDocId: selectedTeacher.id,
                profesorUid: selectedTeacher.data.authUid || selectedTeacher.id,
                profesorEmail: selectedTeacher.data.email || '',
                profesor: {
                  nombre: displayStudentName(selectedTeacher.data),
                  email: selectedTeacher.data.email || ''
                },
                actualizadoEn: serverTimestamp()
              });
              const aulaIndex = (cache.get('Aulas') || []).findIndex((aula) => aula.id === id);
              if (aulaIndex !== -1) {
                cache.get('Aulas')[aulaIndex].data = {
                  ...cache.get('Aulas')[aulaIndex].data,
                  alumnos,
                  nombre: nameInput.value.trim(),
                  curso: courseInput.value.trim(),
                  ...schedule,
                  profesorDocId: selectedTeacher.id,
                  profesorUid: selectedTeacher.data.authUid || selectedTeacher.id,
                  profesorEmail: selectedTeacher.data.email || '',
                  profesor: {
                    nombre: displayStudentName(selectedTeacher.data),
                    email: selectedTeacher.data.email || ''
                  }
                };
              }
              statusLine.textContent = 'Aula y asignaciones actualizadas.';
              renderRecords();
            } catch (error) {
              console.error(`No se pudo actualizar el aula ${id}:`, error);
              editMessage.textContent = 'No se pudieron guardar los cambios. Revisa permisos y conexión de Firestore.';
            } finally {
              saveButton.disabled = false;
              deleteButton.disabled = false;
              saveButton.textContent = 'Guardar cambios';
            }
          });
          deleteButton.addEventListener('click', async () => {
            const classroomName = data.nombre || 'esta aula';
            if (!window.confirm(`¿Eliminar "${classroomName}" y todas sus listas de asistencia? Esta acción no se puede deshacer.`)) return;

            saveButton.disabled = true;
            deleteButton.disabled = true;
            deleteButton.textContent = 'Eliminando...';
            editMessage.textContent = '';
            try {
              const attendanceSnapshot = await getDocs(collection(db, 'Aulas', id, 'asistencias'));
              for (const attendanceDoc of attendanceSnapshot.docs) {
                await deleteDoc(attendanceDoc.ref);
              }
              await deleteDoc(doc(db, 'Aulas', id));
              cache.set('Aulas', (cache.get('Aulas') || []).filter((aula) => aula.id !== id));
              document.getElementById('countAulas').textContent = String(cache.get('Aulas').length);
              statusLine.textContent = 'Aula eliminada junto con sus listas de asistencia.';
              renderRecords();
            } catch (error) {
              console.error(`No se pudo eliminar el aula ${id} y sus asistencias:`, error);
              editMessage.textContent = 'No se pudo completar la eliminación. Revisa permisos y conexión de Firestore.';
              saveButton.disabled = false;
              deleteButton.disabled = false;
              deleteButton.textContent = 'Eliminar aula';
            }
          });
          detailContainer.append(editForm);
        }
        details.append(summary, detailContainer);
        recordsList.append(details);
      });
    }

    async function loadCollection(name) {
      statusLine.textContent = 'Cargando registros...';
      recordsList.replaceChildren();
      try {
        if (!cache.has(name)) {
          const snapshot = await getDocs(collection(db, name));
          const records = snapshot.docs.map((record) => ({ id: record.id, data: record.data() }));
          records.sort((left, right) => {
            const leftDate = left.data.fechaRegistro?.toMillis?.() || 0;
            const rightDate = right.data.fechaRegistro?.toMillis?.() || 0;
            return rightDate - leftDate;
          });
          cache.set(name, records);
          document.getElementById(collections[name].countId).textContent = String(records.length);
        }
        statusLine.textContent = `${cache.get(name).length} registros`;
        renderRecords();
      } catch (error) {
        console.error(`No se pudieron cargar los registros de ${name}:`, error);
        statusLine.textContent = 'No se pudieron cargar los datos. Revisa las reglas de acceso de Firestore.';
        const errorState = document.createElement('div');
        errorState.className = 'empty-state';
        errorState.textContent = 'Acceso denegado o conexión no disponible.';
        recordsList.replaceChildren(errorState);
      }
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        activeCollection = tab.dataset.collection;
        document.querySelectorAll('.tab').forEach((button) => button.setAttribute('aria-selected', String(button === tab)));
        teacherCreateLink.hidden = activeCollection !== 'Profesores';
        classroomForm.hidden = activeCollection !== 'Aulas';
        searchInput.value = '';
        loadCollection(activeCollection);
      });
    });

    classroomForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!classroomForm.reportValidity()) return;

      const schedule = readClassSchedule(classroomForm);
      if (schedule.error) {
        classroomFormMessage.textContent = schedule.error;
        return;
      }
      const selectedTeacher = teacherSelect.selectedOptions[0];
      const teacher = (cache.get('Profesores') || []).find(({ id }) => id === selectedTeacher.value);
      const students = getSelectedStudents(studentSelect, getAssignableStudents());

      if (!teacher || students.length === 0) {
        classroomFormMessage.textContent = 'Selecciona un profesor y al menos un alumno.';
        return;
      }

      classroomSubmit.disabled = true;
      classroomSubmit.textContent = 'Guardando aula...';
      try {
        const aulaData = {
          nombre: classroomForm.elements.nombre.value.trim(),
          curso: classroomForm.elements.curso.value.trim(),
          ...schedule,
          profesorDocId: teacher.id,
          profesorUid: teacher.data.authUid || teacher.id,
          profesorEmail: teacher.data.email || '',
          profesor: {
            nombre: displayStudentName(teacher.data),
            email: teacher.data.email || ''
          },
          alumnos: students,
          fechaRegistro: serverTimestamp(),
          estado: 'activa'
        };
        const aulaRef = await addDoc(collection(db, 'Aulas'), aulaData);
        const savedData = { ...aulaData, fechaRegistro: new Date() };
        cache.set('Aulas', [{ id: aulaRef.id, data: savedData }, ...(cache.get('Aulas') || [])]);
        document.getElementById('countAulas').textContent = String(cache.get('Aulas').length);
        classroomForm.reset();
        classroomFormMessage.textContent = 'Aula creada y asignaciones guardadas.';
        statusLine.textContent = `${cache.get('Aulas').length} aulas`;
        renderRecords();
      } catch (error) {
        console.error('No se pudo crear el aula:', error);
        classroomFormMessage.textContent = 'No se pudo guardar el aula. Revisa permisos y conexión de Firestore.';
      } finally {
        classroomSubmit.disabled = false;
        classroomSubmit.innerHTML = '<i data-lucide="plus"></i> Crear aula y asignar';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    });

    searchInput.addEventListener('input', renderRecords);

    try {
      const adminRecord = await getDoc(doc(db, 'admins', session.id));
      if (!adminRecord.exists() || adminRecord.data().correo !== session.email) {
        closeAdminSession();
      } else {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        await Promise.all(Object.entries(collections).map(async ([name, config]) => {
          try {
            const snapshot = await getDocs(collection(db, name));
            const records = snapshot.docs.map((record) => ({ id: record.id, data: record.data() }));
            records.sort((left, right) => (right.data.fechaRegistro?.toMillis?.() || 0) - (left.data.fechaRegistro?.toMillis?.() || 0));
            cache.set(name, records);
            document.getElementById(config.countId).textContent = String(records.length);
          } catch (error) {
            console.error(`No se pudieron precargar los registros de ${name}:`, error);
            cache.set(name, []);
          }
        }));
        populateAssignmentOptions();
        statusLine.textContent = `${cache.get(activeCollection)?.length || 0} registros`;
        renderRecords();
      }
    } catch (error) {
      console.error('No se pudo validar o cargar el panel administrativo:', error);
      statusLine.textContent = 'No se pudo validar el acceso administrativo. Revisa la conexión y las reglas de Firestore.';
    }

    window.addEventListener('storage', (event) => {
      if (event.key === sessionKey && !event.newValue) closeAdminSession();
    });
    activityTimer = setTimeout(closeAdminSession, Math.max(0, idleLimit - (Date.now() - lastActivity)));
  </script>
</body>
</html>
