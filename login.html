<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - Portal del Estudiante</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #00a8e8 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .header-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-logo img {
      width: 90px;
      height: auto;
      object-fit: contain;
    }
    h2 {
      margin: 8px 0 6px;
      color: #0f172a;
      text-align: center;
      font-size: 1.5rem;
    }
    p.subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin: 0 0 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #00a8e8;
      box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.15);
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      padding-right: 44px;
    }
    .toggle-password {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      border-radius: 4px;
    }
    .toggle-password:hover {
      color: #0f172a;
      background-color: #f1f5f9;
    }
    .toggle-password svg {
      width: 20px;
      height: 20px;
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #475569;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .remember-me input {
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #00a8e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #0086ba;
    }
    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      display: none;
    }
    .error { background: #ffe6e6; color: #990000; border: 1px solid #f5c6cb; }
    .success { background: #e6ffed; color: #006622; border: 1px solid #b7f0c9; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header-logo">
      <img src="logon.png" alt="Logo">
    </div>
    
    <h2>Portal del Estudiante</h2>
    <p class="subtitle">Ingresa con tus credenciales registradas</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" required minlength="6" maxlength="8" placeholder="6-8 caracteres">
          <button type="button" id="btnTogglePassword" class="toggle-password" title="Mostrar u ocultar contraseña">
            <svg id="iconEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="iconEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe"> Recordar datos
        </label>
      </div>

      <button type="submit" id="btnLogin" class="btn-submit">Ingresar</button>
    </form>

    <div id="msgBox" class="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      where, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC64X_uSvL_Sn1WQLw7ZV9QDme2aOfV5ag",
      authDomain: "docere-931ec.firebaseapp.com",
      projectId: "docere-931ec",
      storageBucket: "docere-931ec.firebasestorage.app",
      messagingSenderId: "1005663843239",
      appId: "1:1005663843239:web:d8f6c7524a5d10bf797c82",
      measurementId: "G-B6TDT4VE7S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnTogglePassword = document.getElementById('btnTogglePassword');
    const iconEye = document.getElementById('iconEye');
    const iconEyeOff = document.getElementById('iconEyeOff');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const msgBox = document.getElementById('msgBox');
    const btnLogin = document.getElementById('btnLogin');

    const savedEmail = localStorage.getItem("saved_student_email");
    const savedPassword = localStorage.getItem("saved_student_password");
    if (savedEmail && savedPassword) {
      emailInput.value = savedEmail;
      passwordInput.value = savedPassword;
      rememberMeCheckbox.checked = true;
    }

    btnTogglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      iconEye.style.display = isPassword ? 'none' : 'block';
      iconEyeOff.style.display = isPassword ? 'block' : 'none';
    });

    function showMessage(text, isError = false) {
      msgBox.textContent = text;
      msgBox.className = `message ${isError ? 'error' : 'success'}`;
      msgBox.style.display = 'block';
    }

    async function buscarEstudiante(email, password) {
      const colecciones = ["Cursos", "aspirantes_admision"];

      for (const nombreColeccion of colecciones) {
        const q = query(
          collection(db, nombreColeccion),
          where("email", "==", email),
          where("password", "==", password)
        );

        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          const docData = querySnapshot.docs[0].data();
          return {
            id: querySnapshot.docs[0].id,
            coleccion: nombreColeccion,
            ...docData
          };
        }
      }
      return null;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.style.display = 'none';
      btnLogin.disabled = true;
      btnLogin.textContent = "Verificando...";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        const estudiante = await buscarEstudiante(email, password);

        if (estudiante) {
          if (rememberMeCheckbox.checked) {
            localStorage.setItem("saved_student_email", email);
            localStorage.setItem("saved_student_password", password);
          } else {
            localStorage.removeItem("saved_student_email");
            localStorage.removeItem("saved_student_password");
          }

          const sessionData = {
            id: estudiante.id,
            nombre: `${estudiante.asp_nombre} ${estudiante.asp_apellido1}`,
            email: estudiante.email,
            curso: estudiante.curso || 'UNAM',
            coleccion: estudiante.coleccion
          };
          localStorage.setItem("studentSession", JSON.stringify(sessionData));

          showMessage("¡Acceso correcto! Redirigiendo...");

          setTimeout(() => {
            window.location.href = "panel_estudiante.html";
          }, 1000);

        } else {
          showMessage("Correo o contraseña incorrectos.", true);
        }
      } catch (error) {
        console.error("Error al autenticar:", error);
        showMessage("Ocurrió un error al intentar iniciar sesión.", true);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
